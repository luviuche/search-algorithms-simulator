<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Captura — simulador CC2</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/pantallas.css">
</head>
<body>
  <!--
    Deja la aplicación en un estado concreto para fotografiarla. El estado se
    elige con el parámetro ?vista= de la URL:
      menu       → catálogo (por defecto)
      binaria    → búsqueda binaria a media traza
      secuencial → búsqueda secuencial a media traza
      hash       → función módulo, insertando una clave que colisiona
      hash-libre → función módulo, insertando en una casilla libre
      anidados   → arreglos anidados: la tabla y su estructura secundaria
      encadenamiento → encadenamiento secuencial: la cadena de una dirección
      arbol-digital  → árbol de búsqueda digital con la palabra «prueba»
      eliminar-secuencial → eliminando una clave del medio, con desplazamiento
      eliminar-binaria    → lo mismo, localizando la clave por división
      eliminar-hash       → eliminando del medio de un sondeo: el grupo de
                            atrás vuelve a pasar por la función hash
      cubetas             → otras búsquedas dinámicas: las 17 claves del
                            taller resuelto (n0=2, r=3), hasta la última
                            expansión

    Con ?paso=fin se recorre la traza completa en lugar de detenerse en el
    primer paso, que es lo que hay que mirar en la vista apilada y en el
    cálculo de la dirección; llega hasta el paso final, sin resaltados. Con
    ?paso=ultimo se queda un paso antes, en el último del algoritmo. El tratamiento de colisiones se elige con
    ?tratamiento=ninguno|reasignacion (por defecto, reasignación).

    Uso:
      msedge --headless --disable-gpu --window-size=1600,1000 \
             --screenshot=salida.png --virtual-time-budget=8000 \
             "file:///…/pruebas/captura.html?vista=hash&paso=fin"
  -->
  <div id="app"></div>

  <script src="../js/manifiesto.js"></script>
  <script>
    // ?recientes=5 siembra estructuras recientes de ejemplo antes de que se
    // monte el menú, y ?recientes=0 las borra. Sin esto las capturas del
    // menú salían siempre sin la tira: el navegador sin interfaz no tiene
    // ninguna guardada, y el menú real casi siempre las muestra.
    (function () {
      const cuantas = new URLSearchParams(location.search).get('recientes');
      if (cuantas === null) return;
      const ejemplo = [
        { temaTitulo: 'Búsqueda binaria externa', detalle: 'N = 23 · 5 bloques de 5' },
        { temaTitulo: 'Función módulo', detalle: 'n = 12 · l = 4' },
        { temaTitulo: 'Índices primarios, secundarios y multinivel', detalle: 'r = 500000 · B = 4096' },
        { temaTitulo: 'Búsqueda binaria', detalle: 'n = 24 · l = 2' },
        { temaTitulo: 'Árbol de Huffman', detalle: 'árbol de Huffman' }
      ].slice(0, Number(cuantas)).map((item) => Object.assign({ fecha: new Date().toISOString() }, item));
      try {
        window.localStorage.setItem('cc2:recientes', JSON.stringify(ejemplo));
      } catch (error) { /* sin almacenamiento, la captura sale sin recientes */ }
    })();
  </script>
  <script src="../js/app.js"></script>

  <script>
    function enviar(formulario, valores) {
      for (const [nombre, valor] of Object.entries(valores)) {
        const campo = formulario.querySelector(`[name="${nombre}"]`);
        if (campo) campo.value = valor;
      }
      formulario.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    }

    // Insertar, buscar y eliminar comparten un panel: se escribe la clave una
    // vez y el botón dice qué hacer con ella.
    function operar(formularios, accion, valor) {
      asentarSiSeCongela();
      const panel = formularios.find((formulario) => formulario.querySelector('[name="clave"]'));
      panel.querySelector('[name="clave"]').value = valor;
      panel.querySelector(`[data-accion="${accion}"]`).click();
    }

    // El catálogo es un índice con todo a la vista (CLAUDE.md 2): entrar a un
    // tema es un solo clic en su renglón, sin recorrer categorías.
    //
    // **Por título exacto y no por `includes`**: en el índice conviven
    // "Búsqueda secuencial" y "Búsqueda secuencial externa", y un `includes`
    // entraría siempre al primero que aparezca.

    function entrarATema(nombreTema) {
      const renglon = [...document.querySelectorAll('.indice__tema')]
        .find((el) => el.querySelector('.indice__tema-titulo').textContent === nombreTema);
      if (!renglon) throw new Error(`No está en el índice: ${nombreTema}`);
      renglon.click();
      return [...document.querySelectorAll('form.panel')];
    }

    const parametros = new URLSearchParams(location.search);
    // El reproductor vive en su propio panel: la operación puede ser buscar o
    // insertar, y ninguna de las dos es dueña del control.
    const avanzar = (veces) => {
      // Sin avanzar, la operación seguiría reproduciéndose sola: se pausa.
      if (veces === 0) document.querySelector('[data-accion="reproducir"]').click();
      const boton = document.querySelector('[data-accion="siguiente"]');
      for (let i = 0; i < veces; i++) {
        if (i === veces - 1) asentarSiSeCongela();
        boton.click();
      }
    };

    // ?instante=<ms> fotografía una animación a medio camino: la del último
    // clic de la preparación —la operación que empieza, o el último paso al
    // que se avanza—, congelada a esos milisegundos. Lo de los clics
    // anteriores se da por terminado, o saldría todo encimado. Va sin
    // `--quieto`, que apaga las animaciones (2026-10-08, para ver el árbol
    // cambiar de tamaño al aparecer el cálculo).
    const instante = parametros.has('instante') ? Number(parametros.get('instante')) : null;
    function asentarSiSeCongela() {
      if (instante === null) return;
      for (const animacion of document.getAnimations()) animacion.finish();
    }
    function congelarSiSePide() {
      if (instante === null) return;
      for (const animacion of document.getAnimations()) {
        animacion.pause();
        animacion.currentTime = instante;
      }
    }
    // ?paso= acepta `fin` (recorre la traza entera), un número de pasos —para
    // detenerse en uno concreto, como el que marca la casilla que se elimina—
    // o nada, que se queda en el primero.
    //
    // `ultimo` se detiene en el último paso del algoritmo, uno antes del que
    // cierra toda operación sin resaltados (2026-09-24): es donde se ven la
    // casilla insertada o encontrada y su marca.
    const pasosAAvanzar = (alFinal = 20) => {
      const paso = parametros.get('paso');
      if (paso === 'fin') return alFinal;
      if (paso === 'ultimo') {
        setTimeout(() => document.querySelector('[data-accion="anterior"]').click(), 0);
        return alFinal;
      }
      // `0` se queda en el paso con que arranca la operación, sin avanzar: es
      // el que dispara la entrada del panel del cálculo (con ?instante=).
      if (paso === '0') return 0;
      const contados = Number(paso);
      return Number.isFinite(contados) && contados > 0 ? contados : 1;
    };

    function prepararBusqueda(nombreTema) {
      const formularios = entrarATema(nombreTema);
      // `&n=`, `&claves=10,20,…` y `&clave=` cambian el ejercicio, como en las
      // eliminaciones.
      enviar(formularios[0], { n: Number(parametros.get('n')) || 24, l: 2 });
      const claves = parametros.get('claves')
        ? parametros.get('claves').split(',').map(Number)
        : [10, 18, 24, 31, 37, 42, 50, 63, 71, 84, 90, 97];
      for (const clave of claves) {
        operar(formularios, 'insertar', clave);
      }
      if (parametros.get('buscar') === 'no') { avanzar(pasosAAvanzar(20)); return; }
      // `&llenar=1` pulsa «Llenado automático», que inserta de a una con
      // pausas: hace falta tiempo virtual para que termine (`--presupuesto`).
      if (parametros.get('llenar')) {
        document.querySelector('[data-accion="llenado-automatico"]').click();
        return;
      }
      operar(formularios, 'buscar', Number(parametros.get('clave')) || 84);
      avanzar(pasosAAvanzar());
    }

    // La captura interesante de la transformación de claves es la inserción:
    // es donde se ve el cálculo revelándose junto a la casilla que resulta.
    // El tema se elige con ?tema=, para poder fotografiar el desarrollo de
    // cualquiera de las cinco funciones sin escribir una vista por cada una.
    function prepararHash({ colisiona }) {
      const formularios = entrarATema(parametros.get('tema') || 'Función módulo');
      // n, l y la clave final se pueden fijar por URL para fotografiar un
      // ejercicio concreto del docente sin tocar esta página. Sin ellos, la
      // estructura de 12 casillas de siempre.
      enviar(formularios[0], {
        n: Number(parametros.get('n')) || 12,
        l: Number(parametros.get('l')) || 4,
        posiciones: parametros.get('posiciones') || '',
        base: parametros.get('base') || '',
        operacion: parametros.get('operacion') || 'sumar',
        tratamiento: parametros.get('tratamiento') || 'reasignacion'
      });
      // 1004, 1016 y 1028 caen todas en la dirección 9: preparan el terreno
      // para que la última inserción tenga algo con qué chocar.
      for (const clave of [1004, 1010, 1023, 1035, 1016]) {
        operar(formularios, 'insertar', clave);
        avanzar(12);
      }
      operar(formularios, 'insertar', Number(parametros.get('clave')) || (colisiona ? 1028 : 1001));
      avanzar(pasosAAvanzar());
    }

    // Eliminación (CLAUDE.md 5.6). En las ordenadas la clave se localiza con
    // el algoritmo del tema y las siguientes cierran el hueco; con ?paso=fin
    // se llega al desplazamiento, y sin él al paso que marca la casilla.
    function prepararEliminacion(nombreTema) {
      const formularios = entrarATema(nombreTema);
      // `&n=` y `&claves=10,20,…` repiten otro ejercicio, como el de la prueba
      // de humo (n = 12, de 10 a 80 de diez en diez).
      enviar(formularios[0], { n: Number(parametros.get('n')) || 24, l: 2 });
      const claves = parametros.get('claves')
        ? parametros.get('claves').split(',').map(Number)
        : [10, 18, 24, 31, 37, 42, 50, 63, 71, 84, 90, 97];
      for (const clave of claves) {
        operar(formularios, 'insertar', clave);
      }
      operar(formularios, 'eliminar', Number(parametros.get('clave')) || 84);
      avanzar(pasosAAvanzar());
    }

    // Arreglos anidados: varias claves con la misma dirección, para que se vea
    // la matriz -la tabla en la primera columna y su arreglo al lado-.
    function prepararAnidados() {
      const formularios = entrarATema(parametros.get('tema') || 'Función módulo');
      enviar(formularios[0], {
        n: Number(parametros.get('n')) || 12,
        l: Number(parametros.get('l')) || 4,
        tamanoAnidado: parametros.get('anidado') || '',
        tratamiento: 'anidados'
      });
      // 1004, 1016 y 1028 comparten dirección con n = 12: las tres van a dar
      // al mismo arreglo anidado.
      for (const clave of [1004, 1010, 1023, 1035, 1016]) {
        operar(formularios, 'insertar', clave);
        avanzar(12);
      }
      operar(formularios, 'insertar', Number(parametros.get('clave')) || 1028);
      avanzar(pasosAAvanzar());
    }

    // Encadenamiento secuencial: varias claves con la misma dirección, para
    // que se vea la cadena colgando de su casilla con las flechas del enlace.
    function prepararEncadenamiento() {
      const formularios = entrarATema(parametros.get('tema') || 'Función módulo');
      enviar(formularios[0], {
        n: Number(parametros.get('n')) || 10,
        l: Number(parametros.get('l')) || 4,
        tratamiento: 'encadenamiento'
      });
      // 7412, 5312 y 9912 comparten dirección con n = 10: las tres van a dar
      // a la misma cadena, que es lo que hay que fotografiar.
      for (const clave of [7412, 5312, 1023, 9912, 1035]) {
        operar(formularios, 'insertar', clave);
        avanzar(12);
      }
      operar(formularios, 'insertar', Number(parametros.get('clave')) || 1112);
      avanzar(pasosAAvanzar());
    }

    // Árbol de búsqueda digital: el ejercicio de clase es la palabra «prueba»,
    // que se inserta entera y deja el árbol con ramas a lado y lado.
    // ?construir=<n> deja la palabra a medio insertar, a n pasos de empezar:
    // con 0 o 1, la primera letra todavía no está en el árbol y solo se ve su
    // cálculo (2026-10-08, el lienzo vacío seguía diciendo «Inserte…»).
    const pasosDeLaPalabra = (completa) => (parametros.has('construir') ? Number(parametros.get('construir')) : completa);

    function prepararArbolDigital() {
      const formularios = entrarATema('Árbol de búsqueda digital');
      // Sin panel de configuración: el árbol se crea al entrar al tema.
      const panel = formularios[0];
      panel.querySelector('[name="palabra"]').value = parametros.get('palabra') || 'prueba';
      panel.querySelector('[data-accion="insertar-palabra"]').click();
      // La palabra viaja en una sola traza: seis letras, cada una con su
      // cálculo y su recorrido.
      avanzar(pasosDeLaPalabra(40));

      // Con ?operacion= se fotografía además una búsqueda o una eliminación
      // sobre el árbol ya armado; ?paso= se aplica entonces a esa operación.
      const operacion = parametros.get('operacion');
      if (!operacion) return;
      operar(formularios, operacion, parametros.get('clave') || 'u');
      avanzar(pasosAAvanzar(20));
    }

    // Residuos: el mismo ejercicio de clase, pero con las claves solo en las
    // hojas y los nodos de en medio dibujados como punto de bifurcación.
    function prepararResiduos() {
      const formularios = entrarATema('Árbol de búsqueda por residuos');
      const panel = formularios[0];
      panel.querySelector('[name="palabra"]').value = parametros.get('palabra') || 'prueba';
      panel.querySelector('[data-accion="insertar-palabra"]').click();
      // Más pasos que el árbol digital: cada choque suma la bajada de la clave
      // que ya estaba, además de la del que entra.
      avanzar(pasosDeLaPalabra(80));

      const operacion = parametros.get('operacion');
      if (!operacion) return;
      operar(formularios, operacion, parametros.get('clave') || 'a');
      avanzar(pasosAAvanzar(20));
    }

    // Residuos múltiples: el esqueleto completo, como el tablero. Cada nodo
    // abre sus ramas lleven a una clave o no, y por eso se ve extenso.
    function prepararResiduosMultiples() {
      const formularios = entrarATema('Árbol de búsqueda por residuos múltiples');
      const panel = formularios[0];
      panel.querySelector('[name="palabra"]').value = parametros.get('palabra') || 'prueba';
      panel.querySelector('[data-accion="insertar-palabra"]').click();
      avanzar(pasosDeLaPalabra(80));

      const operacion = parametros.get('operacion');
      if (!operacion) return;
      operar(formularios, operacion, parametros.get('clave') || 'a');
      avanzar(pasosAAvanzar(20));
    }

    // La eliminación que hay que ver en una tabla hash es la que obliga a
    // redispersar: se borra la clave del medio de un sondeo y las de atrás
    // vuelven a pasar por la función.
    function prepararEliminacionHash() {
      const formularios = entrarATema(parametros.get('tema') || 'Función módulo');
      enviar(formularios[0], {
        n: Number(parametros.get('n')) || 12,
        l: Number(parametros.get('l')) || 4,
        posiciones: parametros.get('posiciones') || '',
        base: parametros.get('base') || '',
        operacion: parametros.get('operacion') || 'sumar',
        tratamiento: parametros.get('tratamiento') || 'reasignacion'
      });
      // 1004, 1016 y 1028 comparten dirección: las tres forman el grupo que
      // la eliminación tiene que volver a dispersar.
      for (const clave of [1004, 1010, 1023, 1035, 1016, 1028]) {
        operar(formularios, 'insertar', clave);
        avanzar(12);
      }
      // La redispersión es larga: cada clave del grupo trae su cálculo entero.
      operar(formularios, 'eliminar', Number(parametros.get('clave')) || 1016);
      avanzar(pasosAAvanzar(40));
    }

    // Otras búsquedas dinámicas: n0 = 2, r = 3, en modo total por defecto. No
    // pide longitud de clave (CLAUDE.md 5.7), así que aquí van las 17 claves
    // tal como las trae el taller resuelto, mezclando cifras de dos y tres
    // dígitos sin ningún ajuste. Cada expansión trae su propia secuencia de
    // reubicación, así que avanzar necesita margen de sobra.
    function prepararCubetas() {
      const formularios = entrarATema('Otras búsquedas dinámicas');
      enviar(formularios[0], {
        n: Number(parametros.get('n')) || 2,
        r: Number(parametros.get('r')) || 3,
        modoExpansion: parametros.get('modo') || 'total',
        umbralExpandir: Number(parametros.get('expandir')) || 82,
        umbralReducir: Number(parametros.get('reducir')) || 125
      });
      // Con `?claves=` vacío se fotografía la estructura recién creada, que es
      // donde se ve cómo queda dibujada una cubeta sin nada dentro.
      const claves = parametros.has('claves')
        ? parametros.get('claves').split(',').filter(Boolean).map(Number)
        : [115, 96, 48, 79, 35, 26, 57, 81, 70, 64, 107, 45, 62, 98, 33, 28, 38];
      // Con `?paso=` la última clave se deja a medio reproducir, que es la
      // única forma de fotografiar un momento intermedio —la colisión, antes
      // de que la expansión lo tape— sin depender de que la traza se agote.
      const aMedias = parametros.has('paso') && parametros.get('paso') !== 'fin';
      claves.forEach((clave, indice) => {
        operar(formularios, 'insertar', clave);
        avanzar(aMedias && indice === claves.length - 1 ? pasosAAvanzar() : 80);
      });
      const operacion = parametros.get('operacion');
      if (!operacion) return;
      operar(formularios, operacion, Number(parametros.get('clave')) || 48);
      avanzar(pasosAAvanzar(80));
    }

    // Búsqueda secuencial externa: el archivo del ejemplo del docente —N = 23,
    // que da 5 bloques de 5 con el último de 3— con doce claves ordenadas, y
    // una búsqueda que descarta un bloque entero antes de entrar al que la
    // contiene. Con ?n= grande se fotografía la elisión, que es la que
    // comprime los bloques ya comparados.
    //
    // Binaria externa usa la misma preparación con su tema: el archivo y las
    // claves son los mismos, cambia solo el orden en que se leen los bloques.
    function prepararSecuencialExterna(nombreTema = 'Búsqueda secuencial externa') {
      const formularios = entrarATema(nombreTema);
      const n = Number(parametros.get('n')) || 23;
      enviar(formularios[0], { n, l: Number(parametros.get('l')) || 4 });

      const claves = parametros.get('claves')
        ? parametros.get('claves').split(',').map(Number)
        : [1010, 1023, 1105, 1204, 1310, 2011, 2230, 3020, 3145, 3388, 4102, 4521];
      for (const clave of claves) operar(formularios, 'insertar', clave);

      const operacion = parametros.get('operacion') || 'buscar';
      operar(formularios, operacion, Number(parametros.get('clave')) || 3020);
      avanzar(pasosAAvanzar(40));
    }

    // Árbol de Huffman: el ejemplo del docente —CIENCIAS— construido entero.
    // Con ?paso= se fotografía un momento de la construcción; con `fin`, el
    // árbol terminado y su tabla.
    function prepararHuffman() {
      const formularios = entrarATema('Árbol de Huffman');
      const panel = formularios[0];
      panel.querySelector('[name="palabra"]').value = parametros.get('palabra') || 'ciencias';
      panel.querySelector('[data-accion="insertar-palabra"]').click();
      avanzar(pasosAAvanzar(20));
    }

    // Índices: el ejercicio de la hoja del docente, que es el que hay que poder
    // comparar contra su letra. `?tipo=` y `?niveles=` dan las cuatro
    // combinaciones; `multinivel` con `secundario` es la de cuatro columnas,
    // que es la que obliga al lienzo a desplazarse.
    function prepararIndices() {
      const formularios = entrarATema('Índices primarios, secundarios y multinivel');
      enviar(formularios[0], {
        r: Number(parametros.get('r')) || 500000,
        B: Number(parametros.get('B')) || 4096,
        R: Number(parametros.get('R')) || 120,
        Ri: Number(parametros.get('Ri')) || 15,
        tipo: parametros.get('tipo') || 'primario',
        niveles: parametros.get('niveles') || 'un-nivel'
      });
      avanzar(pasosAAvanzar(10));
    }

    // Abrir un archivo `.cc2` de verdad: se construye el JSON, se le entrega al
    // `input type="file"` con un DataTransfer —que es la única forma de
    // simular la elección de un archivo— y se dispara el `change`. La lectura
    // es asíncrona, así que la captura la pilla ya cargada gracias al
    // presupuesto de tiempo virtual.
    function prepararAbrirArchivo() {
      // Con `?tema=` se abre el mismo archivo en otro tema, que es la gracia:
      // las claves de secuencial vistas en binaria, o en una tabla hash.
      const formularios = entrarATema(parametros.get('tema') || 'Búsqueda secuencial');
      enviar(formularios[0], { n: 24, l: 2, r: 3, umbralExpandir: 82, umbralReducir: 125 });
      // Insertar en una estructura ordenada es instantáneo: no hay traza que
      // agotar antes de abrir el archivo.
      if (!parametros.get('datos')) for (const clave of [11, 22, 33]) operar(formularios, 'insertar', clave);

      // `&datos=<json>` reemplaza el archivo entero: así se fotografía abrir
      // un archivo de cubetas expandido, o uno con claves que no valen aquí.
      const datos = parametros.get('datos') ? JSON.parse(parametros.get('datos')) : {
        version: 1,
        tema: 'secuencial',
        tipoClave: 'numerica',
        modo: 'ordenada',
        n: Number(parametros.get('n')) || 12,
        l: 2,
        tratamiento: null,
        parametros: {},
        claves: (parametros.get('claves') || '50,10,30,90,70').split(',').map(Number),
        creadaEn: new Date().toISOString()
      };
      const transferencia = new DataTransfer();
      transferencia.items.add(new File([JSON.stringify(datos)], 'prueba.cc2', { type: 'application/json' }));
      const selector = document.querySelector('input[type="file"]');
      selector.files = transferencia.files;
      selector.dispatchEvent(new Event('change'));
    }

    // Con el menú ya montado y las fuentes cargadas (`CC2.listo`, app.js).
    window.CC2.listo.then(() => {
      preparar();
      congelarSiSePide();
    });
    function preparar() {
      const vista = parametros.get('vista') || 'menu';
      if (vista === 'menu') return;
      // La pantalla recién entrada, sin operar: ?vista=entrar&titulo=<tema del
      // índice>. Es lo primero que ve el estudiante y lo que más fácil se
      // olvida revisar (el cuadro vacío de Reproducción, 2026-09-30).
      if (vista === 'entrar') return entrarATema(parametros.get('titulo'));
      if (vista === 'hash') return prepararHash({ colisiona: true });
      if (vista === 'hash-libre') return prepararHash({ colisiona: false });
      if (vista === 'anidados') return prepararAnidados();
      if (vista === 'encadenamiento') return prepararEncadenamiento();
      if (vista === 'arbol-digital') return prepararArbolDigital();
      if (vista === 'residuos') return prepararResiduos();
      if (vista === 'residuos-multiples') return prepararResiduosMultiples();
      if (vista === 'eliminar-hash') return prepararEliminacionHash();
      if (vista === 'cubetas') return prepararCubetas();
      if (vista === 'secuencial-externa') return prepararSecuencialExterna();
      if (vista === 'binaria-externa') return prepararSecuencialExterna('Búsqueda binaria externa');
      if (vista === 'huffman') return prepararHuffman();
      if (vista === 'indices') return prepararIndices();
      if (vista === 'abrir-archivo') return prepararAbrirArchivo();
      if (vista === 'eliminar-binaria') return prepararEliminacion('Búsqueda binaria');
      if (vista === 'eliminar-secuencial') return prepararEliminacion('Búsqueda secuencial');
      prepararBusqueda(vista === 'binaria' ? 'Búsqueda binaria' : 'Búsqueda secuencial');
    }
    // `&editar=1` abre la configuración plegada, como el enlace «Editar» del
    // resumen: es donde aparece «Cancelar».
    // Con el menú ya montado y las fuentes cargadas (`CC2.listo`, app.js).
    window.CC2.listo.then(() => {
      if (!parametros.get('editar')) return;
      setTimeout(() => document.querySelector('[data-accion="editar-configuracion"]').click(), 50);
    });
  </script>
</body>
</html>

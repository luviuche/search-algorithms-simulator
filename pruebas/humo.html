      control('siguiente').click();
      afirmar(lineasCalculo().length === 3, 'la tercera línea da la dirección');
      afirmar(
        !!casillaEn(3).querySelector('.casilla--en-evaluacion'),
        'la casilla 3 queda señalada antes de recibir la clave'
      );
      afirmar(
        casillaEn(3).querySelector('.casilla').textContent === '',
        'la clave todavía no está colocada: el cálculo terminó, la inserción no'
      );

      control('siguiente').click();
      afirmar(
        casillaEn(3).querySelector('.casilla').textContent === '7412',
        'el último paso coloca la clave en la casilla 3'
      );
      registro.push('  estructura: ' + retratarEstructura());

      // Retroceder tiene que deshacer el efecto, no solo repintar: si la clave
      // se quedara puesta, la estructura dejaría de corresponder al paso.
      control('anterior').click();
      afirmar(
        casillaEn(3).querySelector('.casilla').textContent === '',
        'retroceder retira la clave que el paso había colocado'
      );
      control('siguiente').click();

      // Crear otra estructura con una inserción a medio reproducir no puede
      // arrastrar la clave pendiente a la estructura nueva.
      operar(formularios, 'insertar', 1111);
      enviar(formularios[0], { n: 10, l: 4, tratamiento: 'ninguno' });
      afirmar(
        document.querySelectorAll('.fila-casilla .casilla--vacia').length === 10,
        'crear otra estructura no arrastra la clave a medio insertar'
      );

      operar(formularios, 'insertar', 7412);
      agotarTraza();
      operar(formularios, 'buscar', 7412);
      const retrato = hastaElUltimoPasoDelAlgoritmo();
      afirmar(retrato.includes('encontrada'), 'la búsqueda localiza la clave por su dirección');
      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(metricas[0] === '1', `una sola comparación, sea cual sea n (reporta ${metricas[0]})`);
      afirmar(metricas[2] === '0,10', `el factor de carga reporta 1 de 10 (reporta ${metricas[2]})`);

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Sin tratamiento la colisión es el final del camino: la clave no entra y
    // la casilla lo dice. Es el comportamiento que deja ver la función pura.
    function hashColisionSinTratamiento() {
      registro.push('', '── Función módulo · colisión sin tratamiento ──');

      const formularios = entrarAModulo({ n: 10, l: 4, tratamiento: 'ninguno' });
      operar(formularios, 'insertar', 7412);
      agotarTraza();
      // 5312 mod 10 = 2 → dirección 3, la misma que 7412.
      operar(formularios, 'insertar', 5312);
      const retrato = hastaElUltimoPasoDelAlgoritmo();
      registro.push('  estructura: ' + retrato);

      afirmar(retrato.includes('colision'), 'la casilla en conflicto se marca como colisión');
      afirmar(
        casillaEn(3).querySelector('.casilla').textContent === '7412',
        'la clave que ya estaba conserva su casilla'
      );
      afirmar(
        [...document.querySelectorAll('.fila-casilla .casilla')]
          .every((casilla) => casilla.textContent !== '5312'),
        'la clave rechazada no entra en ninguna casilla'
      );

      const bitacora = [...document.querySelectorAll('.bitacora__fila')].map((f) => f.textContent);
      registro.push('  bitácora: ' + bitacora[bitacora.length - 1]);

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Con reasignación la clave termina lejos de su dirección, y el rastro de
    // cada casilla probada es justamente lo que el documento exige mostrar.
    function hashReasignacion() {
      registro.push('', '── Función módulo · reasignación ──');

      const formularios = entrarAModulo({ n: 10, l: 4, tratamiento: 'reasignacion' });
      for (const clave of [7412, 5312]) {
        operar(formularios, 'insertar', clave);
        agotarTraza();
      }
      operar(formularios, 'insertar', 9912);
      const retrato = hastaElUltimoPasoDelAlgoritmo();
      registro.push('  estructura: ' + retrato);

      afirmar(
        casillaEn(3).querySelector('.casilla').textContent === '7412',
        'la primera clave se queda en su dirección'
      );
      afirmar(
        casillaEn(4).querySelector('.casilla').textContent === '5312',
        'la segunda se reasigna a la casilla siguiente'
      );
      afirmar(
        casillaEn(5).querySelector('.casilla').textContent === '9912',
        'la tercera sigue avanzando hasta la primera casilla libre'
      );
      // Lo que el sondeo saltó se apaga, como lo comparado en secuencial, y el
      // rojo queda solo para la colisión (maqueta del usuario, 2026-09-28).
      afirmar(
        casillaEn(3).querySelector('.casilla').classList.contains('casilla--colision')
          && casillaEn(4).querySelector('.casilla').classList.contains('casilla--descartada'),
        'la dirección que chocó queda en rojo y la casilla que el sondeo saltó, apagada'
      );
      afirmarCalculoJuntoASuCasilla('en el último sondeo');

      agotarTraza();
      // Al irse, el panel sale del flujo y se desvanece donde estaba; se
      // esconde cuando termina, y ese aviso llega después de esta prueba, que
      // es síncrona. Lo que sí es inmediato es que ya no ocupa sitio.
      const panelCalculo = document.querySelector('.calculo');
      afirmar(
        panelCalculo.hidden || getComputedStyle(panelCalculo).position === 'absolute',
        'sin operación en curso, el panel del cálculo deja de ocupar sitio en el lienzo'
      );
      afirmar(
        document.querySelector('.calculo-pico').hidden || getComputedStyle(panelCalculo).position === 'absolute',
        'sin operación en curso, el pico se va con el panel'
      );

      operar(formularios, 'buscar', 9912);
      const retratoBusqueda = hastaElUltimoPasoDelAlgoritmo();
      afirmar(retratoBusqueda.includes('encontrada'), 'la búsqueda repite el recorrido y halla la clave');
      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(metricas[0] === '3', `la búsqueda gasta 3 comparaciones (reporta ${metricas[0]})`);

      document.querySelector('.pantalla-tema__volver').click();
    }

    // El último paso de una búsqueda fallida no tiene rango: su fila se dibuja
    // entera y toda apagada (2026-09-27), en vez de quedar vacía y parecer un
    // error de dibujo.
    function binariaSinResultado() {
      registro.push('', '── Búsqueda binaria · clave ausente ──');

      entrarATema('Búsqueda binaria');

      const formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 16, l: 2 });
      for (const clave of [10, 20, 30, 40, 50, 60, 70, 80]) operar(formularios, 'insertar', clave);

      operar(formularios, 'buscar', 45);
      hastaElUltimoPasoDelAlgoritmo();

      const ultimaFila = retratarApilado().pop();
      registro.push('  última fila: ' + ultimaFila);
      afirmar(
        /descartada/.test(ultimaFila) && !/ocupada|en-evaluacion|encontrada/.test(ultimaFila),
        `la última fila queda entera y toda apagada (${ultimaFila})`
      );
      afirmar(
        !document.querySelector('.estructura-apilada').textContent.includes('undefined'),
        'ninguna fila dibuja undefined'
      );

      control('siguiente').click();
      afirmar(
        !document.querySelector('.estructura-apilada'),
        'al cerrar, el apilado se va y queda la estructura como queda'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Búsqueda por residuos: mismo dibujo por niveles que el árbol digital,
    // pero con las claves solo en las hojas. Lo que hay que ver aquí es que
    // ninguna clave quede en un nodo con hijos, que los nodos de en medio sean
    // puntos y no casillas, y que el árbol —que es más hondo y más ancho que
    // el digital— quepa en su lienzo sin desplazarse.
    function residuos() {
      registro.push('', '── Búsqueda por residuos ──');

      entrarATema('Árbol de búsqueda por residuos');
      const formularios = [...document.querySelectorAll('form.panel')];
      const operaciones = formularios[0];

      afirmar(formularios.length === 1, `el tema no dibuja panel de configuración (${formularios.length} formulario(s))`);
      // El árbol existe desde que se entra al tema: vacío, el lienzo invita a
      // insertar y no a crear la estructura (usuario, 2026-09-30: antes
      // quedaba en blanco).
      afirmar(
        /Inserte una letra/.test((document.querySelector('.estructura-vacia') || {}).textContent || ''),
        'el árbol existe desde que se entra al tema, y vacío dice qué hacer'
      );
      afirmarEstructuraCentrada('árbol de búsqueda digital');

      operaciones.querySelector('[name="palabra"]').value = 'prueba';
      operaciones.querySelector('[data-accion="insertar-palabra"]').click();
      // El primer paso es el cálculo del código de la p, con el árbol todavía
      // vacío: el lienzo ya no puede pedir que se inserte (visto por el
      // usuario, 2026-10-08).
      afirmar(
        !document.querySelector('.estructura-vacia'),
        'con la palabra ya entrando, el lienzo deja de pedir que se inserte una'
      );
      agotarTraza(120);

      const casillas = () => [...document.querySelectorAll('.arbol .casilla')];
      const letras = () => casillas()
        .map((el) => el.textContent.replace(/[^a-z]/g, ''))
        .filter(Boolean)
        .sort()
        .join('');
      const puntos = () => document.querySelectorAll('.arbol__bifurcacion').length;

      registro.push(`  árbol de «prueba»: ${letras()} · ${puntos()} bifurcaciones`);
      afirmar(letras() === 'abepru', `las seis letras quedan dibujadas (${letras()})`);
      afirmar(puntos() === 7, `los nodos de en medio se dibujan como punto (${puntos()})`);
      afirmar(
        casillas().length === 6,
        `solo las claves llevan casilla (${casillas().length} casilla(s) para 6 claves)`
      );

      // Que las claves vivan **solo en las hojas** no se ve contando: se ve en
      // que de ninguna casilla salga una arista hacia abajo. Es la diferencia
      // con el árbol digital, y la única forma de comprobarla sobre el dibujo.
      const aristas = [...document.querySelectorAll('.arbol__arista')];
      const svgEl = document.querySelector('.arbol__aristas');
      // En píxeles del SVG, no de pantalla: el árbol lleva `zoom`.
      const escala = svgEl.getBoundingClientRect().width / Number(svgEl.getAttribute('width')) || 1;
      const conHijos = casillas().filter((casilla) => {
        const caja = casilla.getBoundingClientRect();
        const svg = svgEl.getBoundingClientRect();
        const centroX = (caja.left - svg.left + caja.width / 2) / escala;
        const pie = (caja.top - svg.top + caja.height) / escala;
        return aristas.some((arista) => (
          Math.abs(Number(arista.getAttribute('x1')) - centroX) < 2
          && Math.abs(Number(arista.getAttribute('y1')) - pie) < 2
        ));
      });
      afirmar(conHijos.length === 0, `ninguna clave tiene ramas colgando (${conHijos.length} con hijos)`);
      afirmar(aristas.length === 12, `cada nodo que no es la raíz entra por una arista (${aristas.length})`);
      afirmarCasillasParejas('residuos');

      // El lienzo del árbol scrollea (`overflow: auto`), así que su rectángulo
      // siempre cae dentro del viewport aunque por dentro sobresalga: hay que
      // medir el contenido y no la caja.
      const lienzo = document.querySelector('.estructura-arbol');
      // Lo que se mide es el dibujo final, no un cuadro del FLIP: esta prueba
      // avanza sin dejar correr el tiempo, y una casilla en vuelo todavía está
      // donde salió (desde que el árbol se ajusta al lienzo, 2026-10-04).
      for (const animacion of document.getAnimations()) animacion.finish();
      afirmar(
        lienzo.scrollWidth <= lienzo.clientWidth + 1,
        `el árbol cabe a lo ancho de su lienzo (${lienzo.scrollWidth} en ${lienzo.clientWidth})`
      );
      afirmar(
        lienzo.scrollHeight <= lienzo.clientHeight + 1,
        `el árbol cabe a lo alto de su lienzo (${lienzo.scrollHeight} en ${lienzo.clientHeight})`
      );

      const metricas = () => [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(metricas()[2] === '5', `la altura cuenta niveles (reporta ${metricas()[2]})`);

      // La lección del tema: se baja tanto como diga el código y se compara una
      // sola vez, al llegar a la hoja.
      operar(formularios, 'buscar', 'a');
      agotarTraza(20);
      registro.push(`  buscar a: ${metricas()[0]} comparación(es), ${metricas()[1]} accesos`);
      afirmar(metricas()[0] === '1', `buscar compara una sola vez (reporta ${metricas()[0]})`);
      afirmar(metricas()[1] === '5', `bajar hasta la hoja cuesta 5 accesos (reporta ${metricas()[1]})`);

      // Camino cortado: h = 01000 se sale del árbol en el bit 2, y esa posición
      // vacía sí se dibuja como casilla, porque es donde la clave iría.
      operar(formularios, 'buscar', 'h');
      agotarTraza(20);
      afirmar(
        !!aviso() && aviso().textContent.includes('no existe'),
        'el camino cortado prueba que la clave no está'
      );
      afirmar(metricas()[0] === '0', `sin hoja a la que llegar no se compara nada (reporta ${metricas()[0]})`);

      // Al eliminar, la rama se recoge: b sube y el árbol pierde un nivel.
      operar(formularios, 'eliminar', 'a');
      agotarTraza(20);
      registro.push(`  tras eliminar a: ${letras()} · ${puntos()} bifurcaciones · altura ${metricas()[2]}`);
      afirmar(letras() === 'bepru', `la clave sale del árbol (${letras()})`);
      // La altura no baja —p y r siguen en el nivel 5—, pero la rama de a y b
      // sí se recoge: b sube al sitio de su bifurcación, que desaparece.
      afirmar(puntos() === 6, `la rama se recoge y su bifurcación desaparece (${puntos()} bifurcaciones)`);
      afirmar(metricas()[2] === '5', `p y r mantienen la altura en 5 (reporta ${metricas()[2]})`);
      afirmar(
        casillas().every((el) => el.textContent.trim() !== ''),
        'no queda ningún hueco dibujado tras cerrar la eliminación'
      );

      vaciar();
      afirmar(letras() === '' && puntos() === 0, 'reiniciar deja el árbol sin claves ni bifurcaciones');

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Residuos múltiples: un bloque de bits por nivel en vez de un bit, y el
    // esqueleto dibujado completo como en el tablero. Lo que hay que ver es que
    // cada nodo abre todas sus ramas lleven a una clave o no, que los rótulos de
    // esas cuatro ramas se puedan leer, y que el mismo ejercicio baje de cinco
    // niveles a tres — que es lo que el método compra.
    function residuosMultiples() {
      registro.push('', '── Residuos múltiples ──');

      entrarATema('Árbol de búsqueda por residuos múltiples');
      const formularios = [...document.querySelectorAll('form.panel')];
      const operaciones = formularios[0];

      afirmar(formularios.length === 1, `el tema no dibuja panel de configuración (${formularios.length} formulario(s))`);

      afirmar(
        document.querySelectorAll('.arbol__bifurcacion').length === 0,
        `el tema abre con el lienzo vacío (${document.querySelectorAll('.arbol__bifurcacion').length} bifurcación(es))`
      );

      operaciones.querySelector('[name="palabra"]').value = 'prueba';
      operaciones.querySelector('[data-accion="insertar-palabra"]').click();
      agotarTraza(140);

      const casillas = () => [...document.querySelectorAll('.arbol .casilla')];
      const letras = () => casillas()
        .map((el) => el.textContent.replace(/[^a-z]/g, ''))
        .filter(Boolean)
        .sort()
        .join('');
      const puntos = () => document.querySelectorAll('.arbol__bifurcacion').length;
      const metricas = () => [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);

      registro.push(`  árbol de «prueba»: ${letras()} · ${puntos()} bifurcaciones · altura ${metricas()[2]}`);
      afirmar(letras() === 'abepru', `las seis letras quedan dibujadas (${letras()})`);
      afirmar(metricas()[2] === '4', `toda clave baja sus tres bloques y queda en el nivel 4 (altura ${metricas()[2]})`);

      // Las seis claves a la misma altura: es lo que separa este tema de
      // residuos, donde cada clave para en cuanto queda sola. Se lee el `top`
      // en línea y no el rectángulo: una casilla recién recolocada lleva encima
      // el `transform` del FLIP, que la deja en su sitio anterior hasta que la
      // animación corra, y aquí se estaría midiendo eso y no la retícula.
      const alturas = [...new Set(casillas().map((el) => el.style.top))];
      afirmar(alturas.length === 1, `las seis claves quedan a la misma altura (${alturas.join(', ')})`);

      // Esqueleto completo hasta el penúltimo nivel —1 + 4 + 16— más las seis
      // posiciones con clave del último.
      const dibujadas = casillas().length + puntos();
      afirmar(dibujadas === 27, `el esqueleto va completo hasta el nivel 3 (${dibujadas} posiciones, se esperan 27)`);
      afirmar(puntos() === 21, `del último nivel no se dibuja ni un punto vacío (${puntos()} puntos, se esperan 21)`);
      afirmar(
        document.querySelectorAll('.arbol__arista').length === 26,
        `cada posición que no es la raíz entra por una arista (${document.querySelectorAll('.arbol__arista').length})`
      );

      // Las claves siguen viviendo solo en las hojas: de ninguna casilla sale
      // una arista hacia abajo.
      const aristas = [...document.querySelectorAll('.arbol__arista')];
      const svgEl = document.querySelector('.arbol__aristas');
      const svg = svgEl.getBoundingClientRect();
      // El árbol crece o encoge con el lienzo (`zoom`): la pantalla mide en
      // píxeles escalados y el SVG en los suyos. Sin dividir, a otro tamaño
      // de ventana la comparación no casaba nada y pasaba sin mirar.
      const escala = svg.width / Number(svgEl.getAttribute('width')) || 1;
      const conHijos = casillas().filter((casilla) => {
        const caja = casilla.getBoundingClientRect();
        const centroX = (caja.left - svg.left + caja.width / 2) / escala;
        const pie = (caja.top - svg.top + caja.height) / escala;
        return aristas.some((arista) => (
          Math.abs(Number(arista.getAttribute('x1')) - centroX) < 2
          && Math.abs(Number(arista.getAttribute('y1')) - pie) < 2
        ));
      });
      afirmar(conHijos.length === 0, `ninguna clave tiene ramas colgando (${conHijos.length} con hijos)`);

      // Los rótulos son lo que dice por qué la clave tomó ese camino: cuatro
      // saliendo del mismo nodo se amontonan si no se separan a propósito.
      // Cada rótulo va justo después de su arista (`crearAristas`), y la arista
      // empieza en su padre: así se sabe de qué nodo sale cada uno.
      const rotulos = [...document.querySelectorAll('.arbol__bit')]
        .map((el) => {
          const arista = el.previousElementSibling;
          return {
            x: Number(el.getAttribute('x')),
            y: Number(el.getAttribute('y')),
            t: el.textContent,
            padre: `${Math.round(Number(arista.getAttribute('x1')))},${Math.round(Number(arista.getAttribute('y1')))}`
          };
        });
      // La raíz abre sus cuatro ramas, pero **solo llevan bit las que conducen
      // a una clave** (opción 1a, usuario, 2026-09-28): con «prueba», 00 y 10.
      // Las otras dos van punteadas y sin rótulo. El primer nivel está a 68 px.
      const altoRaiz = Math.min(...aristas.map((arista) => Number(arista.getAttribute('y1'))));
      const ramasRaiz = aristas.filter((arista) => Number(arista.getAttribute('y1')) === altoRaiz);
      const vaciasRaiz = ramasRaiz.filter((arista) => arista.classList.contains('arbol__arista--vacia'));
      const deLaRaiz = rotulos.filter((r) => r.y < 68).map((r) => r.t).sort().join(' ');
      afirmar(
        ramasRaiz.length === 4 && vaciasRaiz.length === 2 && deLaRaiz === '00 10',
        `la raíz abre sus cuatro ramas, y solo las dos con claves llevan bit (${ramasRaiz.length} ramas, ${vaciasRaiz.length} vacías, rótulos «${deLaRaiz}»)`
      );
      // Entre hermanos, que es donde la forma del árbol los amontona. Rótulos
      // de nodos distintos se cruzan un instante mientras el árbol se
      // recoloca, y esta prueba mide con el FLIP en vuelo: a 1280 px, donde el
      // árbol va encogido, dos de ellos coincidían justo en ese momento y la
      // prueba fallaba sobre un dibujo que quieto está bien (2026-10-07).
      const encimados = rotulos.filter((a, i) => rotulos.some((b, j) => (
        j !== i && a.padre === b.padre && Math.abs(a.x - b.x) < 12 && Math.abs(a.y - b.y) < 8
      )));
      afirmar(encimados.length === 0, `ningún rótulo se monta sobre otro (${encimados.length} encimado(s))`);

      const lienzo = document.querySelector('.estructura-arbol');
      for (const animacion of document.getAnimations()) animacion.finish();
      afirmar(
        lienzo.scrollWidth <= lienzo.clientWidth + 1,
        `el esqueleto cabe a lo ancho de su lienzo (${lienzo.scrollWidth} en ${lienzo.clientWidth})`
      );
      afirmar(
        lienzo.scrollHeight <= lienzo.clientHeight + 1,
        `el esqueleto cabe a lo alto de su lienzo (${lienzo.scrollHeight} en ${lienzo.clientHeight})`
      );

      // Que el árbol quepa no basta: el árbol no se encoge, así que al crecer
      // empuja al panel del cálculo, y el escenario lo recorta sin avisar. Hay
      // que mirar los dos.
      const escenario = document.querySelector('.lienzo__escenario').getBoundingClientRect();
      const panelCalculo = document.querySelector('.calculo');
      afirmar(
        Math.round(panelCalculo.getBoundingClientRect().right) <= Math.round(escenario.right) + 1,
        'el cálculo no se sale del lienzo empujado por el árbol'
      );
      afirmar(
        panelCalculo.scrollWidth <= panelCalculo.clientWidth + 1,
        `el cálculo no queda recortado (${panelCalculo.scrollWidth} en ${panelCalculo.clientWidth})`
      );
      afirmarCasillasParejas('residuos múltiples');

      // El sitio del cálculo se reserva solo durante la operación (opción B,
      // 2026-10-08): al empezar, el árbol se achica para dejarle sitio, y al
      // terminar vuelve a crecer. **El cambio se anima como un bloque**, así
      // que en el primer cuadro cada nodo tiene que verse justo donde estaba;
      // si no, salta y después viaja. Y una vez quieto, el panel no puede
      // quedar encima del árbol.
      const terminarAnimaciones = () => { for (const animacion of document.getAnimations()) animacion.finish(); };
      const dondeSeVe = () => new Map([...document.querySelectorAll('.arbol [data-clave]')]
        .map((el) => [el.dataset.clave, el.getBoundingClientRect()]));
      const salto = (antes, ahora) => Math.max(0, ...[...antes]
        .filter(([clave]) => ahora.has(clave))
        .map(([clave, r]) => Math.hypot(r.left - ahora.get(clave).left, r.top - ahora.get(clave).top)));
      // Por la caja del árbol, que es lo que se ve: con el panel apretado
      // (opción D, 2026-10-09) el árbol sigue más allá y se desplaza dentro de
      // ella. Y el panel entero dentro del lienzo, que es lo que se perdía en
      // un proyector de 1024 × 650.
      const separados = () => {
        const caja = document.querySelector('.estructura-arbol').getBoundingClientRect();
        const panel = panelCalculo.getBoundingClientRect();
        const lienzo = document.querySelector('.lienzo__escenario').getBoundingClientRect();
        return caja.right <= panel.left + 1 && panel.right <= lienzo.right + 1;
      };
      // El nodo del paso, dentro de lo que se ve de la caja.
      const pasoALaVista = () => {
        const nodo = document.querySelector('.arbol__bifurcacion--activa, .arbol .casilla--evaluacion');
        if (!nodo) return true;
        const caja = document.querySelector('.estructura-arbol').getBoundingClientRect();
        const r = nodo.getBoundingClientRect();
        return r.left >= caja.left - 1 && r.right <= caja.right + 1;
      };
      terminarAnimaciones();
      const enReposo = dondeSeVe();
      operar(formularios, 'buscar', 'a');
      const alEntrar = salto(enReposo, dondeSeVe());
      afirmar(alEntrar < 2, `al aparecer el cálculo, el árbol arranca de donde estaba (salta ${alEntrar.toFixed(1)} px)`);
      terminarAnimaciones();
      afirmar(separados(), 'con el cálculo a la vista, el árbol le deja su sitio y el panel cabe en el lienzo');
      control('siguiente').click();
      terminarAnimaciones();
      afirmar(pasoALaVista(), 'el nodo del paso queda a la vista aunque el árbol no quepa entero');

      hastaElUltimoPasoDelAlgoritmo();
      terminarAnimaciones();
      const enOperacion = dondeSeVe();
      control('siguiente').click();
      const alSalir = salto(enOperacion, dondeSeVe());
      afirmar(alSalir < 2, `al irse el cálculo, el árbol arranca de donde estaba (salta ${alSalir.toFixed(1)} px)`);
      terminarAnimaciones();

      // La lección: leer dos bits de un golpe llega a la clave en menos accesos
      // que leerlos de uno en uno, y se sigue comparando una sola vez.
      operar(formularios, 'buscar', 'a');
      agotarTraza(20);
      registro.push(`  buscar a: ${metricas()[0]} comparación(es), ${metricas()[1]} accesos (en residuos eran 1 y 5)`);
      afirmar(metricas()[0] === '1', `buscar compara una sola vez (reporta ${metricas()[0]})`);
      afirmar(metricas()[1] === '4', `llegar a la clave cuesta 4 accesos y no 5 (reporta ${metricas()[1]})`);

      // h = 01000 se va por la rama 01 de la raíz, que está dibujada y vacía.
      operar(formularios, 'buscar', 'h');
      agotarTraza(20);
      afirmar(metricas()[0] === '0', `por una rama vacía no se compara nada (reporta ${metricas()[0]})`);

      // Al eliminar no sube nada: e se queda al final de su código aunque
      // quede sola en su rama.
      operar(formularios, 'eliminar', 'a');
      agotarTraza(20);
      operar(formularios, 'eliminar', 'b');
      hastaElUltimoPasoDelAlgoritmo();
      registro.push(`  tras eliminar a y b: ${letras()} · altura ${metricas()[2]}`);
      afirmar(letras() === 'epru', `las dos claves salen del árbol (${letras()})`);
      afirmar(metricas()[2] === '4', `las que quedan siguen al final de su código (altura ${metricas()[2]})`);
      // Aquí no sube ninguna clave a tapar el hueco, así que la posición que se
      // vació se queda marcada: es lo que hay que ver al eliminar.
      afirmar(
        !!document.querySelector('.arbol .casilla--eliminada'),
        'la posición que se vació queda marcada donde estaba la clave'
      );

      vaciar();
      afirmar(letras() === '', 'vaciar deja el árbol sin claves');

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Otras búsquedas dinámicas: la única estructura donde n cambia solo. La
    // aritmética exacta del taller ya está probada en `cubetas.test.js`, sin
    // pasar por el DOM; aquí lo que hay que ver es que el formulario acepte
    // sus parámetros propios (r, modo, umbrales), que la matriz de cubetas se
    // dibuje alineada, y que reiniciar vuelva al n inicial y no al que
    // alcanzó por expansión.
    function cubetas() {
      registro.push('', '── Otras búsquedas dinámicas ──');

      entrarATema('Otras búsquedas dinámicas');
      const formularios = [...document.querySelectorAll('form.panel')];
      afirmar(
        !formularios[0].querySelector('[name="l"]'),
        'el formulario no pide longitud de clave: las claves no tienen una fija'
      );
      enviar(formularios[0], {
        n: 2, r: 3, modoExpansion: 'total', umbralExpandir: 82, umbralReducir: 125
      });

      const metricas = () => [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);

      for (const clave of [15, 26, 48, 79, 35, 62, 57, 81]) {
        operar(formularios, 'insertar', clave);
        agotarTraza(80);
      }

      registro.push('  métricas: ' + metricas().join(' · '));
      afirmar(metricas()[2] === '4', `n terminó en 4 tras la expansión (reporta ${metricas()[2]})`);

      afirmarCasillasParejas('otras búsquedas dinámicas');
      afirmarRenglonesAlineados('otras búsquedas dinámicas');
      afirmarEscalaAlineada(
        'otras búsquedas dinámicas',
        [...document.querySelectorAll('.columna-etiquetas .renglon__marca')],
        [...document.querySelectorAll('.columna-casilla:not(.columna-etiquetas)')[0].querySelectorAll('.casilla')]
      );

      // Al eliminar, la métrica pasa a la densidad que decide si se reduce
      // (pedido del usuario, 2026-10-12): claves por cubeta, sin `r`, que pasa
      // de 100 %. Con 7 claves en 4 cubetas, 175 %; la de expandir diría 58,3.
      const rotuloDensidad = () => document.querySelectorAll('.metrica__etiqueta')[3].textContent;
      afirmar(rotuloDensidad() === 'Densidad de ocupación', `al insertar, la métrica es la densidad de ocupación (dice «${rotuloDensidad()}»)`);
      operar(formularios, 'eliminar', 48);
      agotarTraza(20);
      afirmar(
        metricas()[2] === '4',
        'eliminar una sola clave no alcanza a bajar la densidad del umbral de reducir'
      );
      afirmar(
        rotuloDensidad() === 'Densidad para reducir' && metricas()[3] === '175,0\u00a0%',
        `al eliminar, la métrica es la densidad para reducir: 7 claves en 4 cubetas (dice «${rotuloDensidad()}», ${metricas()[3]})`
      );

      vaciar();
      afirmar(
        metricas()[2] === '2',
        `vaciar vuelve al n inicial y no al que la estructura alcanzó por expansión (reporta ${metricas()[2]})`
      );
      afirmar(rotuloDensidad() === 'Densidad de ocupación', `al vaciar, la métrica vuelve a la densidad de ocupación (dice «${rotuloDensidad()}»)`);

      // El momento de la colisión, tal como lo escribe el docente en el taller
      // (CLAUDE.md 5.7): con n = 3 la clave 81 no cabe en la cubeta 0 y se
      // queda esperando en la fila «Col», que es lo que hace legible el
      // D.O. = 8/9 = 88,9 % de la línea siguiente.
      enviar(formularios[0], {
        n: 2, r: 3, modoExpansion: 'parcial', umbralExpandir: 82, umbralReducir: 125
      });
      for (const clave of [115, 96, 48, 79, 35, 26, 57]) {
        operar(formularios, 'insertar', clave);
        agotarTraza(80);
      }
      afirmar(metricas()[2] === '3', `antes de chocar, la estructura va por n = 3 (reporta ${metricas()[2]})`);

      operar(formularios, 'insertar', 81);
      for (let i = 0; i < 4; i++) control('siguiente').click();

      const col = [...document.querySelectorAll('.columna-casilla')]
        .map((c) => c.lastElementChild)
        .filter((el) => el && el.classList.contains('casilla'));
      registro.push('  fila Col: ' + col.map((c) => c.textContent).join(','));
      afirmar(
        col.length === 1 && col[0].textContent === '81',
        `la clave que chocó espera en la fila «Col» (reporta ${col.map((c) => c.textContent).join(',') || 'nada'})`
      );
      afirmar(
        [...document.querySelectorAll('.renglon__marca')].some((m) => m.textContent === 'Col'),
        'la fila lleva su rótulo «Col», como en el taller'
      );
      registro.push('  densidad con la clave esperando: ' + metricas()[3]);
      afirmar(
        metricas()[3] === '88,9\u00a0%',
        `la densidad cuenta la clave que espera: 8/9 = 88,9 % (reporta ${metricas()[3]})`
      );

      // **Col guarda, no expande** (corrección del usuario, 2026-10-14): con
      // un umbral que no se alcanza, la 8 y la 10 chocan con la cubeta 0
      // llena y se quedan en su Col, a la vista al terminar la operación.
      vaciar();
      enviar(formularios[0], {
        n: 2, r: 3, modoExpansion: 'total', umbralExpandir: 99, umbralReducir: 1
      });
      for (const clave of [2, 4, 6, 8, 10]) {
        operar(formularios, 'insertar', clave);
        agotarTraza(30);
      }
      const enCol = () => [...document.querySelectorAll('.columna-casilla')]
        .flatMap((columna) => [...columna.children].filter((el) => el.classList.contains('casilla')).slice(3))
        .map((el) => el.textContent);
      afirmar(metricas()[2] === '2', `una cubeta llena no expande sin la densidad (n = ${metricas()[2]})`);
      afirmar(
        enCol().join(',') === '8,10',
        `Col guarda las dos claves que chocaron y se ven al terminar (reporta ${enCol().join(',') || 'nada'})`
      );
      operar(formularios, 'buscar', 10);
      agotarTraza(30);
      afirmar(
        document.querySelector('.alerta').textContent.includes('Col de la cubeta 0'),
        'buscar llega a Col cuando la cubeta está llena'
      );
      operar(formularios, 'eliminar', 4);
      agotarTraza(30);
      afirmar(
        enCol().join(',') === '10',
        `al quedar un renglón libre, la primera de Col sube a la cubeta (Col: ${enCol().join(',') || 'nada'})`
      );

      // La elisión de la matriz (2026-10-14): el tramo es una columna más,
      // del primer renglón al último, y no una cajita montada entre la
      // numeración y el primer renglón.
      vaciar();
      enviar(formularios[0], {
        n: 32, r: 3, modoExpansion: 'total', umbralExpandir: 99, umbralReducir: 1
      });
      for (const clave of [5, 37, 12]) {
        operar(formularios, 'insertar', clave);
        agotarTraza(30);
      }
      document.getAnimations().forEach((animacion) => animacion.finish());
      const tramo = document.querySelector('.tramo-elidido--cubetas');
      const vecina = tramo && tramo.closest('.columna-casilla').nextElementSibling;
      const renglonesVecina = vecina ? [...vecina.querySelectorAll('.casilla')] : [];
      const cajaTramo = tramo ? tramo.getBoundingClientRect() : null;
      const arriba = renglonesVecina.length ? renglonesVecina[0].getBoundingClientRect().top : NaN;
      const abajo = renglonesVecina.length ? renglonesVecina[renglonesVecina.length - 1].getBoundingClientRect().bottom : NaN;
      registro.push(cajaTramo ? `  tramo de ${Math.round(cajaTramo.top)} a ${Math.round(cajaTramo.bottom)}; renglones de ${Math.round(arriba)} a ${Math.round(abajo)}` : '  sin tramo');
      afirmar(
        !!cajaTramo && Math.abs(cajaTramo.top - arriba) <= 1 && Math.abs(cajaTramo.bottom - abajo) <= 1,
        'el tramo elidido de la matriz baja del primer renglón al último'
      );
      // Elisión por el paso (opción C, 2026-10-15): la última clave cayó en
      // la cubeta 12, que se ve con sus vecinas; la 5, con claves, queda en un
      // tramo sólido, y el control para ver la tabla entera está a la vista.
      const rotulos = [...document.querySelectorAll('.estructura-horizontal .escala__marca')].map((m) => m.textContent.trim()).filter(Boolean);
      registro.push('  cubetas a la vista: ' + rotulos.join(' '));
      afirmar(
        ['0', '11', '12', '13', '31'].every((r) => rotulos.includes(r)) && !rotulos.includes('5'),
        `se ven la primera, la última y la cubeta del paso con sus vecinas (${rotulos.join(' ')})`
      );
      afirmar(!!document.querySelector('.tramo-elidido--cubetas.tramo-elidido--claves'), 'el tramo que esconde claves se dibuja sólido');
      afirmar(!document.querySelector('.lienzo__control').hidden, '«Ver estructura completa» está a la vista');
      // Una cubeta con claves en Col se ve aunque no sea la del paso: la 3 se
      // llena y la 51 queda en su Col; después se inserta en la 20. Escondida,
      // dejaba la fila «Col» rotulada y vacía (visto por el usuario, 2026-10-15).
      for (const clave of [3, 35, 67, 99, 20]) {
        operar(formularios, 'insertar', clave);
        agotarTraza(30);
      }
      document.getAnimations().forEach((animacion) => animacion.finish());
      const rotulosCol = [...document.querySelectorAll('.estructura-horizontal .escala__marca')].map((m) => m.textContent.trim()).filter(Boolean);
      afirmar(rotulosCol.includes('3') && rotulosCol.includes('20'), `la cubeta con claves en Col se ve junto a la del paso (${rotulosCol.join(' ')})`);
      afirmar(enCol().join(',') === '99', `la fila «Col» muestra su clave (reporta ${enCol().join(',') || 'nada'})`);

      document.querySelector('.pantalla-tema__volver').click();
    }


    // Búsqueda secuencial externa: el archivo del ejemplo del docente. Lo que
    // hay que ver por el DOM es el dibujo —la aritmética ya está probada en
    // `externa.test.js` y `secuencial-externa.test.js`—: que los bloques se
    // rotulen desde 1, que el último se dibuje corto, que insertar en medio
    // empuje el desbordamiento al bloque de al lado, y sobre todo que los
    // renglones de todos los bloques caigan a la misma altura, que es el
    // defecto de layout que las pruebas de dominio no pueden ver.
    function secuencialExterna() {
      registro.push('', '── Búsqueda secuencial externa ──');

      entrarATema('Búsqueda secuencial externa');
      const formularios = [...document.querySelectorAll('form.panel')];
      afirmar(
        formularios[0].textContent.includes('Registros del archivo (N)'),
        'el formulario pide los registros del archivo (N), no un tamaño genérico'
      );

      // N = 23 → 5 bloques de 5, el último con 3 posiciones.
      enviar(formularios[0], { n: 23, l: 4 });
      for (const clave of [1010, 1023, 1105, 1204, 1310, 2011, 2230, 3020, 3145, 3388, 4102, 4521]) {
        operar(formularios, 'insertar', clave);
      }

      const bloques = () => [...document.querySelectorAll('.bloque')];
      const rotulos = bloques().map((b) => b.querySelector('.bloque__etiqueta').textContent);
      registro.push('  bloques: ' + rotulos.join(' '));
      afirmar(rotulos.join(' ') === 'B1 B2 B3 B4 B5', 'se dibujan los 5 bloques, rotulados desde B1');

      const casillasPorBloque = bloques().map((b) => b.querySelectorAll('.casilla').length);
      afirmar(
        casillasPorBloque.join(',') === '5,5,5,5,3',
        `el último bloque se dibuja corto: 3 posiciones y no 5 (reporta ${casillasPorBloque.join(',')})`
      );

      afirmarCasillasParejas('búsqueda secuencial externa');
      afirmarRenglonesDeBloquesAlineados('archivo completo');
      afirmarEstructuraCentrada('búsqueda secuencial externa');

      // 1100 entra en el bloque 1 y empuja a 1310 al bloque 2: el
      // desbordamiento entre bloques es la animación propia de este tema.
      const claveDelRenglon = (bloque, renglon) =>
        bloques()[bloque - 1].querySelectorAll('.casilla')[renglon - 1].textContent;
      afirmar(claveDelRenglon(1, 5) === '1310', 'antes de insertar, 1310 cierra el bloque 1');
      operar(formularios, 'insertar', 1100);
      afirmar(
        claveDelRenglon(1, 5) === '1204' && claveDelRenglon(2, 1) === '1310',
        `insertar en medio empuja la última clave al bloque siguiente (B1 termina en ${claveDelRenglon(1, 5)}, B2 abre con ${claveDelRenglon(2, 1)})`
      );
      // La bitácora la ubica como se dibuja: en bloques y renglones, no en una
      // «casilla 3» que en esta pantalla no existe (2026-10-14).
      agotarTraza();
      const filasInsercion = [...document.querySelectorAll('.bitacora__fila')].map((f) => f.textContent);
      afirmar(
        filasInsercion.some((fila) => fila.includes('Clave insertada: 1100 en el renglón 3 del bloque 1')),
        'la inserción se ubica por renglón y bloque, no por casilla'
      );

      const metricas = () => [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      operar(formularios, 'buscar', 3020);
      agotarTraza(20);
      registro.push('  métricas: ' + metricas().join(' · '));
      afirmar(
        document.querySelector('.alerta').textContent.includes('Clave localizada en el bloque 2'),
        'el aviso ubica la clave por bloque y no por número de registro'
      );
      // Dos accesos y no tres: al insertar 1100, 1310 pasó al bloque 2, así
      // que 3020 ya cae en el segundo bloque y el tercero no se llega a leer.
      afirmar(
        metricas()[1] === '2',
        `leer dos bloques cuesta dos accesos, uno por bloque (reporta ${metricas()[1]})`
      );
      afirmar(metricas()[2] === '5' && metricas()[3] === '5', 'las métricas reportan B = 5 y r = 5');
      // Lo mirado dentro del bloque se apaga y no lleva rojo (2026-09-30), y
      // terminada la búsqueda el panel de la comparación se va.
      afirmar(!document.querySelector('.casilla--sondeada'), 'ningún registro lleva el rojo punteado de antes');
      // Oculto, o ya fuera del flujo y desvaneciéndose: la salida es animada.
      afirmar(
        [...document.querySelectorAll('.calculo')].every((el) => el.hidden || getComputedStyle(el).position === 'absolute'),
        'terminada la búsqueda, el panel de la comparación se va'
      );

      // Archivo grande: los renglones no caben y la elisión comprime los
      // bloques ya comparados. El retoque que el usuario pidió sobre la
      // maqueta (2026-09-11) es que el último registro de un bloque comprimido
      // quede en el renglón que de verdad ocupa, no flotando.
      vaciar();
      enviar(formularios[0], { n: 150, l: 4 });
      for (let i = 0; i < 60; i++) operar(formularios, 'insertar', 1000 + 7 * i);
      operar(formularios, 'buscar', 1385);
      hastaElUltimoPasoDelAlgoritmo();

      const tramos = document.querySelectorAll('.tramo-registros').length;
      afirmar(tramos > 0, `con N = 150 los renglones se eliden (${tramos} tramo(s))`);
      afirmar(
        document.querySelectorAll('.tramo-bloques').length > 0,
        'y los bloques lejanos se juntan en un tramo en vez de dibujarse uno a uno'
      );
      afirmarRenglonesDeBloquesAlineados('archivo elidido');

      // Cada tramo de registros se dibuja como lo que resume (CLAUDE.md 6.2,
      // opción B de las maquetas, 2026-10-11): ninguno mezcla claves y libres,
      // y el último bloque con claves no se esconde en «⋯ k bloques ⋯». Con
      // N = 400 son 20 bloques de 20, y 28 claves dejan B2 con 8 y 12 libres.
      vaciar();
      enviar(formularios[0], { n: 400, l: 4 });
      for (let i = 0; i < 28; i++) operar(formularios, 'insertar', 1000 + 10 * i);
      const tramosComoLoQueResumen = (contexto) => {
        const tramos = [...document.querySelectorAll('.tramo-registros')];
        const mezclados = tramos.filter((tramo) =>
          tramo.classList.contains('tramo-registros--claves') === tramo.classList.contains('tramo-registros--vacias'));
        afirmar(
          tramos.length > 0 && mezclados.length === 0,
          `${contexto}: cada tramo de registros es de claves o de libres (${tramos.length} tramo(s), ${mezclados.length} sin partir)`
        );
        // Y ninguno hace falta partirlo (opción C, 2026-10-11): la escala
        // muestra dónde terminan las claves del archivo, así que ningún tramo
        // compartido cae a caballo entre claves y libres.
        const partidos = [...document.querySelectorAll('.tramo-registros__grupo')].filter((grupo) => grupo.children.length > 1);
        afirmar(partidos.length === 0, `${contexto}: ningún tramo mezcla claves y libres (${partidos.length} partido(s))`);
        renglonesEnTodosLosBloques(contexto);
      };
      // Cada renglón que la escala numera tiene su casilla, a su altura, en
      // todos los bloques que llegan a él (opción C de las maquetas,
      // 2026-10-11): antes los bloques que no se miraban se comprimían a su
      // primero y su último, y el renglón que el paso destapaba no estaba en
      // ellos. Y la matriz cabe de alto: con los tramos a casilla y media la
      // columna de N = 400 deja de medir sus 20 renglones.
      const renglonesEnTodosLosBloques = (contexto) => {
        for (const animacion of document.getAnimations()) animacion.finish();
        const marcas = [...document.querySelectorAll('.escala-registros .renglon__marca')]
          .filter((marca) => marca.textContent !== '⋯');
        const faltan = [];
        for (const bloque of document.querySelectorAll('.bloque')) {
          const centros = [...bloque.querySelectorAll('.casilla')].map(centroDe);
          const ultimo = centros[centros.length - 1];
          for (const marca of marcas) {
            const y = centroDe(marca);
            if (y > ultimo + 1) continue;
            if (!centros.some((c) => Math.abs(c - y) <= 1)) faltan.push(`${bloque.querySelector('.bloque__etiqueta').textContent}:${marca.textContent}`);
          }
        }
        afirmar(faltan.length === 0, `${contexto}: cada renglón numerado tiene su casilla en todos los bloques${faltan.length ? ` (faltan ${faltan.join(' ')})` : ''}`);
        // A cualquier alto (opción D, 2026-10-17): en la pantalla de referencia
        // cabe tal cual, y más bajo —700, un proyector XGA, el zoom a 150 %—
        // se aprieta y encoge, sin bajar de 0,75×.
        const matriz = document.querySelector('.estructura-bloques');
        const encogida = parseFloat(matriz.style.zoom) || 1;
        afirmar(
          matriz.scrollHeight <= matriz.clientHeight + 1,
          `${contexto}: la matriz cabe de alto sin desplazarse (${matriz.scrollHeight} de ${matriz.clientHeight} px, ${encogida.toFixed(2)}×, viewport de ${window.innerHeight} px)`
        );
        afirmar(encogida >= 0.75, `${contexto}: la matriz no se encoge por debajo de 0,75× (${encogida.toFixed(2)}×)`);
        if (window.innerHeight >= 900) {
          afirmar(encogida === 1, `${contexto}: en la pantalla de referencia la matriz no se encoge (${encogida.toFixed(2)}×)`);
        }
      };
      const rotulosVisibles = () => [...document.querySelectorAll('.bloque .bloque__etiqueta')].map((el) => el.textContent);

      // Buscando en B1, el bloque a medio llenar sigue a la vista y la
      // escala dice dónde terminan sus claves.
      operar(formularios, 'buscar', 1050);
      hastaElUltimoPasoDelAlgoritmo();
      tramosComoLoQueResumen('bloque a medio llenar comprimido');
      afirmar(rotulosVisibles().includes('B2'), `el último bloque con claves sigue a la vista (bloques: ${rotulosVisibles().join(' ')})`);
      afirmarRenglonesDeBloquesAlineados('tramos partidos');

      // Buscando en B2, el bloque del paso deja a la vista hasta su última
      // clave —caben todas— y la primera libre.
      operar(formularios, 'buscar', 1250);
      hastaElUltimoPasoDelAlgoritmo();
      tramosComoLoQueResumen('bloque del paso a medio llenar');
      const enCurso = [...document.querySelectorAll('.bloque')]
        .find((bloque) => bloque.querySelector('.bloque--en-curso'));
      const textos = enCurso ? [...enCurso.querySelectorAll('.casilla')].map((el) => el.textContent.trim()) : [];
      afirmar(
        textos.includes('1270'),
        `el bloque del paso muestra su última clave, 1270 (se ven: ${textos.filter(Boolean).join(' ')})`
      );
      afirmarRenglonesDeBloquesAlineados('frontera del bloque del paso');

      // La clave que se inserta siempre se ve, aunque los renglones se eliden
      // (pedido del usuario, 2026-10-11): insertar no lee bloques, y su bloque
      // se comprimía como los demás con la clave dentro del tramo. 1105 entra
      // en el renglón 12 de B1, en medio de un bloque lleno.
      operar(formularios, 'insertar', 1105);
      const insertada = document.querySelector('.casilla--insertada');
      afirmar(
        insertada && insertada.textContent.includes('1105'),
        `al insertar, la clave nueva se ve con su marca (${insertada ? insertada.textContent.trim() : 'no está'})`
      );
      agotarTraza();
      const tras = [...document.querySelectorAll('.bloque .casilla')].map((el) => el.textContent.trim());
      afirmar(tras.includes('1105'), 'y en el paso final sigue a la vista');
      tramosComoLoQueResumen('tras insertar');
      afirmarRenglonesDeBloquesAlineados('tras insertar');

      // Llenando un archivo de N = 120 —bloques de 11, apenas sobre el umbral
      // de 10— la matriz no llega a verse entera (visto por el usuario,
      // 2026-10-11): con todas las claves del bloque a medio llenar a la vista,
      // con la octava y la novena no quedaba ningún tramo.
      vaciar();
      enviar(formularios[0], { n: 120, l: 4 });
      const sinTramo = [];
      for (let i = 0; i < 14; i++) {
        operar(formularios, 'insertar', 1000 + 10 * i);
        if (!document.querySelector('.tramo-registros')) sinTramo.push(i + 1);
      }
      afirmar(
        sinTramo.length === 0,
        `llenando N = 120 la matriz sigue elidida clave a clave${sinTramo.length ? ` (entera con la clave ${sinTramo.join(', ')})` : ''}`
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    // La escala de renglones vive en una columna aparte, así que **ninguna
    // cuadrícula garantiza que quede alineada** con lo que rotula: hay que
    // medirla. Dos defectos reales salieron de aquí (2026-09-11): un
    // espaciador vacío arriba —sin línea que medir, alto cero— subía la
    // columna entera 16 px, un renglón completo; y un alto escrito a mano la
    // dejaba 2 px arriba, poco por renglón y visible al acumularse.
    const centroDe = (el) => {
      const r = el.getBoundingClientRect();
      return Math.round(r.top + r.height / 2);
    };

    function afirmarEscalaAlineada(contexto, marcas, referencias) {
      const dispares = marcas
        .map((marca, i) => [centroDe(marca), centroDe(referencias[i])])
        .filter(([a, b]) => Math.abs(a - b) > 1);
      afirmar(
        marcas.length > 0 && marcas.length === referencias.length && dispares.length === 0,
        `${contexto}: la escala numera a la altura de lo que rotula`
          + (dispares.length ? ` (${dispares.length} desalineada(s): ${dispares.map((p) => p.join('≠')).join(' ')})` : '')
      );
    }

    // La estructura va centrada en el lienzo, sea del tipo que sea (CLAUDE.md
    // 6.2). No lo garantiza el CSS del escenario por sí solo: el lienzo es una
    // rejilla de dos filas y, si el escenario cae en la de arriba —la que mide
    // lo que su contenido—, la estructura se pega al borde superior con medio
    // lienzo vacío debajo. Le pasaba a los árboles, que no llevan control de
    // elisión, y empezó a pasarle a cualquier tema cuya estructura cupiera
    // entera, desde que el control se esconde cuando no hay nada que elidir.
    function afirmarEstructuraCentrada(contexto) {
      const escenario = document.querySelector('.lienzo__escenario');
      const estructura = escenario && escenario.firstElementChild;
      if (!estructura) {
        afirmar(false, `${contexto}: no hay estructura que centrar`);
        return;
      }
      const centro = (el) => {
        const r = el.getBoundingClientRect();
        return Math.round(r.top + r.height / 2);
      };
      const desvio = Math.abs(centro(escenario) - centro(estructura));
      afirmar(
        desvio <= 2,
        `${contexto}: la estructura queda centrada en el lienzo (desvío de ${desvio} px)`
      );
    }

    // Los bloques son columnas independientes: que la casilla de un renglón
    // caiga a la misma altura en todos —y que el último registro de un bloque
    // comprimido coincida con el último de los completos— es lo único que hace
    // legible la matriz, y no se ve desde `node --test`.
    // Búsqueda binaria externa (CLAUDE.md 5.11). La aritmética está en
    // `binaria-externa.test.js`; aquí va lo que solo se ve en el DOM: que el
    // panel cambie de título al pasar de los bloques a los renglones, que la
    // binaria de dentro pinte su rango en la columna del bloque, y que la
    // relectura de un bloque se diga en el panel y se cuente en las métricas.
    function binariaExterna() {
      registro.push('', '── Búsqueda binaria externa ──');

      entrarATema('Búsqueda binaria externa');
      const formularios = [...document.querySelectorAll('form.panel')];
      // El archivo lleno de la maqueta: N = 23, 5 bloques, el último de 3.
      enviar(formularios[0], { n: 23, l: 2 });
      for (const clave of [10, 12, 15, 18, 20, 22, 25, 27, 30, 33, 35, 38, 40, 42, 45, 48, 50, 53, 55, 58, 60, 63, 67]) {
        operar(formularios, 'insertar', clave);
      }

      // El resumen más largo de la aplicación —«N = 23 · 5 bloques de 5»—
      // no se sale de su panel: «Editar» quedaba cortado en un portátil.
      const editar = document.querySelector('[data-accion="editar-configuracion"]').getBoundingClientRect();
      const panelOperaciones = formularios[1].getBoundingClientRect();
      afirmar(editar.right <= panelOperaciones.right, `el resumen de la estructura cabe en su panel («Editar» termina en ${Math.round(editar.right)}, el panel en ${Math.round(panelOperaciones.right)})`);

      const bloques = () => [...document.querySelectorAll('.bloque')];
      const rotulo = (b) => bloques()[b - 1].querySelector('.bloque__etiqueta');
      const titulo = () => document.querySelector('.calculo__titulo').textContent;
      const panel = () => document.querySelector('.calculo').textContent;
      const metricas = () => [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      // Avanza hasta que se cumpla la condición, sin pasarse del final.
      const hastaQue = (condicion) => {
        for (let i = 0; i < 40 && !condicion(); i++) control('siguiente').click();
        return condicion();
      };

      operar(formularios, 'buscar', 50);
      afirmar(
        hastaQue(() => rotulo(4).classList.contains('bloque--en-curso')),
        'la búsqueda por bloques llega a B4'
      );
      afirmar(titulo() === 'Búsqueda por bloques', `en la fase de bloques el panel se titula «Búsqueda por bloques» (dice «${titulo()}»)`);
      afirmar(
        [1, 2, 3].every((b) => rotulo(b).classList.contains('bloque--descartado')) && !rotulo(5).classList.contains('bloque--descartado'),
        'comparando B4, B1 a B3 están descartados y B5 todavía no'
      );

      afirmar(
        hastaQue(() => titulo() === 'Dentro del bloque B4'),
        'al quedar un solo bloque el panel pasa a «Dentro del bloque B4»'
      );
      afirmar(rotulo(5).classList.contains('bloque--descartado'), 'dentro de B4, B5 ya está descartado');
      afirmar(panel().includes('ya leído'), 'B4 era el último leído: el panel dice «ya leído»');
      const estados = [...bloques()[3].querySelectorAll('.casilla')].map((c) =>
        ['en-evaluacion', 'ocupada', 'descartada', 'encontrada'].find((e) => c.classList.contains(`casilla--${e}`)) || '·');
      registro.push('  B4, primer paso dentro: ' + estados.join(' '));
      afirmar(
        estados.join(' ') === 'ocupada ocupada en-evaluacion ocupada ocupada',
        'la binaria de dentro marca el medio, el renglón 3, y el resto del bloque sigue en juego'
      );
      control('siguiente').click();
      const estados2 = [...bloques()[3].querySelectorAll('.casilla')].map((c) =>
        ['en-evaluacion', 'ocupada', 'descartada'].find((e) => c.classList.contains(`casilla--${e}`)) || '·');
      afirmar(
        estados2.join(' ') === 'en-evaluacion ocupada descartada descartada descartada',
        `al estrechar, los renglones tirados se apagan dentro del bloque (${estados2.join(' ')})`
      );

      hastaElUltimoPasoDelAlgoritmo();
      afirmar(
        document.querySelector('.alerta').textContent.includes('Clave localizada en el bloque 4'),
        'el aviso ubica la clave por bloque'
      );
      registro.push('  métricas: ' + metricas().join(' · '));
      afirmar(metricas()[0] === '5' && metricas()[1] === '2', `50 cuesta 5 comparaciones y 2 accesos (reporta ${metricas().slice(0, 2).join(', ')})`);
      afirmarCasillasParejas('búsqueda binaria externa');
      afirmarRenglonesDeBloquesAlineados('binaria externa');

      // 22: se leen B3, B2 y B1, y el rango se cierra en B2, que hay que releer.
      operar(formularios, 'buscar', 22);
      afirmar(hastaQue(() => panel().includes('se relee')), 'buscando 22, el panel avisa que B2 se relee');
      hastaElUltimoPasoDelAlgoritmo();
      afirmar(metricas()[1] === '4', `la relectura cuenta: 22 cuesta 4 accesos (reporta ${metricas()[1]})`);

      // Archivo grande: los bloques leídos por la binaria saltan, y la elisión
      // tiene que seguir alineando los renglones.
      vaciar();
      enviar(formularios[0], { n: 150, l: 4 });
      for (let i = 0; i < 150; i++) operar(formularios, 'insertar', 1000 + 7 * i);
      // 1700 está en B9. Comparando B9 el rango es B8 … B10: sus dos extremos
      // tienen que seguir a la vista aunque el resto se junte en tramos.
      operar(formularios, 'buscar', 1700);
      const rotulos = () => [...document.querySelectorAll('.bloque__etiqueta')].map((el) => el.textContent);
      afirmar(
        hastaQue(() => panel().includes('B8 … B10')),
        'con N = 150 el rango llega a B8 … B10'
      );
      afirmar(
        ['B8', 'B9', 'B10'].every((b) => rotulos().includes(b)),
        `los extremos del rango no se esconden en un tramo (se ven ${rotulos().join(' ')})`
      );
      afirmar(hastaQue(() => titulo().startsWith('Dentro del bloque')), 'y llega a buscar dentro de un bloque');
      afirmar(
        document.querySelectorAll('.tramo-bloques').length > 0,
        'y los bloques lejanos se juntan en un tramo'
      );
      afirmarRenglonesDeBloquesAlineados('binaria externa elidida');
      hastaElUltimoPasoDelAlgoritmo();
      afirmar(
        document.querySelector('.alerta').textContent.includes('Clave localizada en el bloque'),
        'y la encuentra'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    function afirmarRenglonesDeBloquesAlineados(contexto) {
      // Se mide dónde quedan las casillas, no dónde van: tras insertar, la
      // clave que se desborda al bloque siguiente viaja con el FLIP desde el
      // último renglón del suyo, y en vuelo «empezaba» 836 px más abajo
      // (2026-10-11, al dibujar el primer registro de los bloques comprimidos).
      for (const animacion of document.getAnimations()) animacion.finish();
      const bloques = [...document.querySelectorAll('.bloque')];
      const pies = bloques.map((bloque) => {
        const casillas = [...bloque.querySelectorAll('.casilla')];
        const ultima = casillas[casillas.length - 1];
        return Math.round(ultima.getBoundingClientRect().bottom);
      });
      // El último bloque es más corto que los demás: su último registro está en
      // su propio renglón y no tiene por qué caer con los otros.
      const sinElUltimo = pies.slice(0, -1);
      afirmar(
        new Set(sinElUltimo).size === 1,
        `${contexto}: todos los bloques cierran en el mismo renglón (${[...new Set(sinElUltimo)].join(', ')})`
      );

      // Desde el 2026-10-11 el bloque comprimido también empieza por una
      // casilla —su primer registro—, así que entran todos; el filtro queda
      // por si un bloque de un solo registro empezara en otro renglón.
      const primeras = bloques
        .filter((bloque) => bloque.querySelector('.bloque__registros').firstElementChild.classList.contains('casilla'))
        .map((bloque) => Math.round(bloque.querySelector('.casilla').getBoundingClientRect().top));
      afirmar(
        new Set(primeras).size === 1,
        `${contexto}: todos los bloques empiezan a la misma altura (${[...new Set(primeras)].join(', ')})`
      );

      // La escala se dibuja con los mismos segmentos que el bloque en curso
      // —casillas y tramos—, así que se comparan uno a uno.
      const enCurso = bloques.find((b) => b.querySelector('.bloque--en-curso')) || bloques[0];
      afirmarEscalaAlineada(
        contexto,
        [...document.querySelectorAll('.escala-registros .renglon__marca')],
        [...enCurso.querySelector('.bloque__registros').children]
      );
    }


    // El control de elisión solo tiene sentido cuando hay algo comprimido que
    // mirar (2026-09-11). Se decide mirando el dibujo —¿quedó algún tramo?— y
    // no recalculando la elisión, así que la comprobación entra por donde
    // entra el estudiante: creando una estructura que quepa y otra que no.
    // El desvanecido se mide con la estructura asentada, cuando termina la
    // animación (CLAUDE.md 6.2). Esta prueba es síncrona: se terminan las
    // animaciones a mano y se avisa con un `scroll`, que es lo que la pantalla
    // escucha para volver a medir.
    function asentar(el) {
      for (const animacion of document.getAnimations()) animacion.finish();
      el.dispatchEvent(new Event('scroll'));
    }
    const ladosDesvanecidos = (el) =>
      ['izq', 'der', 'arr', 'aba'].filter((lado) => el.classList.contains(`desborda-${lado}`)).join(',') || 'ninguno';

    // Dentro de una búsqueda la estructura no crece, solo se achica (ver
    // `ajustarEscala`). Pero «Ver estructura completa» cambia lo que se ve:
    // encenderla bajaba la escala a 1×, y al apagarla se quedaba ahí hasta que
    // terminaba la búsqueda (visto por el usuario, 2026-10-09).
    function escalaConEstructuraCompleta() {
      registro.push('', '── Escala con la estructura completa ──');
      entrarATema('Búsqueda binaria');
      const formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 40, l: 2 });
      // Veinte claves: más que el umbral, para que el apilado elida y la
      // estructura completa sea más ancha.
      for (let i = 0; i < 20; i++) operar(formularios, 'insertar', 10 + i * 4);
      agotarTraza(5);
      operar(formularios, 'buscar', 70);
      control('siguiente').click();
      const escala = () => parseFloat(document.querySelector('.estructura-apilada').style.zoom) || 1;
      const antes = escala();
      const completa = document.querySelector('[data-control="mostrar-completa"]');
      completa.click();
      const conCompleta = escala();
      completa.click();
      const despues = escala();
      registro.push(`  escala: ${antes} → completa ${conCompleta} → otra vez elidida ${despues}`);
      // Si en esta ventana el apilado no crece, no hay escala que recuperar:
      // lo ejercitan las ventanas anchas (`--zoom`).
      afirmar(
        antes <= 1 || (conCompleta < antes && Math.abs(despues - antes) < 0.0001),
        `al apagar «Ver estructura completa» a mitad de la búsqueda, la escala vuelve a la de antes (${antes} → ${conCompleta} → ${despues})`
      );
      document.querySelector('.pantalla-tema__volver').click();
    }

    // **El llenado automático es una operación del reproductor** (2026-10-09):
    // una clave por paso, con su casilla marcada y su mensaje, que se puede
    // pausar y retroceder, y que cierra con el paso final. Iba con su propio
    // ritmo, sin respetar la velocidad, y el estudiante se perdía.
    function llenadoAutomatico() {
      registro.push('', '── Llenado automático ──');
      const casos = [
        { tema: 'Búsqueda secuencial', datos: { n: 8, l: 2 }, total: 8 },
        { tema: 'Función módulo', datos: { n: 8, l: 2, tratamiento: 'reasignacion' }, total: 8 },
        // En cubetas, `n × r` claves y no una por cubeta (2026-10-12): con
        // n = 2 y r = 3 son 6, y la densidad dispara la expansión antes.
        { tema: 'Otras búsquedas dinámicas', datos: { n: 2, r: 3, modoExpansion: 'total', umbralExpandir: 82, umbralReducir: 125 }, total: 6 }
      ];
      for (const { tema, datos, total } of casos) {
        entrarATema(tema);
        const formularios = [...document.querySelectorAll('form.panel')];
        enviar(formularios[0], datos);
        control('llenado-automatico').click();
        control('siguiente').click();
        const claves = () => [...document.querySelectorAll('.casilla')]
          .map((el) => el.textContent.replace(/[^0-9]/g, '')).filter(Boolean);
        const enElSegundo = claves().length;
        const narra = /Paso 2 de \d+/.test((aviso() || {}).textContent || '');
        const marcada = document.querySelectorAll('.casilla--insertada').length;
        control('anterior').click();
        const alRetroceder = claves().length;
        agotarTraza(200);
        const alFinal = claves();
        afirmar(
          enElSegundo === 2 && alRetroceder === 1 && narra && marcada === 1,
          `${tema}: una clave por paso, narrada y marcada, y se puede retroceder (paso 2: ${enElSegundo} clave(s), ${marcada} marcada(s); al retroceder: ${alRetroceder})`
        );
        afirmar(
          alFinal.length === total && new Set(alFinal).size === alFinal.length && !document.querySelector('.casilla--insertada'),
          `${tema}: termina con sus ${total} claves, sin repetidas y sin resaltados (${alFinal.length} clave(s))`
        );
        // Un mensaje por renglón (2026-10-15): la clave que expandía dejaba
        // en uno solo su reubicación y el anuncio de la expansión, pegados.
        const filas = [...document.querySelectorAll('.bitacora__fila')].map((f) => f.lastElementChild.textContent);
        const pegadas = filas.filter((fila) => /\. [A-ZÁÉÍÓÚ]/.test(fila));
        afirmar(pegadas.length === 0, `${tema}: un mensaje por renglón en la bitácora (${pegadas.length} pegado(s): ${pegadas[0] || '—'})`);
        if (tema === 'Otras búsquedas dinámicas') {
          afirmar(
            filas.some((fila) => fila.startsWith('Densidad de ocupación')),
            'la expansión del llenado tiene su propio renglón'
          );
        }
        document.querySelector('.pantalla-tema__volver').click();
      }
    }

    // **En la tabla vertical, el tramo mide lo que una casilla** (2026-10-09):
    // con l = 2 la casilla mide unos 45 px y «⋯ 22 ⋯» unos 61, así que el
    // tramo ensanchaba la columna y la 1 y la n quedaban corridas respecto de
    // él —lo vio el usuario en función módulo con n = 24—. Con encadenamiento,
    // además, el tramo va solo bajo la casilla de la dirección.
    function tramosEnSuColumna() {
      registro.push('', '── Tramos en su columna ──');
      for (const tratamiento of ['reasignacion', 'encadenamiento', 'anidados']) {
        const formularios = entrarAModulo({ n: 24, l: 2, tratamiento });
        for (const clave of [12, 36, 60, 47, 19, 84]) {
          operar(formularios, 'insertar', clave);
          agotarTraza(30);
        }
        // Con la estructura quieta: las casillas viajan con el FLIP y los
        // tramos no, y a media animación parecían corridos.
        for (const animacion of document.getAnimations()) animacion.finish();
        const casilla = document.querySelector('.fila-casilla .casilla').getBoundingClientRect();
        const tramos = [...document.querySelectorAll('.fila-casilla .tramo-elidido:not(.tramo-elidido--matriz)')];
        const fuera = tramos.filter((tramo) => {
          const caja = tramo.getBoundingClientRect();
          return Math.abs(caja.width - casilla.width) > 1 || tramo.scrollWidth > tramo.clientWidth + 1;
        });
        const primeraColumna = tramos.filter((tramo) => !tramo.closest('.cadena') && !tramo.classList.contains('tramo-elidido--anidado'));
        const corridos = primeraColumna.filter((tramo) => Math.abs(tramo.getBoundingClientRect().left - casilla.left) > 1);
        afirmar(
          tramos.length > 0 && fuera.length === 0 && corridos.length === 0,
          `${tratamiento}: cada tramo mide lo que una casilla y cae en su columna (${tramos.length} tramo(s), ${fuera.length} de otro ancho o recortado(s), ${corridos.length} corrido(s))`
        );
        document.querySelector('.pantalla-tema__volver').click();
      }
    }

    // Sin barras en el lienzo (pedido del usuario, 2026-09-27): se desplaza
    // igual, pero lo que dice «hay más» es el borde desvanecido del lado por
    // donde sigue la estructura, y solo ese.
    function lienzoSinBarras() {
      registro.push('', '── Lienzo sin barras ──');

      entrarATema('Búsqueda secuencial');
      const formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 60, l: 2 });
      for (const clave of [10, 18, 24, 31, 37, 42, 50, 63, 71, 84, 90, 97]) operar(formularios, 'insertar', clave);

      const fila = () => document.querySelector('.estructura-horizontal');
      asentar(fila());
      afirmar(!fila().classList.contains('desborda'), `elidida cabe: ningún borde desvanecido (${ladosDesvanecidos(fila())})`);

      const completa = document.querySelector('[data-control="mostrar-completa"]');
      completa.click();
      asentar(fila());
      registro.push(`  completa: ${fila().scrollWidth} px en ${fila().clientWidth} px`);
      afirmar(fila().scrollWidth > fila().clientWidth, 'con la estructura completa, la fila desborda');
      afirmar(
        fila().offsetHeight - fila().clientHeight === 0,
        `y no aparece barra: no le quita alto al lienzo (${fila().offsetHeight - fila().clientHeight} px)`
      );
      // Al principio a mano: la última inserción es un paso con su casilla
      // (2026-10-09), y la vista la centra como a cualquier casilla del paso.
      fila().scrollLeft = 0;
      asentar(fila());
      afirmar(ladosDesvanecidos(fila()) === 'der', `al principio se desvanece solo el borde derecho (${ladosDesvanecidos(fila())})`);

      fila().scrollLeft = fila().scrollWidth / 2 - fila().clientWidth / 2;
      asentar(fila());
      afirmar(ladosDesvanecidos(fila()) === 'izq,der', `a mitad de camino, los dos (${ladosDesvanecidos(fila())})`);

      fila().scrollLeft = fila().scrollWidth;
      asentar(fila());
      afirmar(ladosDesvanecidos(fila()) === 'izq', `al final, solo el izquierdo (${ladosDesvanecidos(fila())})`);

      completa.click();
      asentar(fila());
      afirmar(!fila().classList.contains('desborda'), `al volver a elidir, se va el desvanecido (${ladosDesvanecidos(fila())})`);

      document.querySelector('.pantalla-tema__volver').click();
    }

    // El panel lateral en el portátil (opción B de la maqueta, 2026-09-27):
    // la configuración se pliega al crear la estructura y deja su resumen en
    // la cabecera de Operaciones, y la reproducción cabe en una fila. La meta
    // era que en 1366×640 se vieran operaciones, reproducción y métricas sin
    // desplazar el panel.
    function panelLateralPlegado() {
      registro.push('', '── Panel lateral plegado ──');

      entrarATema('Búsqueda secuencial');
      const formularios = [...document.querySelectorAll('form.panel')];
      const configuracion = formularios[0];
      const resumen = document.querySelector('[data-resumen="estructura"]');
      // Lo que se ve y no el atributo: `hidden` puesto no garantiza que el
      // elemento desaparezca si su `display` le gana, y así fue la primera vez.
      const seVe = (el) => el.getClientRects().length > 0;
      afirmar(seVe(configuracion) && !seVe(resumen), 'sin estructura, la configuración está abierta y no hay resumen');

      enviar(configuracion, { n: 24, l: 2 });
      afirmar(!seVe(configuracion), 'al crear la estructura, la configuración se pliega');
      afirmar(
        seVe(resumen) && resumen.textContent.includes('n = 24 · l = 2'),
        `y su resumen queda en la cabecera de Operaciones (${resumen.textContent.trim().replace(/\s+/g, ' ')})`
      );

      document.querySelector('[data-accion="editar-configuracion"]').click();
      const cancelar = configuracion.querySelector('[data-accion="cancelar-configuracion"]');
      afirmar(seVe(configuracion) && !seVe(resumen) && seVe(cancelar), '«Editar» la vuelve a abrir, con «Cancelar» a la vista');
      cancelar.click();
      afirmar(!seVe(configuracion) && seVe(resumen), '«Cancelar» la pliega sin tocar la estructura');

      for (const clave of [10, 18, 24, 31, 37, 42, 50, 63, 71, 84, 90, 97]) operar(formularios, 'insertar', clave);
      operar(formularios, 'buscar', 84);
      // Toda operación arranca reproduciéndose sola (CLAUDE.md 6.8), así que
      // el botón empieza diciendo «Pausar».
      const alternar = control('reproducir');
      afirmar(alternar.textContent === 'Pausar', `la búsqueda arranca sola y el botón dice «Pausar» (dice «${alternar.textContent}»)`);
      alternar.click();
      afirmar(alternar.textContent === 'Reproducir', `al pausar, el mismo botón dice «Reproducir» (dice «${alternar.textContent}»)`);
      alternar.click();
      afirmar(alternar.textContent === 'Pausar', 'y al reanudar vuelve a «Pausar»');
      control('siguiente').click();
      afirmar(alternar.textContent === 'Reproducir', 'un paso a mano también pausa, y el botón lo dice');

      // El rastro del recorrido (2026-09-27): lo ya comparado se apaga, como lo
      // que descarta binaria, y lo que falta se ve normal.
      const evaluada = document.querySelector('.casilla--en-evaluacion');
      const actual = Number(evaluada.dataset.indice);
      const antes = [...document.querySelectorAll('.estructura-horizontal .casilla[data-indice]')]
        .filter((c) => Number(c.dataset.indice) < actual);
      afirmar(
        antes.length > 0 && antes.every((c) => c.classList.contains('casilla--descartada')),
        `secuencial apaga lo ya comparado antes de la casilla ${actual} (${antes.length} casillas)`
      );

      // A 700 px de alto —el portátil deja unos 640— las métricas tienen que
      // verse enteras sin desplazar el panel.
      const lateral = document.querySelector('.pantalla-tema__panel-lateral');
      const metricas = [...lateral.querySelectorAll('.panel')].find((p) => p.textContent.startsWith('Métricas'));
      const pie = metricas.getBoundingClientRect().bottom;
      const visible = lateral.getBoundingClientRect().top + lateral.clientHeight;
      registro.push(`  métricas terminan en ${Math.round(pie)} px; el panel se ve hasta ${Math.round(visible)} px`);
      afirmar(pie <= visible + 1, 'las métricas se ven enteras sin desplazar el panel lateral');

      document.querySelector('.pantalla-tema__volver').click();
    }

    // El menú (2026-09-27): internas y externas lado a lado, cada una entera
    // en su columna; Grafos, sin temas construidos, con el sello una sola vez.
    // Se mide lo que se ve: la primera vez la regla de columnas perdía contra
    // otra más general y externas quedaba debajo de internas.
    function menuEnColumnas() {
      registro.push('', '── Menú ──');
      const grupos = [...document.querySelectorAll('.indice__grupo-titulo')];
      const internas = grupos.find((g) => g.textContent === 'Búsquedas internas');
      const externas = grupos.find((g) => g.textContent === 'Búsquedas externas');
      afirmar(
        internas && externas && Math.abs(internas.getBoundingClientRect().top - externas.getBoundingClientRect().top) <= 1
          && externas.getBoundingClientRect().left > internas.getBoundingClientRect().right,
        'búsquedas internas y externas van lado a lado'
      );
      const grafos = [...document.querySelectorAll('.indice__parte')].find((p) => p.textContent.startsWith('Grafos'));
      const sellos = grafos.querySelectorAll('.indice__estado');
      const visibles = [...sellos].filter((el) => el.getClientRects().length > 0);
      afirmar(visibles.length === 1, `Grafos lleva el «En desarrollo» una sola vez (se ven ${visibles.length})`);
      // Desde Floyd (2026-10-22) Grafos tiene un tema construido: va primero,
      // y el rótulo encima de los pendientes, no en la cabecera.
      const temasGrafos = [...grafos.querySelectorAll('.indice__tema')];
      afirmar(
        temasGrafos[0].textContent.includes('Floyd') && !temasGrafos[0].classList.contains('indice__tema--pendiente')
          && visibles[0] && visibles[0].getBoundingClientRect().top > temasGrafos[0].getBoundingClientRect().bottom,
        'en Grafos, Floyd va primero y el «En desarrollo» encima de los pendientes'
      );
    }

    function controlDeElision() {
      registro.push('', '── Control de elisión ──');

      entrarATema('Búsqueda secuencial');
      const formularios = [...document.querySelectorAll('form.panel')];
      const control = () => document.querySelector('.lienzo__control');

      enviar(formularios[0], { n: 8, l: 2 });
      for (const clave of [10, 20, 30]) operar(formularios, 'insertar', clave);
      afirmar(
        control().hidden,
        'con una estructura que cabe entera, el control no se muestra'
      );

      // Con l = 2 solo existen 90 claves distintas y n = 100 se rechaza
      // (CLAUDE.md 3.5), así que la estructura grande va con l = 3.
      enviar(formularios[0], { n: 100, l: 3 });
      for (const clave of [100, 200, 300, 400, 500]) operar(formularios, 'insertar', clave);
      afirmar(
        !control().hidden,
        'con una estructura elidida, el control aparece'
      );

      // Si el control se escondiera al desaparecer los tramos, no habría forma
      // de volver: quedaría marcado y fuera de la vista.
      document.querySelector('[data-control="mostrar-completa"]').click();
      afirmar(
        !control().hidden,
        'con "ver estructura completa" marcada el control sigue a la vista, para poder desmarcarla'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }


    // Árbol de Huffman (CLAUDE.md 5.x). Lo que solo se ve por el DOM: que el
    // lienzo dibuja un bosque y no un árbol mientras se construye, que los
    // nodos internos llevan su peso dentro, que la tabla aparece solo al final
    // y que el panel no ofrece operaciones de clave, porque en este tema no se
    // busca nada. La aritmética ya está probada en `huffman.test.js` contra el
    // ejemplo del docente.
    function arbolDeHuffman() {
      registro.push('', '── Árbol de Huffman ──');

      entrarATema('Árbol de Huffman');
      const formularios = [...document.querySelectorAll('form.panel')];
      const operaciones = formularios[0];

      afirmar(
        !operaciones.querySelector('[name="clave"]'),
        'el panel no pide clave: en este tema no se busca ni se elimina, se construye'
      );

      // Antes de la palabra no hay nada que reducir: ni el panel del cálculo
      // ni la reproducción encendida (usuario, 2026-09-30).
      afirmar(
        [...document.querySelectorAll('.calculo')].every((el) => el.getClientRects().length === 0),
        'antes de la palabra no se dibuja el panel de las reducciones'
      );
      afirmar(control('siguiente').disabled, 'antes de la palabra la reproducción está apagada');

      operaciones.querySelector('[name="palabra"]').value = 'ciencias';
      operaciones.querySelector('[data-accion="insertar-palabra"]').click();

      // Cada unión va en tres tiempos (2026-09-30): se marca la pareja, se
      // junta donde está y el nodo nuevo vuelve a su sitio por peso. A los
      // dos pasos, e y n ya son un árbol, al principio de la lista y con su
      // nodo resaltado.
      control('siguiente').click();
      control('siguiente').click();
      const recienNacido = document.querySelector('.bosque__arbol');
      afirmar(
        !!recienNacido && !!recienNacido.querySelector('.nodo-peso--en-curso')
          && document.querySelectorAll('.nodo-peso').length === 1,
        'el nodo nuevo nace donde estaban los dos que se unen, y resaltado'
      );
      // Y en el paso siguiente se va a su sitio por peso: el árbol entero
      // cruza el lienzo, y sus aristas tienen que ir pegadas a él.
      control('siguiente').click();
      afirmarAristasDelBosquePegadas('Huffman, al volver e + n a su sitio');

      // Siete pasos: la lista inicial y las dos primeras uniones con sus tres
      // tiempos. El bosque tiene entonces cuatro árboles —c, i, (e+n), (a+s)—
      // y el siguiente paso une las dos letras, que es la regla fina del
      // método.
      for (let i = 0; i < 4; i++) control('siguiente').click();
      const arboles = document.querySelectorAll('.bosque__arbol');
      registro.push('  bosque a mitad: ' + [...arboles].map((a) => a.textContent).join(' | '));

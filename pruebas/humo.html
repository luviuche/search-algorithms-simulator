<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Prueba de humo — simulador CC2</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/pantallas.css">
</head>
<body>
  <!--
    Prueba de integración de la pantalla de tema: entra desde el menú, crea
    una estructura, inserta claves y recorre la traza, todo por el DOM real.
    `node --test` sólo cubre dominio y algoritmos; esto cubre la vista sin
    añadir una sola dependencia al proyecto.

    Abrir con doble clic y leer el informe, o sin ventana:
      msedge --headless --disable-gpu --virtual-time-budget=8000 \
             --dump-dom "file:///…/pruebas/humo.html"
  -->
  <div id="app"></div>
  <pre id="salida" style="font: 12px/1.6 monospace; padding: 16px;"></pre>

  <script src="../js/dominio/limites.js"></script>
  <script src="../js/dominio/clave.js"></script>
  <script src="../js/dominio/estructura.js"></script>
  <script src="../js/dominio/arbol.js"></script>
  <script src="../js/dominio/arbol-multiple.js"></script>
  <script src="../js/dominio/cubetas.js"></script>
  <script src="../js/dominio/externa.js"></script>
  <script src="../js/dominio/huffman.js"></script>
  <script src="../js/dominio/indices.js"></script>
  <script src="../js/algoritmos/traza.js"></script>
  <script src="../js/algoritmos/secuencial.js"></script>
  <script src="../js/algoritmos/binaria.js"></script>
  <script src="../js/algoritmos/arbol-digital.js"></script>
  <script src="../js/algoritmos/residuos.js"></script>
  <script src="../js/algoritmos/residuos-multiples.js"></script>
  <script src="../js/algoritmos/eliminacion.js"></script>
  <script src="../js/algoritmos/colisiones/reasignacion.js"></script>
  <script src="../js/algoritmos/colisiones/anidados.js"></script>
  <script src="../js/algoritmos/colisiones/encadenamiento.js"></script>
  <script src="../js/algoritmos/hash/comun.js"></script>
  <script src="../js/algoritmos/hash/modulo.js"></script>
  <script src="../js/algoritmos/hash/cuadrado.js"></script>
  <script src="../js/algoritmos/hash/truncamiento.js"></script>
  <script src="../js/algoritmos/hash/plegamiento.js"></script>
  <script src="../js/algoritmos/hash/bases.js"></script>
  <script src="../js/algoritmos/hash/operaciones.js"></script>
  <script src="../js/algoritmos/cubetas.js"></script>
  <script src="../js/algoritmos/secuencial-externa.js"></script>
  <script src="../js/algoritmos/binaria-externa.js"></script>
  <script src="../js/algoritmos/huffman.js"></script>
  <script src="../js/algoritmos/indices.js"></script>
  <script src="../js/persistencia/recientes.js"></script>
  <script src="../js/persistencia/archivo.js"></script>
  <script src="../js/vista/componentes/casilla.js"></script>
  <script src="../js/vista/componentes/panel.js"></script>
  <script src="../js/vista/componentes/bitacora.js"></script>
  <script src="../js/vista/componentes/calculo.js"></script>
  <script src="../js/vista/elision.js"></script>
  <script src="../js/vista/reproductor.js"></script>
  <script src="../js/vista/animacion.js"></script>
  <script src="../js/vista/pantallas/menu.js"></script>
  <script src="../js/vista/pantallas/tema-busqueda.js"></script>
  <script src="../js/app.js"></script>

  <script>
    const registro = [];
    let fallas = 0;

    window.addEventListener('error', (evento) => {
      fallas++;
      registro.push('ERROR: ' + evento.message);
    });

    function afirmar(condicion, descripcion) {
      if (!condicion) fallas++;
      registro.push((condicion ? '✔ ' : '✕ ') + descripcion);
    }

    // Asignar `.value` no dispara `change`, y hay campos que reaccionan a otro
    // —el tamaño del arreglo anidado aparece al elegir ese tratamiento—: sin
    // el evento, la prueba vería un formulario que el usuario nunca ve.
    function enviar(formulario, valores) {
      for (const [nombre, valor] of Object.entries(valores)) {
        const campo = formulario.querySelector(`[name="${nombre}"]`);
        campo.value = valor;
        campo.dispatchEvent(new Event('change', { bubbles: true }));
      }
      formulario.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    }

    const aviso = () => document.querySelector('.pantalla-tema__alertas .alerta');

    // El catálogo es un árbol de tarjetas (CLAUDE.md 12): entrar a un tema
    // El catálogo es un índice con todo a la vista (CLAUDE.md 2): entrar a un
    // tema es un solo clic en su renglón, sin recorrer categorías.
    //
    // **Por título exacto y no por `includes`**: en el índice conviven
    // "Búsqueda secuencial" y "Búsqueda secuencial externa", y un `includes`
    // entraría siempre al primero que aparezca.
    function entrarATema(nombreTema) {
      const renglon = [...document.querySelectorAll('.indice__tema')]
        .find((el) => el.querySelector('.indice__tema-titulo').textContent === nombreTema);
      if (!renglon) throw new Error(`No está en el índice: ${nombreTema}`);
      renglon.click();
    }

    // Insertar, buscar y eliminar comparten un panel: se escribe la clave una
    // vez y el botón dice qué hacer con ella. `formularios` queda en dos —la
    // configuración y las operaciones—, así que la operación se nombra y no
    // se deduce de la posición del formulario.
    function operar(formularios, accion, valor) {
      const panel = formularios.find((formulario) => formulario.querySelector('[name="clave"]'));
      panel.querySelector('[name="clave"]').value = valor;
      panel.querySelector(`[data-accion="${accion}"]`).click();
    }

    // Todas las casillas dibujadas miden lo mismo, lleven clave, marca o nada.
    // Una casilla que se dimensiona por su contenido deforma la estructura a
    // medida que se insertan claves: la fila con clave queda más ancha que la
    // vacía y, en la matriz de arreglos anidados, descoloca todas las columnas
    // a su derecha. Se mide el dibujo real porque el defecto es de layout y
    // `node --test` no puede verlo.
    function afirmarCasillasParejas(contexto) {
      const casillas = [...document.querySelectorAll('.casilla')];
      const anchos = [...new Set(casillas.map((c) => Math.round(c.getBoundingClientRect().width)))];
      afirmar(
        anchos.length === 1,
        `${contexto}: las ${casillas.length} casillas miden lo mismo (anchos: ${anchos.join(', ')})`
      );
      // La marca de insertada o eliminada vive dentro de la casilla: si no le
      // cupiera, el ancho fijo la estaría recortando en lugar de reservarle
      // sitio, que es lo que se midió al crear la estructura.
      const desbordadas = casillas.filter((c) => c.scrollWidth > c.clientWidth + 1);
      afirmar(
        desbordadas.length === 0,
        `${contexto}: nada se sale de su casilla (${desbordadas.length} desbordada(s))`
      );
    }

    // En la vista vertical cada fila es un grid aparte: que las columnas caigan
    // en la misma x en todas las filas es lo único que hace legible la matriz.
    function afirmarColumnasAlineadas(contexto) {
      const columnas = [...document.querySelectorAll('.fila-casilla')]
        .filter((fila) => fila.querySelector('.casilla'))
        .map((fila) => [...fila.querySelectorAll('.casilla')]
          .map((c) => Math.round(c.getBoundingClientRect().left)).join(','));
      afirmar(
        new Set(columnas).size === 1,
        `${contexto}: todas las filas alinean sus columnas (${new Set(columnas).size} disposición(es))`
      );
    }

    // La misma comprobación que arriba, pero para la matriz horizontal de
    // otras búsquedas dinámicas (CLAUDE.md 5.7): ahí una cubeta es una
    // columna y sus renglones bajan dentro de ella, así que lo que tiene que
    // alinearse entre columnas es la altura (`top`), no la posición (`left`).
    function afirmarRenglonesAlineados(contexto) {
      const filas = [...document.querySelectorAll('.columna-casilla')]
        .filter((columna) => columna.querySelector('.casilla'))
        .map((columna) => [...columna.querySelectorAll('.casilla')]
          .map((c) => Math.round(c.getBoundingClientRect().top)).join(','));
      afirmar(
        new Set(filas).size === 1,
        `${contexto}: todas las columnas alinean sus renglones (${new Set(filas).size} disposición(es))`
      );
    }

    const estadoDe = (casilla) =>
      casilla.className.replace(/casilla(--)?/g, '').trim().replace(/\s+/g, '+');

    // Resume el paso actual como "índice:estados" por columna dibujada.
    function retratarEstructura() {
      const apilada = document.querySelector('.estructura-apilada');
      if (apilada) return retratarApilado().join(' // ');

      // El árbol no tiene filas ni columnas: se retrata por lo que se ve en
      // cada nodo y el estado en que lo dejó el paso.
      const arbol = document.querySelector('.arbol');
      if (arbol) {
        return [...arbol.querySelectorAll('.casilla')]
          .map((casilla) => (casilla.textContent.trim() || '·') + ':' + estadoDe(casilla))
          .join(' ');
      }

      // Horizontal apila casilla sobre marca; vertical las pone lado a lado.
      // El retrato es el mismo en ambas: la orientación no cambia qué se dice.
      // La columna de etiquetas de renglón (otras búsquedas dinámicas,
      // CLAUDE.md 5.7) no es una cubeta —no lleva `.casilla` ni tramo— y se
      // excluye aparte.
      return [...document.querySelectorAll('.columna-casilla, .fila-casilla')]
        .filter((grupo) => !grupo.classList.contains('columna-etiquetas'))
        .map((grupo) => {
        const casilla = grupo.querySelector('.casilla');
        // Un tramo elidido no lleva marca de escala: se retrata por lo que
        // dice el propio tramo, que es cuántas casillas resume.
        if (!casilla) return `[${grupo.querySelector('.tramo-elidido').textContent.trim()}]`;
        return grupo.querySelector('.escala__marca').textContent + ':' + estadoDe(casilla);
      }).join(' ');
    }

    // El reproductor es de la operación en curso, sea buscar o insertar, y por
    // eso vive en su propio panel y no dentro del formulario de búsqueda.
    const control = (accion) => document.querySelector(`[data-accion="${accion}"]`);

    // Vaciar pide un segundo clic: el primero pregunta (CLAUDE.md 9). Las
    // pruebas que solo quieren la estructura vacía usan este atajo.
    function vaciar() {
      control('vaciar').click();
      control('vaciar').click();
    }

    // Avanza hasta consumar la operación. No se detiene al ver dos retratos
    // iguales —los primeros pasos del cálculo no tocan la estructura y se
    // verían idénticos— sino que insiste: el reproductor ignora los clics que
    // sobran una vez agotada la traza.
    function agotarTraza(pasos = 12) {
      for (let i = 0; i < pasos; i++) control('siguiente').click();
      return retratarEstructura();
    }

    // Toda operación cierra con un paso sin resaltados, la estructura como
    // queda (2026-09-24): lo que el algoritmo marcó se mira un paso antes.
    // Se avanza de más a propósito —pasado el final, avanzar no hace nada—
    // para que retroceder caiga siempre en el último paso del algoritmo.
    function hastaElUltimoPasoDelAlgoritmo() {
      agotarTraza(60);
      control('anterior').click();
      return retratarEstructura();
    }

    // En la vista apilada cada paso deja su propia fila: se retrata una cadena
    // por fila, leyendo la fila del grid a la que pertenece cada casilla.
    function retratarApilado() {
      const filaDe = (el) => parseInt(el.style.gridRow, 10);
      const porFila = new Map();

      for (const casilla of document.querySelectorAll('.estructura-apilada .casilla')) {
        const fila = filaDe(casilla);
        if (!porFila.has(fila)) porFila.set(fila, []);
        porFila.get(fila).push(casilla);
      }

      return [...porFila.keys()].sort((a, b) => a - b).map((fila) => {
        const marcas = [...document.querySelectorAll('.estructura-apilada .escala__marca')]
          .filter((m) => filaDe(m) === fila + 1)
          .map((m) => m.textContent);
        const estados = porFila.get(fila).map(estadoDe);
        return `${marcas.join(',')} → ${estados.join(',')}`;
      });
    }

    function ejercitarTema(nombreTema, { n, l, claves, objetivo, comparacionesEsperadas, apilada }) {
      registro.push('', `── ${nombreTema} ──`);

      entrarATema(nombreTema);
      afirmar(!!document.querySelector('.pantalla-tema'), 'la pantalla del tema se monta');

      afirmar(
        !document.querySelector('.pantalla-tema__encabezado').textContent.includes('Módulo'),
        'el encabezado no rotula el tema como módulo'
      );

      const formularios = [...document.querySelectorAll('form.panel')];
      afirmar(control('vaciar').hidden, 'sin estructura no hay nada que reiniciar: el botón no aparece');
      enviar(formularios[0], { n, l });
      afirmar(!control('vaciar').hidden, 'con la estructura creada, el botón de reiniciar aparece');
      for (const clave of claves) operar(formularios, 'insertar', clave);

      const dibujadas = [...document.querySelectorAll('.casilla')].length;
      afirmar(dibujadas <= n, `la elisión acota lo dibujado (${dibujadas} de ${n} casillas)`);

      // La estructura es el foco de la clase: tiene que verse sin scroll, o al
      // proyectar se pierde justo lo que la aplicación existe para mostrar.
      // Se mide la pantalla contra el viewport y no el documento entero, porque
      // este informe vive en la misma página y falsearía la altura.
      const pantalla = document.querySelector('.pantalla-tema');
      afirmar(
        pantalla.getBoundingClientRect().height <= window.innerHeight + 1,
        `la pantalla se ancla al viewport (mide ${Math.round(pantalla.getBoundingClientRect().height)} de ${window.innerHeight})`
      );

      const lateral = document.querySelector('.pantalla-tema__panel-lateral');
      afirmar(
        getComputedStyle(lateral).overflowY === 'auto',
        'el desplazamiento vive en el panel lateral, no en la página'
      );

      // Las tres operaciones comparten un panel: un solo campo de clave y un
      // botón por operación. Tres paneles con un campo idéntico cada uno
      // empujaban la reproducción fuera de la pantalla.
      afirmar(
        document.querySelectorAll('.pantalla-tema__panel-lateral [name="clave"]').length === 1,
        'las tres operaciones comparten un solo campo de clave'
      );
      afirmar(
        ['insertar', 'buscar', 'eliminar'].every((accion) => !!formularios[1].querySelector(`[data-accion="${accion}"]`)),
        'el panel de operaciones ofrece insertar, buscar y eliminar'
      );
      // Cinco paneles y no siete: configuración, operaciones, reproducción,
      // métricas y bitácora. No se afirma que todos quepan sin desplazar
      // —a 700 px de alto no caben, y el panel lateral scrollea para eso—,
      // sino que ya no hay tres formularios repetidos empujándolos hacia
      // abajo. El alto medido queda en el registro para ver regresiones.
      const paneles = [...lateral.querySelectorAll('.panel')];
      afirmar(paneles.length === 5, `el panel lateral tiene cinco paneles (tiene ${paneles.length})`);
      afirmar(
        paneles[2].contains(control('siguiente')),
        'la reproducción va justo después de las operaciones'
      );
      registro.push(
        `  panel lateral: ${lateral.scrollHeight} px de contenido en ${lateral.clientHeight} px visibles`
      );

      const caja = document.querySelector('.estructura-horizontal, .estructura-vertical').getBoundingClientRect();
      afirmar(
        caja.top >= 0 && caja.bottom <= window.innerHeight,
        `la estructura entra completa en el viewport (${Math.round(caja.top)}–${Math.round(caja.bottom)} de ${window.innerHeight})`
      );

      operar(formularios, 'buscar', objetivo);
      const siguiente = control('siguiente');
      const anteriorBoton = control('anterior');

      const filas = () => document.querySelectorAll('.apilada__rotulo').length;

      let paso = 1;
      let anterior = null;
      let retrato = retratarEstructura();
      while (retrato !== anterior && paso <= 40) {
        registro.push(`  paso ${paso}: ${retrato}`);
        // El paso final ya no apila: dibuja la estructura entera.
        if (apilada && document.querySelector('.estructura-apilada')) {
          afirmar(filas() === paso, `el paso ${paso} deja ${paso} estructura(s) a la vista`);
        }
        anterior = retrato;
        siguiente.click();
        retrato = retratarEstructura();
        paso++;
      }

      // Aquí la traza ya está en su paso final: la estructura como queda.
      // Una búsqueda que halló la clave la deja marcada; lo demás se apaga.
      // En binaria el apilado se va: queda la estructura entera, como si todo
      // se hubiera reiniciado, con la clave hallada (2026-09-27).
      afirmar(
        !/en-evaluacion|rango-activo|descartada/.test(retrato),
        `el paso final deja la estructura sin rango ni recorrido (${retrato})`
      );
      afirmar(
        (retrato.match(/encontrada/g) || []).length === 1,
        `el paso final de una búsqueda deja marcada la clave hallada (${retrato})`
      );
      if (apilada) {
        afirmar(
          !document.querySelector('.estructura-apilada'),
          'el paso final dibuja la estructura entera y no otra fila del apilado'
        );
      }
      anteriorBoton.click();
      retrato = retratarEstructura();

      afirmar(retrato.includes('encontrada'), `localiza la clave ${objetivo}`);
      // Con la clave hallada a la vista: su marca ✓ es de las que ensanchaban
      // la casilla y desalineaban la fila —o la columna del apilado—.
      afirmarCasillasParejas(nombreTema);

      if (apilada) {
        // Cada fila es la estructura entera —lo descartado se apaga en su
        // sitio, no se recorta (2026-09-27)—, así que todas miden lo mismo; lo
        // que se achica de fila en fila es lo que sigue encendido.
        const filasApiladas = retratarApilado();
        const anchos = filasApiladas.map((fila) => fila.split('→')[1].split(',').length);
        afirmar(
          new Set(anchos).size === 1,
          `todas las filas dibujan la estructura entera (${anchos.join(' → ')})`
        );
        const encendidas = filasApiladas.map((fila) => fila.split('→')[1].split(',').filter((e) => e !== 'descartada').length);
        afirmar(
          encendidas.every((cuantas, i) => i === 0 || cuantas < encendidas[i - 1]),
          `lo que sigue encendido se achica de fila en fila (${encendidas.join(' → ')})`
        );

        // El rótulo de cada paso nombra su fila, así que va a su altura. Vivía
        // a caballo entre la fila de las casillas y la de la escala, y se
        // centraba entre las dos: quedaba 16 px por debajo de lo que nombra
        // (defecto visto por el usuario, 2026-09-11).
        //
        // **Se mide el texto y no la caja.** Centrada la caja, el texto todavía
        // quedaba 6 px alto porque un relleno sobrante lo empujaba a su mitad
        // superior: medir la caja daba por bueno lo que a ojo seguía torcido.
        // Un `Range` sobre el contenido devuelve dónde están las letras.
        const filaDe = (el) => parseInt(el.style.gridRow, 10);
        const centroDeCaja = (el) => {
          const rango = document.createRange();
          rango.selectNodeContents(el);
          const r = rango.getBoundingClientRect();
          return Math.round(r.top + r.height / 2);
        };
        const casillasApiladas = [...document.querySelectorAll('.estructura-apilada .casilla')];
        const desviados = [...document.querySelectorAll('.apilada__rotulo')]
          .map((rotulo) => {
            const casilla = casillasApiladas.find((c) => filaDe(c) === filaDe(rotulo));
            return casilla ? Math.abs(centroDeCaja(rotulo) - centroDeCaja(casilla)) : 0;
          })
          .filter((desvio) => desvio > 1);
        afirmar(
          desviados.length === 0,
          `cada rótulo «Paso n» va a la altura de su fila (${desviados.length} desviado(s))`
        );

        const antesDeRetroceder = filas();
        anteriorBoton.click();
        afirmar(
          filas() === antesDeRetroceder - 1,
          `retroceder quita la última estructura (${antesDeRetroceder} → ${filas()})`
        );
        siguiente.click();
      }

      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(
        metricas[0] === String(comparacionesEsperadas),
        `usa ${comparacionesEsperadas} comparaciones (reporta ${metricas[0]})`
      );

      // Al paso final, y una vez más: insistir pasado el final no es un paso.
      agotarTraza(3);
      const filasAntes = document.querySelectorAll('.bitacora__fila').length;
      siguiente.click();
      const filasBitacora = [...document.querySelectorAll('.bitacora__fila')].map((f) => f.textContent);
      afirmar(filasBitacora.length === filasAntes, 'la bitácora no repite el último mensaje al agotar la traza');
      const metricasFinales = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(
        metricasFinales[0] === String(comparacionesEsperadas),
        `el paso final conserva las comparaciones de la operación (reporta ${metricasFinales[0]})`
      );
      registro.push('  bitácora final: ' + filasBitacora[filasBitacora.length - 1]);

      // Reiniciar vacía la estructura sin salir del tema y conserva sus datos:
      // n y l siguen siendo los que se digitaron.
      // Un solo clic pregunta y no vacía: es la confirmación que pidió el
      // usuario, sin diálogo (CLAUDE.md 9).
      control('vaciar').click();
      afirmar(
        clavesDibujadas().length > 0 && /¿Vaciar/.test(control('vaciar').textContent),
        'el primer clic pregunta en vez de vaciar'
      );
      control('vaciar').click();
      afirmar(clavesDibujadas().length === 0, `vaciar deja la estructura sin claves (quedan ${clavesDibujadas().length})`);
      operar(formularios, 'insertar', claves[0]);
      afirmar(
        clavesDibujadas().join(' ') === String(claves[0]),
        'tras vaciar se puede volver a insertar sobre la misma estructura'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        ejecutar();
      } catch (error) {
        fallas++;
        registro.push(`EXCEPCIÓN: ${error && error.stack ? error.stack : error}`);
      }
      registro.unshift(fallas === 0 ? 'RESULTADO: sin fallas' : `RESULTADO: ${fallas} fallas`);
      document.getElementById('salida').textContent = registro.join('\n');
    });

    function ejecutar() {
      // El catálogo no numera los temas: ese es el pedido del docente.
      const numerados = [...document.querySelectorAll('.indice__tema')]
        .filter((el) => /^\s*\d/.test(el.textContent));
      afirmar(numerados.length === 0, 'ningún tema del catálogo aparece numerado');

      ejercitarTema('Búsqueda secuencial', {
        n: 16, l: 2, claves: [10, 20, 30, 40, 50, 60, 70, 80],
        objetivo: 70, comparacionesEsperadas: 7
      });

      ejercitarTema('Búsqueda binaria', {
        n: 16, l: 2, claves: [10, 20, 30, 40, 50, 60, 70, 80],
        objetivo: 70, comparacionesEsperadas: 3, apilada: true
      });

      binariaSinResultado();
      hashCalculoReproducible();
      hashColisionSinTratamiento();
      hashReasignacion();
      hashCuadrado();
      hashTruncamiento();
      hashPlegamiento();
      hashBases();
      hashTablaGrande();
      eliminarEnSecuencial();
      eliminarEnBinaria();
      eliminarConReasignacion();
      avisosDeLaTraza();
      anidados();
      encadenamiento();
      arbolDigital();
      residuos();
      residuosMultiples();
      cubetas();
      secuencialExterna();
      binariaExterna();
      arbolDeHuffman();
      indices();
      controlDeElision();
      lienzoSinBarras();
      archivos();
      controlDeVelocidad();
    }

    // La tabla grande es donde se ve la regla del docente: en una estructura
    // que no cabe en pantalla se dibujan la 1, la n y las claves colocadas, y
    // nada entre medias. Antes cada clave arrastraba dos casillas vacías y la
    // estructura desbordaba su lienzo sin que nada lo delatara: la
    // comprobación de layout medía la caja, que `max-height` deja siempre
    // dentro del viewport.
    function hashTablaGrande() {
      registro.push('', '── Tabla dispersa grande ──');

      const claves = [1004, 1010, 1023, 1035, 1016, 3025];
      const formularios = entrarATemaHash('Función plegamiento', { n: 100, l: 4, tratamiento: 'reasignacion'
      });
      for (const clave of claves) {
        operar(formularios, 'insertar', clave);
        agotarTraza();
      }
      // En el paso final la clave recién puesta ya no lleva marca, pero la
      // vista no tiene por qué haberse ido de ella: sin casilla que seguir,
      // el desplazamiento se queda donde estaba.
      {
        const lienzo = document.querySelector('.estructura-vertical').getBoundingClientRect();
        const ultima = [...document.querySelectorAll('.casilla')]
          .find((c) => c.textContent.includes(String(claves[claves.length - 1])))
          .getBoundingClientRect();
        afirmar(
          ultima.top >= lienzo.top && ultima.bottom <= lienzo.bottom,
          'en el paso final la última clave insertada sigue a la vista'
        );
      }
      control('anterior').click();

      const marcas = [...document.querySelectorAll('.fila-casilla')]
        .map((fila) => (fila.querySelector('.escala__marca') || fila.querySelector('.tramo-elidido')).textContent.trim());
      registro.push('  dibujado: ' + marcas.join(' · '));

      const dibujadas = document.querySelectorAll('.casilla').length;
      afirmar(
        dibujadas === claves.length + 2,
        `se dibujan la 1, la n y una casilla por clave (${dibujadas} para ${claves.length} claves)`
      );
      afirmar(
        document.querySelectorAll('.fila-casilla .casilla--vacia').length === 2,
        'las únicas casillas vacías dibujadas son los extremos de la estructura'
      );

      // La casilla donde acaba de caer la clave es lo que el estudiante mira al
      // terminar el cálculo: tiene que estar a la vista, no bajo el pliegue.
      // Cuando la tabla no cabe en el lienzo —depende del alto de la ventana—
      // eso lo garantiza el desplazamiento automático, no la elisión.
      const verticalEl = document.querySelector('.estructura-vertical');
      registro.push(
        `  lienzo: ${verticalEl.scrollHeight} px de contenido en ${verticalEl.clientHeight} px visibles`
        + ` (desplazado ${Math.round(verticalEl.scrollTop)} px)`
      );
      const caja = verticalEl.getBoundingClientRect();
      const marcada = document.querySelector('.casilla--insertada, .casilla--encontrada').getBoundingClientRect();
      afirmar(
        marcada.top >= caja.top && marcada.bottom <= caja.bottom,
        'la casilla de la última clave insertada queda a la vista'
      );

      // Buscar una clave colocada al principio obliga a volver atrás: si el
      // desplazamiento solo supiera avanzar, la casilla quedaría por encima.
      operar(formularios, 'buscar', claves[0]);
      hastaElUltimoPasoDelAlgoritmo();
      const cajaBusqueda = verticalEl.getBoundingClientRect();
      const encontrada = document.querySelector('.casilla--encontrada').getBoundingClientRect();
      afirmar(
        encontrada.top >= cajaBusqueda.top && encontrada.bottom <= cajaBusqueda.bottom,
        'al buscar una clave de más arriba, la vista vuelve a ella'
      );

      // La escala sigue completa aunque falten casillas: lo dibujado más lo
      // que declaran los tramos son las n casillas de la estructura.
      // El conteo del propio tramo (`⋯ 3 ⋯`) es lo único que queda declarando
      // lo elidido desde que la escala dejó de rotular el rango.
      const ocultas = [...document.querySelectorAll('.tramo-elidido')]
        .map((el) => Number(el.textContent.replace(/[^0-9]/g, '')))
        .reduce((suma, cantidad) => suma + cantidad, 0);
      afirmar(
        ocultas + dibujadas === 100,
        `la escala no pierde casillas (${dibujadas} dibujadas + ${ocultas} elididas)`
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Plegamiento no tiene parámetro: el tamaño del grupo sale de n. Se
    // comprueba que el formulario no invente un campo que el tema no declaró.
    function hashPlegamiento() {
      registro.push('', '── Función plegamiento ──');

      const formularios = entrarATemaHash('Función plegamiento', { n: 12, l: 4, tratamiento: 'reasignacion'
      });
      afirmar(
        !!formularios[0].querySelector('select[name="operacion"]')
          && !formularios[0].querySelector('[name="posiciones"]')
          && !formularios[0].querySelector('[name="base"]'),
        'el tema declara su operación como lista y no hereda los campos de los otros'
      );

      // 7412 con n = 12 → grupos de 2 → 74 + 12 = 86 → 86 + 1 = 87 → 3.
      operar(formularios, 'insertar', 7412);
      hastaElUltimoPasoDelAlgoritmo();
      registro.push('  suma: ' + lineasCalculo().join(' | '));
      afirmar(lineasCalculo()[2].includes('74 + 12'), 'el desarrollo muestra la suma de los grupos');
      afirmar(
        casillaEn(3).querySelector('.casilla').textContent === '7412',
        'la clave cae en la dirección que da la suma recortada y ajustada'
      );

      // La misma clave con la otra operación cae en otra casilla:
      // 74 × 12 = 888 → últimas dos cifras 88 → 88 + 1 = 89 → 5.
      enviar(formularios[0], { n: 12, l: 4, operacion: 'multiplicar', tratamiento: 'reasignacion'
      });
      operar(formularios, 'insertar', 7412);
      hastaElUltimoPasoDelAlgoritmo();
      registro.push('  producto: ' + lineasCalculo().join(' | '));
      afirmar(lineasCalculo()[2].includes('74 × 12'), 'con la otra operación el desarrollo muestra el producto');
      afirmar(
        casillaEn(5).querySelector('.casilla').textContent === '7412',
        'la operación elegida al crear la estructura cambia la dirección'
      );

      const bitacoraPlegado = [...document.querySelectorAll('.bitacora__fila')].map((f) => f.textContent);
      afirmar(
        bitacoraPlegado.some((fila) => fila.includes('operación entre grupos multiplicar')),
        'la bitácora deja registro de la operación con la que se creó la estructura'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Conversión de bases es el tema que cubre el caso binario del documento:
    // se comprueba con base 2, que es el que interesa comprobar.
    function hashBases() {
      registro.push('', '── Conversión de bases ──');

      // El ejercicio del docente: n = 100, b = 6, clave 1836. Las cifras de la
      // clave se leen como cifras en base 6 y se evalúa el polinomio:
      // 1×6³ + 8×6² + 3×6¹ + 6×6⁰ = 528; las dos últimas cifras son 28 y la
      // dirección cierra con el + 1, como las otras cuatro funciones: casilla 29.
      const formularios = entrarATemaHash('Conversión de bases', { n: 100, l: 4, base: '6', tratamiento: 'reasignacion'
      });
      operar(formularios, 'insertar', 1836);
      hastaElUltimoPasoDelAlgoritmo();
      registro.push('  base 6: ' + lineasCalculo().join(' | '));
      afirmar(
        lineasCalculo()[1].includes('8×6²'),
        'el desarrollo muestra la clave leída como cifras en la base'
      );
      afirmar(
        lineasCalculo()[1].includes('528'),
        'el desarrollo llega al total del polinomio'
      );
      afirmar(
        casillaEn(29).querySelector('.casilla').textContent === '1836',
        'el ejercicio del docente cae en la casilla 29: 28 más el + 1 final'
      );

      // Sin base indicada se usa 11: 7×11³ + 4×11² + 1×11¹ + 2×11⁰ = 9814,
      // las dos últimas cifras son 14 y con el + 1 la dirección es 15.
      enviar(formularios[0], { n: 100, l: 4, base: '', tratamiento: 'reasignacion' });
      operar(formularios, 'insertar', 7412);
      hastaElUltimoPasoDelAlgoritmo();
      registro.push('  base 11: ' + lineasCalculo().join(' | '));
      afirmar(lineasCalculo()[1].includes('9814'), 'sin base indicada se usa la de clase, 11');
      afirmar(
        casillaEn(15).querySelector('.casilla').textContent === '7412',
        'la dirección son las últimas cifras del total, contadas en decimal'
      );

      // Base 2: las cifras de la clave pesan como bits.
      // 7×2³ + 4×2² + 1×2¹ + 2×2⁰ = 56 + 16 + 2 + 2 = 76.
      enviar(formularios[0], { n: 100, l: 4, base: '2', tratamiento: 'reasignacion' });
      operar(formularios, 'insertar', 7412);
      hastaElUltimoPasoDelAlgoritmo();
      registro.push('  base 2: ' + lineasCalculo().join(' | '));
      afirmar(lineasCalculo()[1].includes('76'), 'con base 2 las cifras de la clave pesan como bits');

      // Una base imposible se rechaza al crear, no al insertar.
      enviar(formularios[0], { n: 12, l: 4, base: '99', tratamiento: 'reasignacion' });
      const alerta = document.querySelector('.alerta');
      afirmar(
        !!alerta && alerta.textContent.includes('Base inválida'),
        'una base fuera de rango se rechaza al crear la estructura'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Truncamiento es el primer tema con un parámetro propio. Se comprueba que
    // el campo aparezca, que lo escrito llegue hasta el cálculo, y que una
    // posición imposible se rechace al crear y no al insertar.
    function hashTruncamiento() {
      registro.push('', '── Función truncamiento ──');

      entrarATema('Función truncamiento');
      const formularios = [...document.querySelectorAll('form.panel')];

      afirmar(
        !!formularios[0].querySelector('[name="posiciones"]'),
        'el tema declara su propio campo de configuración'
      );

      // La clave tiene 4 cifras: la posición 6 no existe.
      enviar(formularios[0], { n: 12, l: 4, posiciones: '1,6', tratamiento: 'reasignacion' });
      const alerta = document.querySelector('.alerta');
      afirmar(!!alerta && alerta.textContent.includes('Posición fuera de rango'),
        'una posición que la clave no tiene se rechaza al crear la estructura');
      afirmar(
        document.querySelectorAll('.fila-casilla').length === 0,
        'la estructura no se crea cuando el parámetro es inválido'
      );

      // 7412 con posiciones 1 y 3 → cifras 7 y 1 → 71 + 1 → 72 no cabe en 1..12 → 12.
      enviar(formularios[0], { n: 12, l: 4, posiciones: '1,3', tratamiento: 'reasignacion' });
      operar(formularios, 'insertar', 7412);
      hastaElUltimoPasoDelAlgoritmo();
      registro.push('  cálculo: ' + lineasCalculo().join(' | '));
      afirmar(
        lineasCalculo()[1].includes('[7] 4 [1] 2'),
        'el desarrollo marca en la clave las cifras que se tomaron'
      );
      afirmar(
        casillaEn(12).querySelector('.casilla').textContent === '7412',
        'las posiciones escritas por el usuario son las que deciden la dirección'
      );

      const bitacora = [...document.querySelectorAll('.bitacora__fila')].map((f) => f.textContent);
      afirmar(
        bitacora.some((fila) => fila.includes('posiciones a tomar 1,3')),
        'la bitácora deja registro del parámetro con el que se creó la estructura'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Cuadrado entra por la misma puerta que módulo: lo único que cambia es el
    // desarrollo del cálculo. Si esta prueba obliga a tocar la pantalla, es
    // señal de que el contrato { direccion, calculo } se quedó corto.
    function hashCuadrado() {
      registro.push('', '── Función cuadrado ──');

      const formularios = entrarATemaHash('Función cuadrado', { n: 12, l: 4, tratamiento: 'reasignacion'
      });

      // 1004² = 1008016 → centrales "08" → 8 + 1 → dirección 9.
      operar(formularios, 'insertar', 1004);
      hastaElUltimoPasoDelAlgoritmo();
      registro.push('  cálculo: ' + lineasCalculo().join(' | '));
      afirmar(
        lineasCalculo()[1].includes('1008016'),
        'el desarrollo muestra el cuadrado completo, no solo las cifras tomadas'
      );
      afirmar(
        casillaEn(9).querySelector('.casilla').textContent === '1004',
        'la clave cae en la dirección que dan las cifras centrales'
      );

      // 1010² = 1020100 → centrales "20" → 21 no cabe en 1..12 y se ajusta a 9,
      // así que choca con la anterior y la reasignación la manda a la 10.
      operar(formularios, 'insertar', 1010);
      const retrato = hastaElUltimoPasoDelAlgoritmo();
      registro.push('  estructura: ' + retrato);
      afirmar(
        lineasCalculo()[3].includes('ajustado a 1..12'),
        'el desarrollo dice que la dirección se ajustó al rango'
      );
      afirmar(
        casillaEn(10).querySelector('.casilla').textContent === '1010',
        'la clave ajustada colisiona y la reasignación la coloca en la casilla 10'
      );

      operar(formularios, 'buscar', 1010);
      afirmar(hastaElUltimoPasoDelAlgoritmo().includes('encontrada'), 'la búsqueda repite el mismo cálculo y la halla');

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Las claves dibujadas, en orden, ignorando las casillas vacías.
    const clavesDibujadas = () => [...document.querySelectorAll('.casilla')]
      .map((el) => el.textContent.replace(/[^0-9]/g, ''))
      .filter(Boolean);

    // Eliminar es buscar y además sacar: la clave se localiza con el algoritmo
    // del tema. Aquí se comprueba lo que solo se ve por el DOM: que la casilla
    // marcada conserva su clave antes de que las demás se muevan, que el
    // desplazamiento la saca, y que retroceder la devuelve.
    function eliminarEnSecuencial() {
      registro.push('', '── Búsqueda secuencial · eliminar ──');

      entrarATema('Búsqueda secuencial');
      const formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 12, l: 2 });
      for (const clave of [10, 20, 30, 40, 50]) operar(formularios, 'insertar', clave);

      operar(formularios, 'eliminar', 30);
      // Dos comparaciones y el hallazgo: el tercer clic deja el paso que marca.
      for (let i = 0; i < 3; i++) control('siguiente').click();

      const marcada = document.querySelector('.casilla--eliminada');
      afirmar(!!marcada, 'la casilla de la clave que sale queda marcada');
      afirmar(
        marcada && marcada.textContent.includes('30'),
        'la casilla marcada conserva su clave: todavía no se ha desplazado nada'
      );
      registro.push('  al marcar: ' + clavesDibujadas().join(' '));
      // La marca ✕ de la casilla que sale es lo más ancho que se dibuja dentro
      // de una casilla: aquí se comprueba que le cabe sin ensanchar la suya.
      afirmarCasillasParejas('secuencial al marcar la clave que sale');

      control('siguiente').click();
      registro.push('  tras desplazar: ' + clavesDibujadas().join(' '));
      afirmar(
        clavesDibujadas().join(' ') === '10 20 40 50',
        'la clave sale y las siguientes cierran el hueco'
      );

      control('anterior').click();
      afirmar(
        clavesDibujadas().join(' ') === '10 20 30 40 50',
        'retroceder devuelve la clave a su casilla'
      );

      // Una clave que no está no se avisa por adelantado: la búsqueda tiene
      // que recorrer hasta concluirlo, que es lo que el tema enseña.
      operar(formularios, 'eliminar', 99);
      agotarTraza();
      const bitacora = [...document.querySelectorAll('.bitacora__fila')].map((f) => f.textContent);
      afirmar(
        bitacora[bitacora.length - 1].includes('no localizada'),
        'eliminar una clave ausente termina en la conclusión de la búsqueda'
      );
      afirmar(
        clavesDibujadas().join(' ') === '10 20 40 50',
        'la eliminación anterior quedó consumada y la fallida no tocó nada'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    // En binaria el apilado es el dispositivo de la búsqueda. Los pasos que
    // sacan la clave no descartan nada, así que se dibujan sobre la estructura
    // completa: es donde el desplazamiento se ve moverse.
    function eliminarEnBinaria() {
      registro.push('', '── Búsqueda binaria · eliminar ──');

      entrarATema('Búsqueda binaria');
      const formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 12, l: 2 });
      for (const clave of [10, 20, 30, 40, 50, 60, 70, 80]) operar(formularios, 'insertar', clave);

      operar(formularios, 'eliminar', 70);
      for (let i = 0; i < 2; i++) control('siguiente').click();
      afirmar(
        !!document.querySelector('.estructura-apilada'),
        'mientras busca, la eliminación apila una estructura por paso'
      );
      registro.push('  buscando: ' + retratarEstructura());

      control('siguiente').click();
      afirmar(
        !document.querySelector('.estructura-apilada') && !!document.querySelector('.estructura-horizontal'),
        'al sacar la clave se vuelve a la estructura completa'
      );
      const marcada = document.querySelector('.casilla--eliminada');
      afirmar(
        !!marcada && marcada.textContent.includes('70'),
        'la casilla marcada es la de la clave buscada, con su clave todavía dentro'
      );

      control('siguiente').click();
      registro.push('  tras desplazar: ' + clavesDibujadas().join(' '));
      afirmar(
        clavesDibujadas().join(' ') === '10 20 30 40 50 60 80',
        'la clave sale y la estructura queda ordenada y densa'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    // El caso que obliga a redispersar: borrar en medio de un sondeo deja un
    // hueco que corta la cadena, y las claves de atrás vuelven a pasar por la
    // función hash. Sin eso, buscar 9912 pararía en la casilla vacía.
    function eliminarConReasignacion() {
      registro.push('', '── Función módulo · eliminar con reasignación ──');

      const formularios = entrarAModulo({ n: 10, l: 4, tratamiento: 'reasignacion' });
      for (const clave of [7412, 5312, 9912]) {
        operar(formularios, 'insertar', clave);
        agotarTraza();
      }
      registro.push('  antes: ' + retratarEstructura());

      operar(formularios, 'eliminar', 5312);
      agotarTraza(30);
      registro.push('  después: ' + retratarEstructura());

      afirmar(
        casillaEn(3).querySelector('.casilla').textContent === '7412',
        'la clave que estaba en su dirección no se mueve'
      );
      afirmar(
        casillaEn(4).querySelector('.casilla').textContent === '9912',
        'la clave de atrás se redispersa y sube a la casilla que quedó libre'
      );
      afirmar(
        casillaEn(5).querySelector('.casilla').textContent === '',
        'la casilla que ocupaba queda vacía'
      );

      const bitacora = [...document.querySelectorAll('.bitacora__fila')].map((f) => f.textContent);
      afirmar(
        bitacora.some((linea) => linea.includes('volver a dispersarla')),
        'la bitácora deja ver que la clave se levantó para volver a dispersarse'
      );

      operar(formularios, 'buscar', 9912);
      afirmar(
        hastaElUltimoPasoDelAlgoritmo().includes('encontrada'),
        'tras redispersar, la búsqueda vuelve a encontrar la clave movida'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Lo que pasa durante la traza tiene que decirse, no solo verse en la
    // estructura, y el aviso tiene que seguir a la vista aunque la columna
    // esté desplazada: con el scroll abajo, un aviso en el borde superior
    // quedaba fuera de la vista y había que subir a buscarlo.
    function avisosDeLaTraza() {
      registro.push('', '── Avisos ──');

      const formularios = entrarAModulo({ n: 10, l: 4, tratamiento: 'ninguno' });
      operar(formularios, 'insertar', 7412);
      agotarTraza();
      afirmar(
        !!aviso() && aviso().textContent.includes('insertada'),
        'la inserción deja constancia en el aviso, no solo en la bitácora'
      );

      // 5312 comparte dirección con 7412 y sin tratamiento no entra.
      operar(formularios, 'insertar', 5312);
      hastaElUltimoPasoDelAlgoritmo();
      registro.push('  aviso final: ' + aviso().textContent);
      afirmar(
        aviso().classList.contains('alerta--error') && aviso().textContent.includes('no insertada'),
        'la clave rechazada se anuncia como error'
      );

      control('anterior').click();
      registro.push('  al retroceder: ' + aviso().textContent);
      afirmar(
        aviso().classList.contains('alerta--advertencia') && aviso().textContent.includes('Colisión'),
        'retroceder devuelve el aviso que correspondía a ese punto: la colisión'
      );

      // El aviso está anclado: no se va con el desplazamiento de la columna.
      const lateral = document.querySelector('.pantalla-tema__panel-lateral');
      lateral.scrollTop = lateral.scrollHeight;
      const cajaLateral = lateral.getBoundingClientRect();
      const cajaAviso = aviso().getBoundingClientRect();
      registro.push(
        `  panel desplazado ${Math.round(lateral.scrollTop)} px de ${lateral.scrollHeight};`
        + ` aviso en ${Math.round(cajaAviso.top)}, panel de ${Math.round(cajaLateral.top)} a ${Math.round(cajaLateral.bottom)}`
      );
      afirmar(
        cajaAviso.top >= cajaLateral.top - 1 && cajaAviso.bottom <= cajaLateral.bottom,
        'el aviso sigue a la vista con el panel lateral desplazado hasta abajo'
      );

      // Los pasos de trámite no avisan: sin eso el aviso parpadearía en cada
      // clic y dejaría de leerse como una noticia.
      operar(formularios, 'buscar', 7412);
      control('siguiente').click();
      afirmar(
        !aviso(),
        'los primeros pasos del cálculo no levantan aviso'
      );
      agotarTraza();
      afirmar(
        !!aviso() && aviso().textContent.includes('localizada'),
        'al hallar la clave el aviso lo dice'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Arreglos anidados: cada dirección dibuja su estructura secundaria al
    // lado, como una matriz. La primera columna es la tabla y las demás el
    // arreglo, así que hay que comprobar que cada casilla cae en su columna y
    // que la clave que chocó no se fue a otra dirección.
    function anidados() {
      registro.push('', '── Arreglos anidados ──');

      const formularios = entrarATemaHash('Función módulo', { n: 10, l: 4, tratamiento: 'anidados'
      });
      // El tamaño del arreglo no se pide: la matriz es de n × n, así que sale
      // de n. Pedirlo era el error que el usuario corrigió.
      afirmar(
        !formularios[0].querySelector('[name="tamanoAnidado"]'),
        'el formulario no pide el tamaño del arreglo: sale de n'
      );

      // 7412, 5312 y 9912 comparten la dirección 3.
      for (const clave of [7412, 5312, 9912, 1023]) {
        operar(formularios, 'insertar', clave);
        agotarTraza();
      }

      const fila = (indice) => [...document.querySelectorAll('.fila-casilla')]
        .find((f) => {
          const marca = f.querySelector('.escala__marca');
          return marca && marca.textContent === String(indice);
        });
      const contenido = (indice) => [...fila(indice).querySelectorAll('.casilla')]
        .map((el) => el.textContent.replace(/[^0-9]/g, '') || '·')
        .join(' ');

      registro.push('  dirección 3: ' + contenido(3));
      registro.push('  dirección 4: ' + contenido(4));
      afirmar(contenido(3).startsWith('7412 5312 9912'), 'las tres claves de la dirección 3 caen en su fila');
      afirmar(/^1023( ·)+$/.test(contenido(4)), 'una dirección sin colisiones dibuja su arreglo vacío');
      // Matriz de n × n: la tabla más n − 1 columnas de arreglo. Con n = 10
      // son nueve, y caben sin elidir.
      const anidadasDibujadas = fila(3).querySelectorAll('.casilla--anidada').length;
      afirmar(
        anidadasDibujadas === 9,
        `cada dirección dibuja n − 1 = 9 casillas anidadas (dibuja ${anidadasDibujadas})`
      );
      // La matriz con claves dentro: es donde el ancho variable se notaba, con
      // las filas ocupadas más anchas que las vacías.
      afirmarCasillasParejas('matriz de n × n');
      afirmarColumnasAlineadas('matriz de n × n');

      // La clave nunca se aleja de su dirección: es lo que separa este
      // tratamiento de la reasignación.
      afirmar(
        [...document.querySelectorAll('.fila-casilla')].every((f) => {
          const marca = f.querySelector('.escala__marca');
          return !marca || !['5', '6'].includes(marca.textContent)
            || ![...f.querySelectorAll('.casilla')].some((c) => c.textContent.replace(/[^0-9]/g, ''));
        }),
        'ninguna clave se fue a otra dirección'
      );

      operar(formularios, 'buscar', 9912);
      agotarTraza();
      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(metricas[0] === '3', `buscar en el arreglo cuesta 3 comparaciones (reporta ${metricas[0]})`);
      // La matriz es de n × n, así que caben 100 claves y no 10: medir contra
      // n daría más de 1 con la tabla a medio llenar.
      afirmar(
        metricas[2] === '0.04',
        `el factor de carga se mide contra n × n = 100 (reporta ${metricas[2]})`
      );

      // Al sacar la de la tabla, la primera del arreglo sube a ocuparla.
      operar(formularios, 'eliminar', 7412);
      agotarTraza(20);
      registro.push('  tras eliminar 7412: ' + contenido(3));
      afirmar(contenido(3).startsWith('5312 9912'), 'la primera del arreglo sube a la casilla y las demás se desplazan');

      // Con el arreglo lleno la clave no entra y se dice por qué.
      // Con n = 2 una dirección sostiene 2 claves: la tabla y una del arreglo.
      enviar(formularios[0], { n: 2, l: 4, tratamiento: 'anidados' });
      for (const clave of [7412, 5312]) {
        operar(formularios, 'insertar', clave);
        agotarTraza();
      }
      operar(formularios, 'insertar', 9912);
      agotarTraza();
      registro.push('  saturado: ' + aviso().textContent);
      afirmar(
        aviso().classList.contains('alerta--error') && aviso().textContent.includes('saturado'),
        'con el arreglo lleno la clave no entra y el aviso lo dice'
      );

      // Con n grande el arreglo tiene n − 1 columnas y no caben: elide con la
      // misma regla que la tabla —la primera, la última, las ocupadas, y un
      // tramo diciendo cuánto se resumió—.
      enviar(formularios[0], { n: 100, l: 4, tratamiento: 'anidados' });
      for (const clave of [1004, 1104, 1204]) {
        operar(formularios, 'insertar', clave);
        agotarTraza();
      }
      const filaAncha = [...document.querySelectorAll('.fila-casilla')]
        .find((f) => {
          const marca = f.querySelector('.escala__marca');
          return marca && marca.textContent === '5';
        });
      const dibujadasEnAncha = filaAncha.querySelectorAll('.casilla--anidada').length;
      registro.push(
        `  n = 100: ${dibujadasEnAncha} casillas anidadas dibujadas de 99, con `
        + `${filaAncha.querySelectorAll('.tramo-elidido--anidado').length} tramo(s)`
      );
      afirmar(
        dibujadasEnAncha < 99 && filaAncha.querySelectorAll('.tramo-elidido--anidado').length > 0,
        'con n grande el arreglo anidado elide como la tabla, con su tramo'
      );
      // Todas las filas dibujan las mismas columnas: si cada una elidiera por
      // su cuenta, la matriz dejaría de estar alineada.
      const anchos = [...document.querySelectorAll('.fila-casilla')]
        .filter((f) => f.querySelector('.casilla'))
        .map((f) => f.querySelectorAll('.casilla--anidada, .tramo-elidido--anidado').length);
      afirmar(
        new Set(anchos).size === 1,
        `todas las filas dibujan las mismas columnas (anchos: ${[...new Set(anchos)].join(', ')})`
      );
      // Y las dibujan en la misma x: con el arreglo elidido, el tramo se
      // dimensiona por su conteo y las casillas por el ancho fijo.
      afirmarColumnasAlineadas('matriz elidida con n = 100');

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Encadenamiento secuencial: el hermano de los arreglos anidados, y lo
    // único que los separa es que la cadena no tiene tope. Lo que solo se ve
    // por el DOM es el dibujo: la flecha del enlace, que una dirección sin
    // colisiones no dibuje cadena, y que una cadena larga elida por su cuenta.
    function encadenamiento() {
      registro.push('', '── Encadenamiento secuencial ──');

      const formularios = entrarATemaHash('Función módulo', { n: 10, l: 4, tratamiento: 'encadenamiento'
      });

      // 7412, 5312 y 9912 comparten la dirección 3.
      for (const clave of [7412, 5312, 9912, 1023]) {
        operar(formularios, 'insertar', clave);
        agotarTraza();
      }

      const fila = (indice) => [...document.querySelectorAll('.fila-casilla')]
        .find((f) => {
          const marca = f.querySelector('.escala__marca');
          return marca && marca.textContent === String(indice);
        });
      const contenido = (indice) => [...fila(indice).querySelectorAll('.casilla')]
        .map((el) => el.textContent.replace(/[^0-9]/g, '') || '·')
        .join(' ');

      registro.push('  dirección 3: ' + contenido(3));
      afirmar(contenido(3) === '7412 5312 9912', 'la cadena cuelga de la casilla, en orden de llegada');
      // La flecha es lo que distingue la cadena del arreglo anidado: una por
      // casilla encadenada, y la primera sale de la casilla de la tabla.
      afirmar(
        fila(3).querySelectorAll('.cadena__enlace').length === 2,
        `cada casilla de la cadena entra por su flecha (${fila(3).querySelectorAll('.cadena__enlace').length})`
      );
      afirmar(!fila(4).querySelector('.cadena'), 'una dirección sin colisiones no dibuja cadena');
      afirmar(!document.querySelector('.casilla--anidada'), 'la cadena no dibuja las casillas vacías del arreglo anidado');
      afirmarCasillasParejas('encadenamiento');

      // La traza no toca la estructura: el efecto lo aplica la pantalla al
      // llegar al paso y lo deshace al retroceder, también en la cadena.
      operar(formularios, 'insertar', 1112);
      hastaElUltimoPasoDelAlgoritmo();
      afirmar(contenido(3) === '7412 5312 9912 1112', 'la clave nueva se engancha al final de la cadena');
      control('anterior').click();
      afirmar(contenido(3) === '7412 5312 9912', 'retroceder saca de la cadena la clave que el paso colocó');
      control('siguiente').click();

      operar(formularios, 'buscar', 9912);
      agotarTraza();
      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(metricas[0] === '3', `buscar en la cadena cuesta 3 comparaciones (reporta ${metricas[0]})`);
      afirmar(metricas[2] === '0.50', `el factor de carga se mide contra n (reporta ${metricas[2]})`);

      // Al sacar la de la tabla, la primera de la cadena sube a ocuparla.
      operar(formularios, 'eliminar', 7412);
      agotarTraza(20);
      registro.push('  tras eliminar 7412: ' + contenido(3));
      afirmar(contenido(3) === '5312 9912 1112', 'la primera de la cadena sube a la casilla y las demás se desplazan');

      // Lo que define al tratamiento: no hay tope, así que no hay saturación.
      // Con n = 2 y arreglos anidados, estas claves no habrían cabido.
      enviar(formularios[0], { n: 2, l: 4, tratamiento: 'encadenamiento' });
      for (const clave of [1001, 1003, 1005, 1007, 1009]) {
        operar(formularios, 'insertar', clave);
        agotarTraza();
      }
      registro.push('  n = 2, cinco claves: ' + contenido(2));
      afirmar(
        !aviso() || !aviso().classList.contains('alerta--error'),
        'la cadena nunca se satura: ninguna clave se rechaza'
      );
      const carga = [...document.querySelectorAll('.metrica__valor')][2].textContent;
      afirmar(carga === '2.50', `el factor de carga pasa de 1 en una tabla encadenada (reporta ${carga})`);

      // Una cadena larga elide como todo lo demás, pero **cada fila por su
      // cuenta**: no hay columnas que alinear, porque la posición en una
      // cadena es orden de llegada y no el resultado del algoritmo.
      for (const clave of [1011, 1013, 1015, 1017, 1019, 1021, 1025, 1027, 1029]) {
        operar(formularios, 'insertar', clave);
        // La traza crece con la cadena: cada posición recorrida es un paso, y
        // con doce por delante los doce clics de siempre no la agotan.
        agotarTraza(30);
      }
      const dibujadas = fila(2).querySelectorAll('.casilla').length;
      const tramos = fila(2).querySelectorAll('.tramo-elidido').length;
      registro.push(`  cadena de 14 claves: ${dibujadas} casillas dibujadas y ${tramos} tramo(s)`);
      afirmar(dibujadas < 14 && tramos > 0, 'una cadena larga elide y dice cuánto resumió');
      afirmarCasillasParejas('cadena elidida');

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Árboles de búsqueda digital (CLAUDE.md 5.5). Lo que solo se ve por el
    // DOM: que el tema no pida n ni l, que la palabra entre como una sola
    // traza reproducible, y que el árbol se dibuje por niveles con el bit
    // rotulando cada arista.
    function arbolDigital() {
      registro.push('', '── Árboles de búsqueda digital ──');

      entrarATema('Árbol de búsqueda digital');
      const formularios = [...document.querySelectorAll('form.panel')];
      const operaciones = formularios[0];

      // El árbol no tiene nada que configurar —ni tamaño, ni longitud de clave,
      // ni tratamiento—, así que no hay panel de configuración: se crea al
      // entrar al tema.
      afirmar(formularios.length === 1, `el tema no dibuja panel de configuración (${formularios.length} formulario(s))`);
      afirmar(
        document.querySelectorAll('.pantalla-tema__panel-lateral .panel').length === 4,
        'el panel lateral queda en cuatro paneles'
      );
      afirmar(!!document.querySelector('.estructura-arbol'), 'el árbol existe desde que se entra al tema');
      afirmarEstructuraCentrada('árbol de búsqueda digital');

      // El ejercicio de clase: «prueba», en una sola operación.
      operaciones.querySelector('[name="palabra"]').value = 'prueba';
      operaciones.querySelector('[data-accion="insertar-palabra"]').click();
      const retrato = hastaElUltimoPasoDelAlgoritmo();
      registro.push('  traza de la palabra: ' + retrato);
      const bitacora = [...document.querySelectorAll('.bitacora__fila')].map((f) => f.textContent);
      afirmar(
        bitacora.some((linea) => linea.includes('Inserción iniciada: palabra prueba')),
        'la palabra entra como una sola operación, no como seis'
      );

      // El retrato del árbol es "nivel:clave" leyendo el dibujo, no el modelo.
      const nodos = () => [...document.querySelectorAll('.arbol .casilla')]
        .map((el) => el.textContent.replace(/[^a-z]/g, ''))
        .filter(Boolean)
        .sort()
        .join('');
      registro.push('  árbol de «prueba»: ' + nodos());
      afirmar(nodos() === 'abepru', 'las seis letras quedan dibujadas en el árbol');
      afirmar(
        document.querySelectorAll('.arbol__arista').length === 5,
        `cada nodo que no es la raíz entra por una arista (${document.querySelectorAll('.arbol__arista').length})`
      );
      const bits = [...document.querySelectorAll('.arbol__bit')].map((el) => el.textContent).sort().join('');
      afirmar(bits === '00001', `las aristas se rotulan con el bit que llevó por ellas (${bits})`);
      afirmarCasillasParejas('árbol digital');

      // Altura: p → e → b → a son cuatro niveles, y es lo que cuesta la peor
      // búsqueda de este árbol.
      const metricas = () => [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(metricas()[2] === '4', `la altura cuenta niveles (reporta ${metricas()[2]})`);

      // Retroceder deshace la última inserción, como en cualquier otra traza.
      control('anterior').click();
      afirmar(nodos() === 'bepru', `retroceder saca del árbol la letra que el paso colocó (queda ${nodos()})`);
      control('siguiente').click();

      operar(formularios, 'buscar', 'u');
      agotarTraza();
      afirmar(metricas()[0] === '3', `buscar u cuesta 3 comparaciones (reporta ${metricas()[0]})`);
      afirmar(
        !!aviso() && aviso().textContent.includes('hijo izquierdo de r'),
        'el aviso dice en qué nodo quedó la clave'
      );

      // Una letra repetida no entra: la traza la descubre y lo dice.
      operar(formularios, 'insertar', 'r');
      agotarTraza();
      afirmar(
        aviso().classList.contains('alerta--error') && aviso().textContent.includes('duplicada'),
        'una letra repetida no entra y el aviso lo dice'
      );

      // Eliminar un nodo con descendientes: sube una hoja de su subárbol, o el
      // árbol quedaría partido.
      operar(formularios, 'eliminar', 'e');
      agotarTraza(20);
      registro.push('  tras eliminar e: ' + nodos());
      afirmar(nodos() === 'abpru', 'la clave sale y una hoja de su subárbol sube a ocupar el sitio');
      afirmar(
        [...document.querySelectorAll('.arbol .casilla')].every((el) => el.textContent.trim() !== ''),
        'no queda ningún hueco dibujado tras cerrar la eliminación'
      );

      // Reiniciar deja la pantalla como recién entrada: antes tocaba salir al
      // menú y volver a entrar (pedido del usuario, 2026-08-29).
      vaciar();
      registro.push('  tras reiniciar: ' + (nodos() || '(vacío)'));
      afirmar(nodos() === '', 'vaciar deja el árbol sin claves');
      const bitacoraTrasReiniciar = [...document.querySelectorAll('.bitacora__fila')].map((f) => f.textContent);
      afirmar(
        bitacoraTrasReiniciar.length === 1 && bitacoraTrasReiniciar[0].includes('Árbol vaciado'),
        `vaciar limpia la bitácora y deja constancia (${bitacoraTrasReiniciar.length} línea(s))`
      );
      afirmar(!aviso(), 'vaciar limpia el aviso en curso');
      operar(formularios, 'insertar', 'p');
      agotarTraza();
      afirmar(nodos() === 'p', 'tras vaciar se puede volver a insertar');

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Entra a un tema de transformación de claves y crea una estructura
    // dispersa. Devuelve los formularios para seguir operando sobre ella.
    // Los parámetros propios del tema —la base, las posiciones, la operación—
    // se reenvían solo si el llamador los pide: pasarlos siempre haría fallar
    // a los temas que no declaran ese campo, y `enviar` no perdona un campo
    // que no existe (así se destapa un formulario que dejó de dibujarlo).
    function entrarATemaHash(tema, opciones) {
      entrarATema(tema);
      const formularios = [...document.querySelectorAll('form.panel')];
      const campos = { n: opciones.n, l: opciones.l, tratamiento: opciones.tratamiento };
      for (const propio of ['base', 'posiciones', 'operacion', 'tamanoAnidado']) {
        if (opciones[propio] !== undefined) campos[propio] = opciones[propio];
      }
      enviar(formularios[0], campos);
      return formularios;
    }

    const entrarAModulo = (opciones) => entrarATemaHash('Función módulo', opciones);

    const lineasCalculo = () => [...document.querySelectorAll('.calculo__linea')]
      .map((el) => el.textContent.replace(/\s+/g, ' ').trim());

    // Las filas de tramo elidido no tienen marca: se saltan, no se rotulan.
    const casillaEn = (indice) => [...document.querySelectorAll('.fila-casilla')]
      .find((fila) => {
        const marca = fila.querySelector('.escala__marca');
        return marca && marca.textContent === String(indice);
      });

    // El cálculo de la dirección es el contenido didáctico del tema: tiene que
    // revelarse línea por línea con el reproductor, y retroceder tiene que
    // deshacer tanto la línea como la colocación de la clave.
    function hashCalculoReproducible() {
      registro.push('', '── Función módulo · cálculo paso a paso ──');

      const formularios = entrarAModulo({ n: 10, l: 4, tratamiento: 'ninguno' });

      afirmar(
        !!document.querySelector('.estructura-vertical'),
        'la estructura se dibuja en vertical'
      );
      afirmar(
        document.querySelectorAll('.fila-casilla .casilla--vacia').length === 10,
        'la estructura dispersa nace con las 10 casillas vacías a la vista'
      );

      // Mismo criterio de layout que en las búsquedas por comparación: la
      // estructura es lo que se proyecta en clase y no puede quedar fuera de
      // pantalla. Aquí además compite por el espacio con el panel del cálculo.
      const pantalla = document.querySelector('.pantalla-tema');
      afirmar(
        pantalla.getBoundingClientRect().height <= window.innerHeight + 1,
        `la pantalla se ancla al viewport (mide ${Math.round(pantalla.getBoundingClientRect().height)} de ${window.innerHeight})`
      );
      // Medir la caja no basta: `max-height: 100%` la deja siempre dentro del
      // viewport aunque por dentro sobresalgan filas que solo se alcanzan
      // desplazando. Lo que hay que comparar es el contenido contra la caja.
      const verticalEl = document.querySelector('.estructura-vertical');
      const cajaVertical = verticalEl.getBoundingClientRect();
      afirmar(
        cajaVertical.top >= 0 && cajaVertical.bottom <= window.innerHeight,
        `la estructura vertical entra completa (${Math.round(cajaVertical.top)}–${Math.round(cajaVertical.bottom)} de ${window.innerHeight})`
      );
      registro.push(`  lienzo: ${verticalEl.scrollHeight} px de contenido en ${verticalEl.clientHeight} px visibles`);
      const cajaCalculo = document.querySelector('.calculo').getBoundingClientRect();
      afirmar(
        cajaCalculo.right <= window.innerWidth && cajaCalculo.bottom <= window.innerHeight,
        `el panel del cálculo cabe junto a la estructura (${Math.round(cajaCalculo.right)} de ${window.innerWidth} de ancho)`
      );

      operar(formularios, 'insertar', 7412);
      afirmar(lineasCalculo().length === 1, 'la inserción arranca revelando una sola línea del cálculo');

      control('siguiente').click();
      afirmar(lineasCalculo().length === 2, 'avanzar revela la segunda línea');
      registro.push('  línea 2: ' + lineasCalculo()[1]);
      afirmar(lineasCalculo()[1].includes('7412 mod 10'), 'la segunda línea muestra la cuenta, no solo el resultado');

      control('siguiente').click();
      afirmar(lineasCalculo().length === 3, 'la tercera línea da la dirección');
      afirmar(
        !!casillaEn(3).querySelector('.casilla--en-evaluacion'),
        'la casilla 3 queda señalada antes de recibir la clave'
      );
      afirmar(
        casillaEn(3).querySelector('.casilla').textContent === '',
        'la clave todavía no está colocada: el cálculo terminó, la inserción no'
      );

      control('siguiente').click();
      afirmar(
        casillaEn(3).querySelector('.casilla').textContent === '7412',
        'el último paso coloca la clave en la casilla 3'
      );
      registro.push('  estructura: ' + retratarEstructura());

      // Retroceder tiene que deshacer el efecto, no solo repintar: si la clave
      // se quedara puesta, la estructura dejaría de corresponder al paso.
      control('anterior').click();
      afirmar(
        casillaEn(3).querySelector('.casilla').textContent === '',
        'retroceder retira la clave que el paso había colocado'
      );
      control('siguiente').click();

      // Crear otra estructura con una inserción a medio reproducir no puede
      // arrastrar la clave pendiente a la estructura nueva.
      operar(formularios, 'insertar', 1111);
      enviar(formularios[0], { n: 10, l: 4, tratamiento: 'ninguno' });
      afirmar(
        document.querySelectorAll('.fila-casilla .casilla--vacia').length === 10,
        'crear otra estructura no arrastra la clave a medio insertar'
      );

      operar(formularios, 'insertar', 7412);
      agotarTraza();
      operar(formularios, 'buscar', 7412);
      const retrato = hastaElUltimoPasoDelAlgoritmo();
      afirmar(retrato.includes('encontrada'), 'la búsqueda localiza la clave por su dirección');
      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(metricas[0] === '1', `una sola comparación, sea cual sea n (reporta ${metricas[0]})`);
      afirmar(metricas[2] === '0.10', `el factor de carga reporta 1 de 10 (reporta ${metricas[2]})`);

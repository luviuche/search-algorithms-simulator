    // Búsqueda por residuos: mismo dibujo por niveles que el árbol digital,
    // pero con las claves solo en las hojas. Lo que hay que ver aquí es que
    // ninguna clave quede en un nodo con hijos, que los nodos de en medio sean
    // puntos y no casillas, y que el árbol —que es más hondo y más ancho que
    // el digital— quepa en su lienzo sin desplazarse.
    function residuos() {
      registro.push('', '── Búsqueda por residuos ──');

      entrarATema('Árbol de búsqueda por residuos');
      const formularios = [...document.querySelectorAll('form.panel')];
      const operaciones = formularios[0];

      afirmar(formularios.length === 1, `el tema no dibuja panel de configuración (${formularios.length} formulario(s))`);
      afirmar(!!document.querySelector('.estructura-arbol'), 'el árbol existe desde que se entra al tema');
      afirmarEstructuraCentrada('árbol de búsqueda digital');

      operaciones.querySelector('[name="palabra"]').value = 'prueba';
      operaciones.querySelector('[data-accion="insertar-palabra"]').click();
      agotarTraza(120);

      const casillas = () => [...document.querySelectorAll('.arbol .casilla')];
      const letras = () => casillas()
        .map((el) => el.textContent.replace(/[^a-z]/g, ''))
        .filter(Boolean)
        .sort()
        .join('');
      const puntos = () => document.querySelectorAll('.arbol__bifurcacion').length;

      registro.push(`  árbol de «prueba»: ${letras()} · ${puntos()} bifurcaciones`);
      afirmar(letras() === 'abepru', `las seis letras quedan dibujadas (${letras()})`);
      afirmar(puntos() === 7, `los nodos de en medio se dibujan como punto (${puntos()})`);
      afirmar(
        casillas().length === 6,
        `solo las claves llevan casilla (${casillas().length} casilla(s) para 6 claves)`
      );

      // Que las claves vivan **solo en las hojas** no se ve contando: se ve en
      // que de ninguna casilla salga una arista hacia abajo. Es la diferencia
      // con el árbol digital, y la única forma de comprobarla sobre el dibujo.
      const aristas = [...document.querySelectorAll('.arbol__arista')];
      const conHijos = casillas().filter((casilla) => {
        const caja = casilla.getBoundingClientRect();
        const svg = document.querySelector('.arbol__aristas').getBoundingClientRect();
        const centroX = caja.left - svg.left + caja.width / 2;
        const pie = caja.top - svg.top + caja.height;
        return aristas.some((arista) => (
          Math.abs(Number(arista.getAttribute('x1')) - centroX) < 2
          && Math.abs(Number(arista.getAttribute('y1')) - pie) < 2
        ));
      });
      afirmar(conHijos.length === 0, `ninguna clave tiene ramas colgando (${conHijos.length} con hijos)`);
      afirmar(aristas.length === 12, `cada nodo que no es la raíz entra por una arista (${aristas.length})`);
      afirmarCasillasParejas('residuos');

      // El lienzo del árbol scrollea (`overflow: auto`), así que su rectángulo
      // siempre cae dentro del viewport aunque por dentro sobresalga: hay que
      // medir el contenido y no la caja.
      const lienzo = document.querySelector('.estructura-arbol');
      afirmar(
        lienzo.scrollWidth <= lienzo.clientWidth + 1,
        `el árbol cabe a lo ancho de su lienzo (${lienzo.scrollWidth} en ${lienzo.clientWidth})`
      );
      afirmar(
        lienzo.scrollHeight <= lienzo.clientHeight + 1,
        `el árbol cabe a lo alto de su lienzo (${lienzo.scrollHeight} en ${lienzo.clientHeight})`
      );

      const metricas = () => [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(metricas()[2] === '5', `la altura cuenta niveles (reporta ${metricas()[2]})`);

      // La lección del tema: se baja tanto como diga el código y se compara una
      // sola vez, al llegar a la hoja.
      operar(formularios, 'buscar', 'a');
      agotarTraza(20);
      registro.push(`  buscar a: ${metricas()[0]} comparación(es), ${metricas()[1]} accesos`);
      afirmar(metricas()[0] === '1', `buscar compara una sola vez (reporta ${metricas()[0]})`);
      afirmar(metricas()[1] === '5', `bajar hasta la hoja cuesta 5 accesos (reporta ${metricas()[1]})`);

      // Camino cortado: h = 01000 se sale del árbol en el bit 2, y esa posición
      // vacía sí se dibuja como casilla, porque es donde la clave iría.
      operar(formularios, 'buscar', 'h');
      agotarTraza(20);
      afirmar(
        !!aviso() && aviso().textContent.includes('no existe'),
        'el camino cortado prueba que la clave no está'
      );
      afirmar(metricas()[0] === '0', `sin hoja a la que llegar no se compara nada (reporta ${metricas()[0]})`);

      // Al eliminar, la rama se recoge: b sube y el árbol pierde un nivel.
      operar(formularios, 'eliminar', 'a');
      agotarTraza(20);
      registro.push(`  tras eliminar a: ${letras()} · ${puntos()} bifurcaciones · altura ${metricas()[2]}`);
      afirmar(letras() === 'bepru', `la clave sale del árbol (${letras()})`);
      // La altura no baja —p y r siguen en el nivel 5—, pero la rama de a y b
      // sí se recoge: b sube al sitio de su bifurcación, que desaparece.
      afirmar(puntos() === 6, `la rama se recoge y su bifurcación desaparece (${puntos()} bifurcaciones)`);
      afirmar(metricas()[2] === '5', `p y r mantienen la altura en 5 (reporta ${metricas()[2]})`);
      afirmar(
        casillas().every((el) => el.textContent.trim() !== ''),
        'no queda ningún hueco dibujado tras cerrar la eliminación'
      );

      vaciar();
      afirmar(letras() === '' && puntos() === 0, 'reiniciar deja el árbol sin claves ni bifurcaciones');

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Residuos múltiples: un bloque de bits por nivel en vez de un bit, y el
    // esqueleto dibujado completo como en el tablero. Lo que hay que ver es que
    // cada nodo abre todas sus ramas lleven a una clave o no, que los rótulos de
    // esas cuatro ramas se puedan leer, y que el mismo ejercicio baje de cinco
    // niveles a tres — que es lo que el método compra.
    function residuosMultiples() {
      registro.push('', '── Residuos múltiples ──');

      entrarATema('Árbol de búsqueda por residuos múltiples');
      const formularios = [...document.querySelectorAll('form.panel')];
      const operaciones = formularios[0];

      afirmar(formularios.length === 1, `el tema no dibuja panel de configuración (${formularios.length} formulario(s))`);

      afirmar(
        document.querySelectorAll('.arbol__bifurcacion').length === 0,
        `el tema abre con el lienzo vacío (${document.querySelectorAll('.arbol__bifurcacion').length} bifurcación(es))`
      );

      operaciones.querySelector('[name="palabra"]').value = 'prueba';
      operaciones.querySelector('[data-accion="insertar-palabra"]').click();
      agotarTraza(140);

      const casillas = () => [...document.querySelectorAll('.arbol .casilla')];
      const letras = () => casillas()
        .map((el) => el.textContent.replace(/[^a-z]/g, ''))
        .filter(Boolean)
        .sort()
        .join('');
      const puntos = () => document.querySelectorAll('.arbol__bifurcacion').length;
      const metricas = () => [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);

      registro.push(`  árbol de «prueba»: ${letras()} · ${puntos()} bifurcaciones · altura ${metricas()[2]}`);
      afirmar(letras() === 'abepru', `las seis letras quedan dibujadas (${letras()})`);
      afirmar(metricas()[2] === '4', `toda clave baja sus tres bloques y queda en el nivel 4 (altura ${metricas()[2]})`);

      // Las seis claves a la misma altura: es lo que separa este tema de
      // residuos, donde cada clave para en cuanto queda sola. Se lee el `top`
      // en línea y no el rectángulo: una casilla recién recolocada lleva encima
      // el `transform` del FLIP, que la deja en su sitio anterior hasta que la
      // animación corra, y aquí se estaría midiendo eso y no la retícula.
      const alturas = [...new Set(casillas().map((el) => el.style.top))];
      afirmar(alturas.length === 1, `las seis claves quedan a la misma altura (${alturas.join(', ')})`);

      // Esqueleto completo hasta el penúltimo nivel —1 + 4 + 16— más las seis
      // posiciones con clave del último.
      const dibujadas = casillas().length + puntos();
      afirmar(dibujadas === 27, `el esqueleto va completo hasta el nivel 3 (${dibujadas} posiciones, se esperan 27)`);
      afirmar(puntos() === 21, `del último nivel no se dibuja ni un punto vacío (${puntos()} puntos, se esperan 21)`);
      afirmar(
        document.querySelectorAll('.arbol__arista').length === 26,
        `cada posición que no es la raíz entra por una arista (${document.querySelectorAll('.arbol__arista').length})`
      );

      // Las claves siguen viviendo solo en las hojas: de ninguna casilla sale
      // una arista hacia abajo.
      const aristas = [...document.querySelectorAll('.arbol__arista')];
      const svg = document.querySelector('.arbol__aristas').getBoundingClientRect();
      const conHijos = casillas().filter((casilla) => {
        const caja = casilla.getBoundingClientRect();
        const centroX = caja.left - svg.left + caja.width / 2;
        const pie = caja.top - svg.top + caja.height;
        return aristas.some((arista) => (
          Math.abs(Number(arista.getAttribute('x1')) - centroX) < 2
          && Math.abs(Number(arista.getAttribute('y1')) - pie) < 2
        ));
      });
      afirmar(conHijos.length === 0, `ninguna clave tiene ramas colgando (${conHijos.length} con hijos)`);

      // Los rótulos son lo que dice por qué la clave tomó ese camino: cuatro
      // saliendo del mismo nodo se amontonan si no se separan a propósito.
      const rotulos = [...document.querySelectorAll('.arbol__bit')]
        .map((el) => ({ x: Number(el.getAttribute('x')), y: Number(el.getAttribute('y')), t: el.textContent }));
      const deLaRaiz = rotulos.slice().sort((a, b) => a.y - b.y).slice(0, 4)
        .map((r) => r.t).sort().join(' ');
      afirmar(deLaRaiz === '00 01 10 11', `la raíz abre sus cuatro ramas rotuladas (${deLaRaiz})`);
      const encimados = rotulos.filter((a, i) => rotulos.some((b, j) => (
        j !== i && Math.abs(a.x - b.x) < 12 && Math.abs(a.y - b.y) < 8
      )));
      afirmar(encimados.length === 0, `ningún rótulo se monta sobre otro (${encimados.length} encimado(s))`);

      const lienzo = document.querySelector('.estructura-arbol');
      afirmar(
        lienzo.scrollWidth <= lienzo.clientWidth + 1,
        `el esqueleto cabe a lo ancho de su lienzo (${lienzo.scrollWidth} en ${lienzo.clientWidth})`
      );
      afirmar(
        lienzo.scrollHeight <= lienzo.clientHeight + 1,
        `el esqueleto cabe a lo alto de su lienzo (${lienzo.scrollHeight} en ${lienzo.clientHeight})`
      );

      // Que el árbol quepa no basta: el árbol no se encoge, así que al crecer
      // empuja al panel del cálculo, y el escenario lo recorta sin avisar. Hay
      // que mirar los dos.
      const escenario = document.querySelector('.lienzo__escenario').getBoundingClientRect();
      const panelCalculo = document.querySelector('.calculo');
      afirmar(
        Math.round(panelCalculo.getBoundingClientRect().right) <= Math.round(escenario.right) + 1,
        'el cálculo no se sale del lienzo empujado por el árbol'
      );
      afirmar(
        panelCalculo.scrollWidth <= panelCalculo.clientWidth + 1,
        `el cálculo no queda recortado (${panelCalculo.scrollWidth} en ${panelCalculo.clientWidth})`
      );
      afirmarCasillasParejas('residuos múltiples');

      // La lección: leer dos bits de un golpe llega a la clave en menos accesos
      // que leerlos de uno en uno, y se sigue comparando una sola vez.
      operar(formularios, 'buscar', 'a');
      agotarTraza(20);
      registro.push(`  buscar a: ${metricas()[0]} comparación(es), ${metricas()[1]} accesos (en residuos eran 1 y 5)`);
      afirmar(metricas()[0] === '1', `buscar compara una sola vez (reporta ${metricas()[0]})`);
      afirmar(metricas()[1] === '4', `llegar a la clave cuesta 4 accesos y no 5 (reporta ${metricas()[1]})`);

      // h = 01000 se va por la rama 01 de la raíz, que está dibujada y vacía.
      operar(formularios, 'buscar', 'h');
      agotarTraza(20);
      afirmar(metricas()[0] === '0', `por una rama vacía no se compara nada (reporta ${metricas()[0]})`);

      // Al eliminar no sube nada: e se queda al final de su código aunque
      // quede sola en su rama.
      operar(formularios, 'eliminar', 'a');
      agotarTraza(20);
      operar(formularios, 'eliminar', 'b');
      hastaElUltimoPasoDelAlgoritmo();
      registro.push(`  tras eliminar a y b: ${letras()} · altura ${metricas()[2]}`);
      afirmar(letras() === 'epru', `las dos claves salen del árbol (${letras()})`);
      afirmar(metricas()[2] === '4', `las que quedan siguen al final de su código (altura ${metricas()[2]})`);
      // Aquí no sube ninguna clave a tapar el hueco, así que la posición que se
      // vació se queda marcada: es lo que hay que ver al eliminar.
      afirmar(
        !!document.querySelector('.arbol .casilla--eliminada'),
        'la posición que se vació queda marcada donde estaba la clave'
      );

      vaciar();
      afirmar(letras() === '', 'vaciar deja el árbol sin claves');

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Otras búsquedas dinámicas: la única estructura donde n cambia solo. La
    // aritmética exacta del taller ya está probada en `cubetas.test.js`, sin
    // pasar por el DOM; aquí lo que hay que ver es que el formulario acepte

    // dibuje alineada, y que reiniciar vuelva al n inicial y no al que
    // alcanzó por expansión.
    function cubetas() {
      registro.push('', '── Otras búsquedas dinámicas ──');

      entrarATema('Otras búsquedas dinámicas');
      const formularios = [...document.querySelectorAll('form.panel')];
      afirmar(

      );

      });

      for (const clave of [15, 26, 48, 79, 35, 62, 57, 81]) {

        agotarTraza(80);
      }

      afirmar(metricas()[2] === '4', `n terminó en 4 tras la expansión (reporta ${metricas()[2]})`);

      );

      );

      afirmar(
        metricas()[2] === '2',
        `vaciar vuelve al n inicial y no al que la estructura alcanzó por expansión (reporta ${metricas()[2]})`
      );

      // El momento de la colisión, tal como lo escribe el docente en el taller
      // (CLAUDE.md 5.7): con n = 3 la clave 81 no cabe en la cubeta 0 y se
      // queda esperando en la fila «Col», que es lo que hace legible el
      // D.O. = 8/9 = 88,9 % de la línea siguiente.
      enviar(formularios[0], {
        n: 2, r: 3, modoExpansion: 'parcial', umbralExpandir: 82, umbralReducir: 125
      });
      for (const clave of [115, 96, 48, 79, 35, 26, 57]) {
        operar(formularios, 'insertar', clave);
        agotarTraza(80);
      }
      afirmar(metricas()[2] === '3', `antes de chocar, la estructura va por n = 3 (reporta ${metricas()[2]})`);

      operar(formularios, 'insertar', 81);

        .filter((el) => el && el.classList.contains('casilla'));

      afirmar(
        col.length === 1 && col[0].textContent === '81',
        `la clave que chocó espera en la fila «Col» (reporta ${col.map((c) => c.textContent).join(',') || 'nada'})`
      );
      afirmar(
        [...document.querySelectorAll('.renglon__marca')].some((m) => m.textContent === 'Col'),
        'la fila lleva su rótulo «Col», como en el taller'
      );
      registro.push('  densidad con la clave esperando: ' + metricas()[3]);
      afirmar(

    // Búsqueda secuencial externa: el archivo del ejemplo del docente. Lo que
    // hay que ver por el DOM es el dibujo —la aritmética ya está probada en
    // `externa.test.js` y `secuencial-externa.test.js`—: que los bloques se
    // rotulen desde 1, que el último se dibuje corto, que insertar en medio
    // empuje el desbordamiento al bloque de al lado, y sobre todo que los
    // renglones de todos los bloques caigan a la misma altura, que es el
    // defecto de layout que las pruebas de dominio no pueden ver.
    function secuencialExterna() {
      registro.push('', '── Búsqueda secuencial externa ──');

      entrarATema('Búsqueda secuencial externa');
      const formularios = [...document.querySelectorAll('form.panel')];
      afirmar(
        formularios[0].textContent.includes('Registros del archivo (N)'),
        'el formulario pide los registros del archivo (N), no un tamaño genérico'
      );

      // N = 23 → 5 bloques de 5, el último con 3 posiciones.
      enviar(formularios[0], { n: 23, l: 4 });
      for (const clave of [1010, 1023, 1105, 1204, 1310, 2011, 2230, 3020, 3145, 3388, 4102, 4521]) {
        operar(formularios, 'insertar', clave);
      }

      const bloques = () => [...document.querySelectorAll('.bloque')];
      const rotulos = bloques().map((b) => b.querySelector('.bloque__etiqueta').textContent);
      registro.push('  bloques: ' + rotulos.join(' '));
      afirmar(rotulos.join(' ') === 'B1 B2 B3 B4 B5', 'se dibujan los 5 bloques, rotulados desde B1');

      const casillasPorBloque = bloques().map((b) => b.querySelectorAll('.casilla').length);
      afirmar(
        casillasPorBloque.join(',') === '5,5,5,5,3',
        `el último bloque se dibuja corto: 3 posiciones y no 5 (reporta ${casillasPorBloque.join(',')})`
      );

      afirmarCasillasParejas('búsqueda secuencial externa');
      afirmarRenglonesDeBloquesAlineados('archivo completo');
      afirmarEstructuraCentrada('búsqueda secuencial externa');

      // 1100 entra en el bloque 1 y empuja a 1310 al bloque 2: el
      // desbordamiento entre bloques es la animación propia de este tema.
      const claveDelRenglon = (bloque, renglon) =>
        bloques()[bloque - 1].querySelectorAll('.casilla')[renglon - 1].textContent;
      afirmar(claveDelRenglon(1, 5) === '1310', 'antes de insertar, 1310 cierra el bloque 1');
      operar(formularios, 'insertar', 1100);
      afirmar(
        claveDelRenglon(1, 5) === '1204' && claveDelRenglon(2, 1) === '1310',
        `insertar en medio empuja la última clave al bloque siguiente (B1 termina en ${claveDelRenglon(1, 5)}, B2 abre con ${claveDelRenglon(2, 1)})`
      );

      const metricas = () => [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      operar(formularios, 'buscar', 3020);
      agotarTraza(20);
      registro.push('  métricas: ' + metricas().join(' · '));
      afirmar(
        document.querySelector('.alerta').textContent.includes('Clave encontrada en el bloque 2'),
        'el aviso ubica la clave por bloque y no por número de registro'
      );
      // Dos accesos y no tres: al insertar 1100, 1310 pasó al bloque 2, así
      // que 3020 ya cae en el segundo bloque y el tercero no se llega a leer.
      afirmar(
        metricas()[1] === '2',
        `leer dos bloques cuesta dos accesos, uno por bloque (reporta ${metricas()[1]})`
      );
      afirmar(metricas()[2] === '5' && metricas()[3] === '5', 'las métricas reportan B = 5 y r = 5');

      // Archivo grande: los renglones no caben y la elisión comprime los
      // bloques ya comparados. El retoque que el usuario pidió sobre la
      // maqueta (2026-09-11) es que el último registro de un bloque comprimido
      // quede en el renglón que de verdad ocupa, no flotando.
      vaciar();
      enviar(formularios[0], { n: 150, l: 4 });
      for (let i = 0; i < 60; i++) operar(formularios, 'insertar', 1000 + 7 * i);
      operar(formularios, 'buscar', 1385);
      hastaElUltimoPasoDelAlgoritmo();

      const tramos = document.querySelectorAll('.tramo-registros').length;
      afirmar(tramos > 0, `con N = 150 los renglones se eliden (${tramos} tramo(s))`);
      afirmar(
        document.querySelectorAll('.tramo-bloques').length > 0,
        'y los bloques lejanos se juntan en un tramo en vez de dibujarse uno a uno'
      );
      afirmarRenglonesDeBloquesAlineados('archivo elidido');

      document.querySelector('.pantalla-tema__volver').click();
    }

    // La escala de renglones vive en una columna aparte, así que **ninguna
    // cuadrícula garantiza que quede alineada** con lo que rotula: hay que
    // medirla. Dos defectos reales salieron de aquí (2026-09-11): un
    // espaciador vacío arriba —sin línea que medir, alto cero— subía la
    // columna entera 16 px, un renglón completo; y un alto escrito a mano la
    // dejaba 2 px arriba, poco por renglón y visible al acumularse.
    const centroDe = (el) => {
      const r = el.getBoundingClientRect();
      return Math.round(r.top + r.height / 2);
    };

    function afirmarEscalaAlineada(contexto, marcas, referencias) {
      const dispares = marcas
        .map((marca, i) => [centroDe(marca), centroDe(referencias[i])])
        .filter(([a, b]) => Math.abs(a - b) > 1);
      afirmar(
        marcas.length > 0 && marcas.length === referencias.length && dispares.length === 0,
        `${contexto}: la escala numera a la altura de lo que rotula`
          + (dispares.length ? ` (${dispares.length} desalineada(s): ${dispares.map((p) => p.join('≠')).join(' ')})` : '')
      );
    }

    // La estructura va centrada en el lienzo, sea del tipo que sea (CLAUDE.md
    // 6.2). No lo garantiza el CSS del escenario por sí solo: el lienzo es una
    // rejilla de dos filas y, si el escenario cae en la de arriba —la que mide
    // lo que su contenido—, la estructura se pega al borde superior con medio
    // lienzo vacío debajo. Le pasaba a los árboles, que no llevan control de
    // elisión, y empezó a pasarle a cualquier tema cuya estructura cupiera
    // entera, desde que el control se esconde cuando no hay nada que elidir.
    function afirmarEstructuraCentrada(contexto) {
      const escenario = document.querySelector('.lienzo__escenario');
      const estructura = escenario && escenario.firstElementChild;
      if (!estructura) {
        afirmar(false, `${contexto}: no hay estructura que centrar`);
        return;
      }
      const centro = (el) => {
        const r = el.getBoundingClientRect();
        return Math.round(r.top + r.height / 2);
      };
      const desvio = Math.abs(centro(escenario) - centro(estructura));
      afirmar(
        desvio <= 2,
        `${contexto}: la estructura queda centrada en el lienzo (desvío de ${desvio} px)`
      );
    }

    // Los bloques son columnas independientes: que la casilla de un renglón
    // caiga a la misma altura en todos —y que el último registro de un bloque
    // comprimido coincida con el último de los completos— es lo único que hace
    // legible la matriz, y no se ve desde `node --test`.
    // Búsqueda binaria externa (CLAUDE.md 5.11). La aritmética está en
    // `binaria-externa.test.js`; aquí va lo que solo se ve en el DOM: que el
    // panel cambie de título al pasar de los bloques a los renglones, que la
    // binaria de dentro pinte su rango en la columna del bloque, y que la
    // relectura de un bloque se diga en el panel y se cuente en las métricas.
    function binariaExterna() {
      registro.push('', '── Búsqueda binaria externa ──');

      entrarATema('Búsqueda binaria externa');
      const formularios = [...document.querySelectorAll('form.panel')];
      // El archivo lleno de la maqueta: N = 23, 5 bloques, el último de 3.
      enviar(formularios[0], { n: 23, l: 2 });
      for (const clave of [10, 12, 15, 18, 20, 22, 25, 27, 30, 33, 35, 38, 40, 42, 45, 48, 50, 53, 55, 58, 60, 63, 67]) {
        operar(formularios, 'insertar', clave);
      }

      const bloques = () => [...document.querySelectorAll('.bloque')];
      const rotulo = (b) => bloques()[b - 1].querySelector('.bloque__etiqueta');
      const titulo = () => document.querySelector('.calculo__titulo').textContent;
      const panel = () => document.querySelector('.calculo').textContent;
      const metricas = () => [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      // Avanza hasta que se cumpla la condición, sin pasarse del final.
      const hastaQue = (condicion) => {
        for (let i = 0; i < 40 && !condicion(); i++) control('siguiente').click();
        return condicion();
      };

      operar(formularios, 'buscar', 50);
      afirmar(
        hastaQue(() => rotulo(4).classList.contains('bloque--en-curso')),
        'la búsqueda por bloques llega a B4'
      );
      afirmar(titulo() === 'Búsqueda por bloques', `en la fase de bloques el panel se titula «Búsqueda por bloques» (dice «${titulo()}»)`);
      afirmar(
        [1, 2, 3].every((b) => rotulo(b).classList.contains('bloque--descartado')) && !rotulo(5).classList.contains('bloque--descartado'),
        'comparando B4, B1 a B3 están descartados y B5 todavía no'
      );

      afirmar(
        hastaQue(() => titulo() === 'Dentro del bloque B4'),
        'al quedar un solo bloque el panel pasa a «Dentro del bloque B4»'
      );
      afirmar(rotulo(5).classList.contains('bloque--descartado'), 'dentro de B4, B5 ya está descartado');
      afirmar(panel().includes('ya leído'), 'B4 era el último leído: el panel dice «ya leído»');
      const estados = [...bloques()[3].querySelectorAll('.casilla')].map((c) =>
        ['en-evaluacion', 'rango-activo', 'descartada', 'encontrada'].find((e) => c.classList.contains(`casilla--${e}`)) || '·');
      registro.push('  B4, primer paso dentro: ' + estados.join(' '));
      afirmar(
        estados.join(' ') === 'rango-activo rango-activo en-evaluacion rango-activo rango-activo',
        'la binaria de dentro pinta su rango en la columna y marca el medio, el renglón 3'
      );
      control('siguiente').click();
      const estados2 = [...bloques()[3].querySelectorAll('.casilla')].map((c) =>
        ['en-evaluacion', 'rango-activo', 'descartada'].find((e) => c.classList.contains(`casilla--${e}`)) || '·');
      afirmar(
        estados2.join(' ') === 'en-evaluacion rango-activo descartada descartada descartada',
        `al estrechar, los renglones tirados se apagan dentro del bloque (${estados2.join(' ')})`
      );

      hastaElUltimoPasoDelAlgoritmo();
      afirmar(
        document.querySelector('.alerta').textContent.includes('Clave encontrada en el bloque 4'),
        'el aviso ubica la clave por bloque'
      );
      registro.push('  métricas: ' + metricas().join(' · '));
      afirmar(metricas()[0] === '5' && metricas()[1] === '2', `50 cuesta 5 comparaciones y 2 accesos (reporta ${metricas().slice(0, 2).join(', ')})`);
      afirmarCasillasParejas('búsqueda binaria externa');
      afirmarRenglonesDeBloquesAlineados('binaria externa');

      // 22: se leen B3, B2 y B1, y el rango se cierra en B2, que hay que releer.
      operar(formularios, 'buscar', 22);
      afirmar(hastaQue(() => panel().includes('se relee')), 'buscando 22, el panel avisa que B2 se relee');
      hastaElUltimoPasoDelAlgoritmo();
      afirmar(metricas()[1] === '4', `la relectura cuenta: 22 cuesta 4 accesos (reporta ${metricas()[1]})`);

      // Archivo grande: los bloques leídos por la binaria saltan, y la elisión
      // tiene que seguir alineando los renglones.
      vaciar();
      enviar(formularios[0], { n: 150, l: 4 });
      for (let i = 0; i < 150; i++) operar(formularios, 'insertar', 1000 + 7 * i);
      // 1700 está en B9. Comparando B9 el rango es B8 … B10: sus dos extremos
      // tienen que seguir a la vista aunque el resto se junte en tramos.
      operar(formularios, 'buscar', 1700);
      const rotulos = () => [...document.querySelectorAll('.bloque__etiqueta')].map((el) => el.textContent);
      afirmar(
        hastaQue(() => panel().includes('B8 … B10')),
        'con N = 150 el rango llega a B8 … B10'
      );
      afirmar(
        ['B8', 'B9', 'B10'].every((b) => rotulos().includes(b)),
        `los extremos del rango no se esconden en un tramo (se ven ${rotulos().join(' ')})`
      );
      afirmar(hastaQue(() => titulo().startsWith('Dentro del bloque')), 'y llega a buscar dentro de un bloque');
      afirmar(
        document.querySelectorAll('.tramo-bloques').length > 0,
        'y los bloques lejanos se juntan en un tramo'
      );
      afirmarRenglonesDeBloquesAlineados('binaria externa elidida');
      hastaElUltimoPasoDelAlgoritmo();
      afirmar(
        document.querySelector('.alerta').textContent.includes('Clave encontrada en el bloque'),
        'y la encuentra'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }

    function afirmarRenglonesDeBloquesAlineados(contexto) {
      const bloques = [...document.querySelectorAll('.bloque')];
      const pies = bloques.map((bloque) => {
        const casillas = [...bloque.querySelectorAll('.casilla')];
        const ultima = casillas[casillas.length - 1];
        return Math.round(ultima.getBoundingClientRect().bottom);
      });
      // El último bloque es más corto que los demás: su último registro está en
      // su propio renglón y no tiene por qué caer con los otros.
      const sinElUltimo = pies.slice(0, -1);
      afirmar(
        new Set(sinElUltimo).size === 1,
        `${contexto}: todos los bloques cierran en el mismo renglón (${[...new Set(sinElUltimo)].join(', ')})`
      );

      // Solo los bloques dibujados enteros: uno comprimido empieza por su
      // tramo, así que su primera casilla es la del último renglón y no la del
      // primero.
      const primeras = bloques
        .filter((bloque) => bloque.querySelector('.bloque__registros').firstElementChild.classList.contains('casilla'))
        .map((bloque) => Math.round(bloque.querySelector('.casilla').getBoundingClientRect().top));
      afirmar(
        new Set(primeras).size === 1,
        `${contexto}: todos los bloques empiezan a la misma altura (${[...new Set(primeras)].join(', ')})`
      );

      // La escala se dibuja con los mismos segmentos que el bloque en curso
      // —casillas y tramos—, así que se comparan uno a uno.
      const enCurso = bloques.find((b) => b.querySelector('.bloque--en-curso')) || bloques[0];
      afirmarEscalaAlineada(
        contexto,
        [...document.querySelectorAll('.escala-registros .renglon__marca')],
        [...enCurso.querySelector('.bloque__registros').children]
      );
    }


    // El control de elisión solo tiene sentido cuando hay algo comprimido que
    // mirar (2026-09-11). Se decide mirando el dibujo —¿quedó algún tramo?— y
    // no recalculando la elisión, así que la comprobación entra por donde
    // entra el estudiante: creando una estructura que quepa y otra que no.
    // El desvanecido se mide con la estructura asentada, cuando termina la
    // animación (CLAUDE.md 6.2). Esta prueba es síncrona: se terminan las
    // animaciones a mano y se avisa con un `scroll`, que es lo que la pantalla
    // escucha para volver a medir.
    function asentar(el) {
      for (const animacion of document.getAnimations()) animacion.finish();
      el.dispatchEvent(new Event('scroll'));
    }
    const ladosDesvanecidos = (el) =>
      ['izq', 'der', 'arr', 'aba'].filter((lado) => el.classList.contains(`desborda-${lado}`)).join(',') || 'ninguno';

    // Sin barras en el lienzo (pedido del usuario, 2026-09-27): se desplaza
    // igual, pero lo que dice «hay más» es el borde desvanecido del lado por
    // donde sigue la estructura, y solo ese.
    function lienzoSinBarras() {
      registro.push('', '── Lienzo sin barras ──');

      entrarATema('Búsqueda secuencial');
      const formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 24, l: 2 });
      for (const clave of [10, 18, 24, 31, 37, 42, 50, 63, 71, 84, 90, 97]) operar(formularios, 'insertar', clave);

      const fila = () => document.querySelector('.estructura-horizontal');
      asentar(fila());
      afirmar(!fila().classList.contains('desborda'), `elidida cabe: ningún borde desvanecido (${ladosDesvanecidos(fila())})`);

      const completa = document.querySelector('[data-control="mostrar-completa"]');
      completa.click();
      asentar(fila());
      registro.push(`  completa: ${fila().scrollWidth} px en ${fila().clientWidth} px`);
      afirmar(fila().scrollWidth > fila().clientWidth, 'con la estructura completa, la fila desborda');
      afirmar(
        fila().offsetHeight - fila().clientHeight === 0,
        `y no aparece barra: no le quita alto al lienzo (${fila().offsetHeight - fila().clientHeight} px)`
      );
      afirmar(ladosDesvanecidos(fila()) === 'der', `al principio se desvanece solo el borde derecho (${ladosDesvanecidos(fila())})`);

      fila().scrollLeft = fila().scrollWidth / 2 - fila().clientWidth / 2;
      asentar(fila());
      afirmar(ladosDesvanecidos(fila()) === 'izq,der', `a mitad de camino, los dos (${ladosDesvanecidos(fila())})`);

      fila().scrollLeft = fila().scrollWidth;
      asentar(fila());
      afirmar(ladosDesvanecidos(fila()) === 'izq', `al final, solo el izquierdo (${ladosDesvanecidos(fila())})`);

      completa.click();
      asentar(fila());
      afirmar(!fila().classList.contains('desborda'), `al volver a elidir, se va el desvanecido (${ladosDesvanecidos(fila())})`);

      document.querySelector('.pantalla-tema__volver').click();
    }

    function controlDeElision() {
      registro.push('', '── Control de elisión ──');

      entrarATema('Búsqueda secuencial');
      const formularios = [...document.querySelectorAll('form.panel')];
      const control = () => document.querySelector('.lienzo__control');

      enviar(formularios[0], { n: 8, l: 2 });
      for (const clave of [10, 20, 30]) operar(formularios, 'insertar', clave);
      afirmar(
        control().hidden,
        'con una estructura que cabe entera, el control no se muestra'
      );

      // Con l = 2 solo existen 90 claves distintas y n = 100 se rechaza
      // (CLAUDE.md 3.5), así que la estructura grande va con l = 3.
      enviar(formularios[0], { n: 100, l: 3 });
      for (const clave of [100, 200, 300, 400, 500]) operar(formularios, 'insertar', clave);
      afirmar(
        !control().hidden,
        'con una estructura elidida, el control aparece'
      );

      // Si el control se escondiera al desaparecer los tramos, no habría forma
      // de volver: quedaría marcado y fuera de la vista.
      document.querySelector('[data-control="mostrar-completa"]').click();
      afirmar(
        !control().hidden,
        'con "ver estructura completa" marcada el control sigue a la vista, para poder desmarcarla'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }


    // Árbol de Huffman (CLAUDE.md 5.x). Lo que solo se ve por el DOM: que el
    // lienzo dibuja un bosque y no un árbol mientras se construye, que los
    // nodos internos llevan su peso dentro, que la tabla aparece solo al final
    // y que el panel no ofrece operaciones de clave, porque en este tema no se
    // busca nada. La aritmética ya está probada en `huffman.test.js` contra el
    // ejemplo del docente.
    function arbolDeHuffman() {
      registro.push('', '── Árbol de Huffman ──');

      entrarATema('Árbol de Huffman');
      const formularios = [...document.querySelectorAll('form.panel')];
      const operaciones = formularios[0];

      afirmar(
        !operaciones.querySelector('[name="clave"]'),
        'el panel no pide clave: en este tema no se busca ni se elimina, se construye'
      );

      operaciones.querySelector('[name="palabra"]').value = 'ciencias';
      operaciones.querySelector('[data-accion="insertar-palabra"]').click();

      // Tres pasos: la lista inicial y las dos primeras uniones. El bosque
      // tiene entonces cuatro árboles —c, i, (e+n), (a+s)— y el siguiente paso
      // une las dos letras, que es la regla fina del método.
      control('siguiente').click();
      control('siguiente').click();
      control('siguiente').click();
      const arboles = document.querySelectorAll('.bosque__arbol');
      registro.push('  bosque a mitad: ' + [...arboles].map((a) => a.textContent).join(' | '));
      afirmar(arboles.length === 4, `a mitad de la construcción el bosque tiene cuatro árboles (tiene ${arboles.length})`);
      afirmar(
        document.querySelectorAll('.casilla--en-evaluacion').length === 2,
        'se marcan las dos que se van a unir'
      );
      afirmar(!document.querySelector('.tabla-codigos'), 'la tabla todavía no está: ninguna letra tiene código aún');

      agotarTraza(20);
      afirmar(
        document.querySelectorAll('.bosque__arbol').length === 1,
        'al terminar queda un solo árbol, que es el árbol final'
      );
      afirmar(
        document.querySelectorAll('.nodo-peso').length === 5,
        'los cinco nodos internos llevan su peso dentro'
      );

      afirmarEstructuraCentrada('árbol de Huffman');

      const tabla = document.querySelector('.tabla-codigos');
      afirmar(!!tabla, 'la tabla de codificación aparece al terminar');
      afirmar(
        tabla.querySelectorAll('tbody tr').length === 6,
        'la tabla trae una fila por letra distinta'
      );
      const pie = tabla.querySelector('tfoot').textContent;
      registro.push('  pie de la tabla: ' + pie.trim());
      afirmar(pie.includes('20/8') && pie.includes('2,5'), 'el pie de la tabla suma 20/8 = 2,5 bits por letra');

      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      registro.push('  métricas: ' + metricas.join(' · '));
      afirmar(metricas.join(' ') === '6 5 2,5', `las métricas reportan 6 letras, 5 reducciones y 2,5 bits (reporta ${metricas.join(' ')})`);

      // Con una sola letra distinta no hay reducción posible, y el tema lo dice
      // en vez de inventar un código vacío.
      operaciones.querySelector('[name="palabra"]').value = 'aaa';
      operaciones.querySelector('[data-accion="insertar-palabra"]').click();
      afirmar(
        document.querySelector('.alerta--error') !== null,
        'una palabra de una sola letra distinta se rechaza con un aviso'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }



    // Índices (CLAUDE.md 5.x). Lo que solo se ve entrando por el DOM: que el
    // tema **no ofrece panel de operaciones** —no hay clave que insertar—, que
    // crear la estructura arranca la derivación por sí sola, que las columnas
    // se dibujan todas desde el primer paso —las pendientes apagadas— y que
    // las flechas existen y apuntan de una columna a la siguiente. La
    // aritmética está probada contra la hoja del docente en `indices.test.js`.
    function indices() {
      registro.push('', '── Índices ──');

      entrarATema('Índices primarios, secundarios y multinivel');
      const formularios = [...document.querySelectorAll('form.panel')];
      afirmar(
        formularios.length === 1,
        `solo está el panel de configuración: en este tema no hay clave que operar (hay ${formularios.length} formularios)`
      );
      afirmar(
        !document.querySelector('[name="clave"]'),
        'el panel no pide clave: la estructura sale de los parámetros, no de inserciones'
      );
      // Guardar y abrir sí valen aquí, aunque no haya claves: lo que el archivo
      // lleva son los parámetros, y con ellos se recupera la misma estructura
      // (pedido del usuario, 2026-09-17). Lo que no hace es cruzar de tema.
      afirmar(
        !!document.querySelector('[data-accion="cargar"]') && !!document.querySelector('[data-accion="vaciar"]'),
        'ofrece cargar y vaciar desde que se entra al tema'
      );

      enviar(formularios[0], { r: 500000, B: 4096, R: 120, Ri: 15, tipo: 'primario', niveles: 'un-nivel' });

      afirmar(
        !document.querySelector('[data-accion="guardar"]').hidden,
        'y guardar aparece en cuanto hay estructura que guardar'
      );

      // Crear es la operación: la derivación tiene que estar en marcha sin que
      // nadie pulse nada más.
      afirmar(
        !document.querySelector('[data-seccion="reproduccion"]').hidden,
        'crear la estructura arranca la derivación: el reproductor aparece solo'
      );

      const columnas = () => [...document.querySelectorAll('.columna-indice')];
      afirmar(columnas().length === 2, `el índice primario de un nivel dibuja dos columnas (dibuja ${columnas().length})`);
      afirmar(
        columnas().filter((c) => c.classList.contains('columna-indice--pendiente')).length > 0,
        'en el primer paso hay columnas todavía sin calcular, y se dibujan apagadas'
      );

      agotarTraza(12);
      afirmar(
        columnas().every((c) => !c.classList.contains('columna-indice--pendiente')),
        'al terminar la derivación ninguna columna queda pendiente'
      );

      const rotulos = [...document.querySelectorAll('.columna-indice__rotulo')].map((el) => el.textContent);
      registro.push('  bloques dibujados: ' + rotulos.join(' '));
      afirmar(rotulos.includes('B54'), 'el índice llega hasta su último bloque, B54');
      afirmar(rotulos.includes('B14706'), 'el archivo llega hasta su último bloque, B14706');
      // La frontera: un bloque de índice de 273 entradas abarca 273 bloques de
      // datos, y ese bloque se dibuja con nombre propio porque es el que lo
      // enseña (CLAUDE.md 6.2).
      afirmar(rotulos.includes('B273'), 'el bloque frontera —el 273— se dibuja con nombre propio');

      const escala = [...document.querySelectorAll('.columna-indice__rango')].map((el) => el.textContent);
      registro.push('  escala: ' + escala.join(' | '));
      afirmar(
        escala.some((t) => t.includes('500.004')),
        'la escala del archivo cierra en la capacidad, 500.004, y no en los 500.000 registros'
      );

      const flechas = document.querySelectorAll('.indices__flechas path[d]');
      afirmar(flechas.length >= 3, `las columnas se unen con flechas (hay ${flechas.length})`);

      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      registro.push('  métricas: ' + metricas.join(' · '));
      afirmar(
        metricas.join(' ') === '7 54 14.706 1',
        `las métricas reportan 7 accesos, 54 bloques de índice, 14.706 de archivo y 1 nivel (reporta ${metricas.join(' ')})`
      );

      // El multinivel con secundarios es el caso ancho: cuatro columnas que no
      // caben en el lienzo, y por eso la estructura se desplaza en horizontal
      // (decisión con el usuario, 2026-09-17). Que desborde es lo correcto;
      // lo que no puede es desbordar **sin poder desplazarse**.
      enviar(formularios[0], { r: 500000, B: 4096, R: 120, Ri: 15, tipo: 'secundario', niveles: 'multinivel' });
      agotarTraza(14);
      afirmar(columnas().length === 4, `el multinivel con secundarios dibuja cuatro columnas (dibuja ${columnas().length})`);

      // Los títulos, todos a la misma línea de base. Sin esto cada uno colgaba
      // del pie de su propia columna —«Nivel 3» tiene un bloque y «Nivel 2»
      // siete— y las flechas hacia una columna corta atravesaban el título de
      // la siguiente (defecto que el usuario vio en la aplicación, 2026-09-17).
      //
      // Se mide con `offsetTop` y con la altura de la caja, no con la posición
      // en pantalla: el FLIP deja un `transform` en vuelo que falsearía un
      // `getBoundingClientRect().top`, pero no toca ni el uno ni la otra.
      const altos = columnas().map((c) => Math.round(c.getBoundingClientRect().height));
      registro.push('  alto de cada columna: ' + altos.join(' · '));
      afirmar(
        new Set(altos).size === 1,
        `las cuatro columnas miden lo mismo de alto, que es lo que alinea sus pies (miden ${altos.join(', ')})`
      );
      const pies = [...document.querySelectorAll('.columna-indice__titulo')].map((t) => t.offsetTop);
      afirmar(
        new Set(pies).size === 1,
        `los títulos de las columnas caen todos a la misma altura (caen en ${pies.join(', ')})`
      );

      // Y cada bloque, a la altura de sus números y de su rótulo. Las tres
      // columnas —escala, bloques, rótulos— llevan una celda por segmento y en
      // el mismo orden, así que basta comparar la i-ésima de cada una. Un
      // desfase de un píxel por bloque no se ve en el primero y sí en el
      // séptimo, que es como apareció (2026-09-17).
      let desfase = 0;
      for (const col of columnas()) {
        const filas = (clase) => [...col.querySelector(clase).children];
        const escalas = filas('.columna-indice__escala');
        const pilas = filas('.columna-indice__bloques');
        const marcas = filas('.columna-indice__rotulos');
        for (let i = 0; i < pilas.length; i++) {
          desfase = Math.max(
            desfase,
            Math.abs(pilas[i].offsetTop - escalas[i].offsetTop),
            Math.abs(pilas[i].offsetTop - marcas[i].offsetTop)
          );
        }
      }
      registro.push(`  desfase máximo entre bloque, escala y rótulo: ${desfase} px`);
      afirmar(
        desfase <= 1,
        `cada bloque queda a la altura de sus números y de su rótulo (se desvía ${desfase} px)`
      );

      // El tramo elidido, dentro del ancho de la columna que parte: «⋯ 14.432 ⋯»
      // se salía por los dos lados y se montaba sobre la escala y los rótulos.
      const tramos = [...document.querySelectorAll('.tramo-indices')];
      const anchoBloque = document.querySelector('.columna-indice__bloque').getBoundingClientRect().width;
      afirmar(
        tramos.length > 0 && tramos.every((t) => t.getBoundingClientRect().width <= anchoBloque + 1),
        'ningún tramo elidido se sale del ancho de su bloque'
      );

      const caja = document.querySelector('.estructura-indices');
      registro.push(`  ancho: contenido ${caja.scrollWidth} px en un lienzo de ${caja.clientWidth} px`);
      afirmar(
        caja.scrollWidth <= caja.clientWidth || getComputedStyle(caja).overflowX !== 'visible',
        'si las cuatro columnas no caben, la estructura se puede desplazar en horizontal'
      );
      // Sin barra desde el 2026-09-27: lo que avisa que hay más columnas es el
      // borde desvanecido.
      asentar(caja);
      afirmar(caja.offsetHeight - caja.clientHeight === 0, 'las columnas de índices no llevan barra');
      if (caja.scrollWidth > caja.clientWidth) {
        afirmar(
          caja.classList.contains('desborda') && /izq|der/.test(ladosDesvanecidos(caja)),
          `y el borde por donde siguen las columnas se desvanece (${ladosDesvanecidos(caja)})`
        );
      }

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Guardar y abrir (CLAUDE.md 10). Lo que se comprueba aquí es el cableado
    // de la pantalla: que los botones estén donde tienen que estar y aparezcan
    // cuando corresponde. La serialización es cálculo puro y vive en
    // `archivo.test.js`; abrir un archivo de verdad es asíncrono y no cabe en
    // esta prueba, que es síncrona — se fotografía con `vista=abrir-archivo`.
    function archivos() {
      registro.push('', '── Guardar y abrir ──');

      entrarATema('Búsqueda secuencial');
      const boton = (accion) => document.querySelector(`[data-accion="${accion}"]`);
      afirmar(!!boton('cargar'), 'el botón de cargar está desde que se entra al tema');
      afirmar(
        boton('guardar') && boton('guardar').hidden,
        'guardar no se ofrece mientras no hay estructura'
      );
      afirmar(
        !!document.querySelector('input[type="file"]'),
        'hay un selector de archivo, que es lo que abre el explorador del sistema'
      );

      const formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 12, l: 2 });
      afirmar(!boton('guardar').hidden, 'con estructura, guardar aparece');

      // El nombre propuesto dice de qué es el archivo sin abrirlo.
      const nombre = CC2.persistencia.archivo.nombreSugerido({
        tema: 'secuencial', estructura: { n: 12, l: 2 }
      });
      registro.push('  nombre sugerido: ' + nombre);
      afirmar(nombre === 'secuencial-n12-l2.cc2', `el nombre propuesto describe la estructura (${nombre})`);

      // Desde `file://` el diálogo de "Guardar como" no existe y se cae a la
      // descarga; servida por http:// sí puede existir. La aplicación no elige
      // de antemano: lo detecta.
      registro.push('  diálogo de guardado disponible: ' + CC2.persistencia.archivo.hayDialogoDeGuardado());

      document.querySelector('.pantalla-tema__volver').click();
    }

    // El deslizador crece hacia la derecha porque se llama «Velocidad»: a la
    // derecha va más rápido (pedido del usuario, 2026-08-30). Lo que el
    // reproductor consume es lo contrario —el tiempo entre pasos—, así que la
    // conversión se comprueba por los dos extremos: si alguien la olvidara, el
    // deslizador seguiría moviéndose y la traza iría al revés de lo que dice.
    function controlDeVelocidad() {
      registro.push('', '── Control de velocidad ──');

      entrarATema('Búsqueda secuencial');

      const formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 16, l: 2 });
      for (const clave of [10, 20, 30]) operar(formularios, 'insertar', clave);
      operar(formularios, 'buscar', 30);

      const deslizador = document.querySelector('[data-control="velocidad"]');
      const lectura = document.querySelector('[data-salida="velocidad"]');
      afirmar(!!deslizador && !!lectura, 'el deslizador viene con su lectura en segundos al lado');

      const leerEn = (valor) => {
        deslizador.value = String(valor);
        deslizador.dispatchEvent(new Event('input', { bubbles: true }));
        return lectura.textContent.trim();
      };

      const izquierda = leerEn(deslizador.min);
      const derecha = leerEn(deslizador.max);
      registro.push(`  izquierda: ${izquierda} · derecha: ${derecha}`);
      afirmar(izquierda === '4,0 s', `el extremo izquierdo es el más lento (dice ${izquierda})`);
      afirmar(derecha === '0,2 s', `el extremo derecho es el más rápido (dice ${derecha})`);

      // El punto medio del recorrido tiene que caer en el medio del tiempo:
      // si la conversión dejara de ser un espejo, los extremos podrían seguir
      // bien y el centro no.
      const medio = leerEn((Number(deslizador.min) + Number(deslizador.max)) / 2);
      afirmar(medio === '2,1 s', `la mitad del recorrido es la mitad del tiempo (dice ${medio})`);

      document.querySelector('.pantalla-tema__volver').click();
    }
  </script>
</body>
</html>

      afirmar(arboles.length === 4, `a mitad de la construcción el bosque tiene cuatro árboles (tiene ${arboles.length})`);
      afirmar(
        document.querySelectorAll('.casilla--en-evaluacion').length === 2,
        'se marcan las dos que se van a unir'
      );
      afirmar(!document.querySelector('.tabla-codigos'), 'la tabla todavía no está: ninguna letra tiene código aún');
      // Las reducciones se cuentan a medida que se hacen, como en el panel
      // del cálculo, y no el total desde el principio (2026-10-14).
      const reduccionesAhora = document.querySelectorAll('.metrica__valor')[1].textContent;
      const enElPanel = [...document.querySelectorAll('.calculo__linea')]
        .filter((linea) => linea.textContent.trim().startsWith('Reducción')).length;
      afirmar(
        enElPanel < 5 && reduccionesAhora === String(enElPanel),
        `a media construcción la métrica cuenta las reducciones del panel (métrica ${reduccionesAhora}, panel ${enElPanel})`
      );

      // Ir y volver por la traza no reescribe la historia: cada paso se
      // apunta una vez, la primera que se llega a él (2026-09-30: al
      // retroceder se repetía el mensaje).
      const filasBitacora = () => document.querySelectorAll('.bitacora__fila').length;
      const apuntadas = filasBitacora();
      control('anterior').click();
      control('anterior').click();
      const alRetroceder = filasBitacora();
      control('siguiente').click();
      control('siguiente').click();
      afirmar(
        alRetroceder === apuntadas && filasBitacora() === apuntadas,
        `retroceder y volver a avanzar no repite mensajes en la bitácora (${apuntadas} → ${alRetroceder} → ${filasBitacora()})`
      );
      control('siguiente').click();
      afirmar(filasBitacora() === apuntadas + 1, 'un paso nuevo sí se apunta');

      agotarTraza(20);
      afirmar(
        document.querySelectorAll('.bosque__arbol').length === 1,
        'al terminar queda un solo árbol, que es el árbol final'
      );

      // Guardar lleva la palabra (2026-10-01: el archivo salía con las claves
      // vacías, porque el bosque no toca `estructura.claves`). Se intercepta
      // la descarga para leer lo que se habría escrito.
      const archivo = window.CC2.persistencia.archivo;
      const guardarDeVerdad = archivo.guardar;
      let guardado = null;
      archivo.guardar = ({ datos, nombre }) => {
        guardado = { datos, nombre };
        return Promise.resolve({ exito: false });
      };
      control('guardar').click();
      archivo.guardar = guardarDeVerdad;
      afirmar(
        !!guardado && guardado.datos.claves.join('') === 'ciencias' && guardado.datos.tipoClave === 'alfabetica'
          && guardado.nombre === 'huffman-ciencias.cc2',
        `guardar el árbol guarda su palabra (${guardado ? `${guardado.nombre}: ${guardado.datos.claves.join('')}` : 'nada'})`
      );
      afirmar(
        document.querySelectorAll('.nodo-peso').length === 5,
        'los cinco nodos internos llevan su peso dentro'
      );

      afirmarEstructuraCentrada('árbol de Huffman');

      const tabla = document.querySelector('.tabla-codigos');
      afirmar(!!tabla, 'la tabla de codificación aparece al terminar');
      afirmar(
        tabla.querySelectorAll('tbody tr').length === 6,
        'la tabla trae una fila por letra distinta'
      );
      const pie = tabla.querySelector('tfoot').textContent;
      registro.push('  pie de la tabla: ' + pie.trim());
      afirmar(pie.includes('20/8') && pie.includes('2,5'), 'el pie de la tabla suma 20/8 = 2,5 bits por letra');

      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      registro.push('  métricas: ' + metricas.join(' · '));
      afirmar(metricas.join(' ') === '6 5 2,5', `las métricas reportan 6 letras, 5 reducciones y 2,5 bits (reporta ${metricas.join(' ')})`);

      // Con una sola letra distinta no hay reducción posible, y el tema lo dice
      // en vez de inventar un código vacío.
      operaciones.querySelector('[name="palabra"]').value = 'aaa';
      operaciones.querySelector('[data-accion="insertar-palabra"]').click();
      afirmar(
        document.querySelector('.alerta--error') !== null,
        'una palabra de una sola letra distinta se rechaza con un aviso'
      );

      document.querySelector('.pantalla-tema__volver').click();
    }



    // Índices (CLAUDE.md 5.x). Lo que solo se ve entrando por el DOM: que el
    // tema **no ofrece panel de operaciones** —no hay clave que insertar—, que
    // crear la estructura arranca la derivación por sí sola, que las columnas
    // se dibujan todas desde el primer paso —las pendientes apagadas— y que
    // las flechas existen y apuntan de una columna a la siguiente. La
    // aritmética está probada contra la hoja del docente en `indices.test.js`.
    function indices() {
      registro.push('', '── Índices ──');

      entrarATema('Índices primarios, secundarios y multinivel');
      const formularios = [...document.querySelectorAll('form.panel')];
      afirmar(
        formularios.length === 1,
        `solo está el panel de configuración: en este tema no hay clave que operar (hay ${formularios.length} formularios)`
      );
      afirmar(
        !document.querySelector('[name="clave"]'),
        'el panel no pide clave: la estructura sale de los parámetros, no de inserciones'
      );
      // Guardar y abrir sí valen aquí, aunque no haya claves: lo que el archivo
      // lleva son los parámetros, y con ellos se recupera la misma estructura
      // (pedido del usuario, 2026-09-17). Lo que no hace es cruzar de tema.
      // Se mide lo que se ve y no el atributo: con `hidden` puesto, el
      // `display` de `.boton` los seguía dibujando (2026-09-30), y una
      // comprobación que miraba el atributo pasaba sin verlo.
      const seVe = (accion) => {
        const el = document.querySelector(`[data-accion="${accion}"]`);
        return !!el && el.getClientRects().length > 0;
      };
      afirmar(
        seVe('cargar') && !seVe('guardar') && !seVe('vaciar') && !seVe('cancelar-configuracion'),
        'al entrar ofrece cargar, y todavía no guardar, vaciar ni cancelar: no hay estructura'
      );

      enviar(formularios[0], { r: 500000, B: 4096, R: 120, Ri: 15, tipo: 'primario', niveles: 'un-nivel' });

      afirmar(
        seVe('guardar') && seVe('vaciar'),
        'guardar y vaciar aparecen en cuanto hay estructura'
      );
      // Construida, la configuración se pliega como en los demás temas, con
      // su resumen en la cabecera de la reproducción (2026-10-14).
      afirmar(
        formularios[0].hidden && seVe('editar-configuracion'),
        'al construir, la configuración se pliega y queda el enlace «Editar»'
      );

      // Crear es la operación: la derivación tiene que estar en marcha sin que
      // nadie pulse nada más.
      afirmar(
        !document.querySelector('[data-accion="siguiente"]').disabled,
        'crear la estructura arranca la derivación: el reproductor se enciende solo'
      );

      const columnas = () => [...document.querySelectorAll('.columna-indice')];
      afirmar(columnas().length === 2, `el índice primario de un nivel dibuja dos columnas (dibuja ${columnas().length})`);
      afirmar(
        columnas().filter((c) => c.classList.contains('columna-indice--pendiente')).length > 0,
        'en el primer paso hay columnas todavía sin calcular, y se dibujan apagadas'
      );

      agotarTraza(12);
      afirmar(
        columnas().every((c) => !c.classList.contains('columna-indice--pendiente')),
        'al terminar la derivación ninguna columna queda pendiente'
      );

      // El rótulo va dentro de su bloque (2026-09-27).
      const rotulos = [...document.querySelectorAll('.columna-indice__bloque')].map((el) => el.textContent);
      registro.push('  bloques dibujados: ' + rotulos.join(' '));
      afirmar(rotulos.includes('B54'), 'el índice llega hasta su último bloque, B54');
      afirmar(rotulos.includes('B14706'), 'el archivo llega hasta su último bloque, B14706');
      // La frontera: un bloque de índice de 273 entradas abarca 273 bloques de
      // datos, y ese bloque se dibuja con nombre propio porque es el que lo
      // enseña (CLAUDE.md 6.2).
      afirmar(rotulos.includes('B273'), 'el bloque frontera —el 273— se dibuja con nombre propio');

      const escala = [...document.querySelectorAll('.columna-indice__rango')].map((el) => el.textContent);
      registro.push('  escala: ' + escala.join(' | '));
      afirmar(
        escala.some((t) => t.includes('500.004')),
        'la escala del archivo cierra en la capacidad, 500.004, y no en los 500.000 registros'
      );

      const flechas = [...document.querySelectorAll('.indices__flechas path[d]')]
        .filter((p) => p.getAttribute('marker-end'));
      afirmar(flechas.length >= 3, `las columnas se unen con flechas (hay ${flechas.length})`);

      // Que se vea dónde conecta cada una (2026-09-27): sale de un punto en su
      // entrada y llega con la punta tocando el borde izquierdo de un bloque,
      // a media altura, que es el hueco entre sus dos números.
      afirmar(
        document.querySelectorAll('.indices__flechas circle').length === flechas.length,
        'cada flecha sale de un punto en su entrada'
      );
      for (const animacion of document.getAnimations()) animacion.finish();
      const pista = document.querySelector('.indices__pista').getBoundingClientRect();
      const bloquesDibujados = [...document.querySelectorAll('.columna-indice__bloque')].map((b) => {
        const r = b.getBoundingClientRect();
        return { izq: r.left - pista.left, centro: r.top - pista.top + r.height / 2 };
      });
      const sinBloque = flechas.filter((p) => {
        const [x, y] = p.getAttribute('d').trim().split(/\s+/).slice(-2).map(Number);
        return !bloquesDibujados.some((b) => Math.abs(b.izq - x) <= 1 && Math.abs(b.centro - y) <= 1);
      });
      afirmar(sinBloque.length === 0, `cada punta toca el borde de un bloque, por su medio (${sinBloque.length} sueltas)`);

      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      registro.push('  métricas: ' + metricas.join(' · '));
      afirmar(
        metricas.join(' ') === '7 54 14.706 1',
        `las métricas reportan 7 accesos, 54 bloques de índice, 14.706 de archivo y 1 nivel (reporta ${metricas.join(' ')})`
      );

      // El multinivel con secundarios es el caso ancho: cuatro columnas que no
      // caben en el lienzo, y por eso la estructura se desplaza en horizontal
      // (decisión con el usuario, 2026-09-17). Que desborde es lo correcto;
      // lo que no puede es desbordar **sin poder desplazarse**.
      enviar(formularios[0], { r: 500000, B: 4096, R: 120, Ri: 15, tipo: 'secundario', niveles: 'multinivel' });
      agotarTraza(14);
      afirmar(columnas().length === 4, `el multinivel con secundarios dibuja cuatro columnas (dibuja ${columnas().length})`);
      // La derivación no se encoge por debajo de sus fórmulas: si no cabe con
      // la estructura, se angosta a 300 px y la estructura se desplaza
      // (2026-09-30). Antes se quedaba en lo que sobrara y partía las
      // fórmulas a media expresión.
      const derivacion = document.querySelector('.calculo');
      registro.push(`  derivación: ${derivacion.offsetWidth} px${document.querySelector('.lienzo__escenario--apretado') ? ' (angosta)' : ''}`);
      afirmar(derivacion.offsetWidth >= 300, `la derivación no baja de 300 px (mide ${derivacion.offsetWidth})`);
      afirmarFlechasDeIndicesPegadas('multinivel con secundarios');
      // El último bloque de cada columna se parte en la última entrada que se
      // usa, como en la hoja del docente (2026-09-30): 7, 1.832, 500.000 y
      // 500.000, con la franja de las libres debajo.
      const usadas = [...document.querySelectorAll('.columna-indice__usadas')].map((el) => el.textContent);
      registro.push('  línea de las usadas: ' + usadas.join(' · '));
      afirmar(
        usadas.join(' ') === '7 1.832 500.000 500.000',
        `cada último bloque marca su última entrada usada (marca ${usadas.join(', ')})`
      );
      afirmar(
        document.querySelectorAll('.columna-indice__libres').length === 4,
        'y debajo, la franja de las libres en las cuatro columnas'
      );

      // Los títulos, todos a la misma línea de base. Sin esto cada uno colgaba
      // del pie de su propia columna —«Nivel 3» tiene un bloque y «Nivel 2»
      // siete— y las flechas hacia una columna corta atravesaban el título de
      // la siguiente (defecto que el usuario vio en la aplicación, 2026-09-17).
      //
      // Se mide con `offsetTop` y con la altura de la caja, no con la posición
      // en pantalla: el FLIP deja un `transform` en vuelo que falsearía un
      // `getBoundingClientRect().top`, pero no toca ni el uno ni la otra.
      const altos = columnas().map((c) => Math.round(c.getBoundingClientRect().height));
      registro.push('  alto de cada columna: ' + altos.join(' · '));
      afirmar(
        new Set(altos).size === 1,
        `las cuatro columnas miden lo mismo de alto, que es lo que alinea sus pies (miden ${altos.join(', ')})`
      );
      const pies = [...document.querySelectorAll('.columna-indice__titulo')].map((t) => t.offsetTop);
      afirmar(
        new Set(pies).size === 1,
        `los títulos de las columnas caen todos a la misma altura (caen en ${pies.join(', ')})`
      );

      // Y cada bloque, a la altura de sus números. La escala y la pila llevan
      // una celda por segmento y en el mismo orden, así que basta comparar la
      // i-ésima de cada una. Un desfase de un píxel por bloque no se ve en el
      // primero y sí en el séptimo, que es como apareció (2026-09-17).
      let desfase = 0;
      for (const col of columnas()) {
        const filas = (clase) => [...col.querySelector(clase).children];
        const escalas = filas('.columna-indice__escala');
        const pilas = filas('.columna-indice__bloques');
        for (let i = 0; i < pilas.length; i++) {
          desfase = Math.max(desfase, Math.abs(pilas[i].offsetTop - escalas[i].offsetTop));
        }
      }
      registro.push(`  desfase máximo entre bloque y escala: ${desfase} px`);
      afirmar(
        desfase <= 1,
        `cada bloque queda a la altura de sus números (se desvía ${desfase} px)`
      );

      // Cada flecha sale a la altura del número de su entrada. La de la última
      // entrada usada salía del borde del bloque, 7 px por debajo de su número
      // en negrita, y parecía salir de la línea o de las libres (visto por el
      // usuario, 2026-10-11).
      for (const animacion of document.getAnimations()) animacion.finish();
      const centroVertical = (el) => {
        const r = el.getBoundingClientRect();
        return r.top + r.height / 2;
      };
      const numeros = [...document.querySelectorAll('.columna-indice__rango span')].map(centroVertical);
      const salidas = [...document.querySelectorAll('.estructura-indices svg circle')].map(centroVertical);
      const sueltas = salidas.filter((y) => !numeros.some((n) => Math.abs(n - y) <= 2));
      afirmar(
        salidas.length > 0 && sueltas.length === 0,
        `cada flecha sale a la altura del número de su entrada (${salidas.length} salida(s), ${sueltas.length} desalineada(s))`
      );

      // El tramo elidido, dentro del ancho de la columna que parte: «⋯ 14.432 ⋯»
      // se salía por los dos lados y se montaba sobre la escala y los rótulos.
      const tramos = [...document.querySelectorAll('.tramo-indices')];
      const anchoBloque = document.querySelector('.columna-indice__bloque').getBoundingClientRect().width;
      afirmar(
        tramos.length > 0 && tramos.every((t) => t.getBoundingClientRect().width <= anchoBloque + 1),
        'ningún tramo elidido se sale del ancho de su bloque'
      );

      const caja = document.querySelector('.estructura-indices');
      registro.push(`  ancho: contenido ${caja.scrollWidth} px en un lienzo de ${caja.clientWidth} px`);
      afirmar(
        caja.scrollWidth <= caja.clientWidth || getComputedStyle(caja).overflowX !== 'visible',
        'si las cuatro columnas no caben, la estructura se puede desplazar en horizontal'
      );
      // Sin barra desde el 2026-09-27: lo que avisa que hay más columnas es el
      // borde desvanecido.
      asentar(caja);
      afirmar(caja.offsetHeight - caja.clientHeight === 0, 'las columnas de índices no llevan barra');
      if (caja.scrollWidth > caja.clientWidth) {
        afirmar(
          caja.classList.contains('desborda') && /izq|der/.test(ladosDesvanecidos(caja)),
          `y el borde por donde siguen las columnas se desvanece (${ladosDesvanecidos(caja)})`
        );
      }

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Guardar y abrir (CLAUDE.md 10). Lo que se comprueba aquí es el cableado
    // de la pantalla: que los botones estén donde tienen que estar y aparezcan
    // cuando corresponde. La serialización es cálculo puro y vive en
    // `archivo.test.js`; abrir un archivo de verdad es asíncrono y no cabe en
    // esta prueba, que es síncrona — se fotografía con `vista=abrir-archivo`.
    function archivos() {
      registro.push('', '── Guardar y abrir ──');

      entrarATema('Búsqueda secuencial');
      const boton = (accion) => document.querySelector(`[data-accion="${accion}"]`);
      afirmar(!!boton('cargar'), 'el botón de cargar está desde que se entra al tema');
      afirmar(
        boton('guardar') && boton('guardar').hidden,
        'guardar no se ofrece mientras no hay estructura'
      );
      afirmar(
        !!document.querySelector('input[type="file"]'),
        'hay un selector de archivo, que es lo que abre el explorador del sistema'
      );

      const formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 12, l: 2 });
      afirmar(!boton('guardar').hidden, 'con estructura, guardar aparece');

      // El nombre propuesto dice de qué es el archivo sin abrirlo.
      const nombre = CC2.persistencia.archivo.nombreSugerido({
        tema: 'secuencial', estructura: { n: 12, l: 2 }
      });
      registro.push('  nombre sugerido: ' + nombre);
      afirmar(nombre === 'secuencial-n12-l2.cc2', `el nombre propuesto describe la estructura (${nombre})`);

      // Desde `file://` el diálogo de "Guardar como" no existe y se cae a la
      // descarga; servida por http:// sí puede existir. La aplicación no elige
      // de antemano: lo detecta.
      registro.push('  diálogo de guardado disponible: ' + CC2.persistencia.archivo.hayDialogoDeGuardado());

      document.querySelector('.pantalla-tema__volver').click();
    }

    // Caminos mínimos — Floyd (CLAUDE.md 5.12): el grafo se escribe, se ve
    // antes de crearlo, y la traza va un paso por pareja (j, i) con las
    // matrices de la hoja del docente; al final, los conceptos de la figura 12.
    function floyd() {
      registro.push('', '── Floyd ──');
      entrarATema('Caminos mínimos — Floyd');
      const formulario = document.querySelector('form.panel');
      const escribir = (tipo, aristas) => {
        formulario.querySelector('[name="tipo"]').value = tipo;
        const campo = formulario.querySelector('[name="aristas"]');
        campo.value = aristas;
        campo.dispatchEvent(new Event('input', { bubbles: true }));
      };
      const crear = () => formulario.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      const verticesDibujados = () => document.querySelectorAll('.grafo .grafo__vertice').length;

      afirmar(!!formulario.querySelector('textarea[name="aristas"]'), 'las aristas se escriben en un campo de varios renglones');
      escribir('dirigido', '1 2\n2 3\n3 1\n3 4');
      afirmar(verticesDibujados() === 4 && !document.querySelector('.matriz-grafo'),
        `el grafo se ve mientras se escribe, sin matriz todavía (${verticesDibujados()} vértices)`);

      escribir('dirigido', '1 2\n2 2');
      crear();
      afirmar(!!aviso() && aviso().textContent.includes('lazo') && !document.querySelector('.matriz-grafo'),
        `un lazo no se acepta y dice en qué renglón (${aviso() ? aviso().textContent.trim() : 'sin aviso'})`);

      escribir('dirigido', '1 2\n2 3\n3 1\n3 4');
      crear();
      afirmar(!!document.querySelector('.matriz-grafo'), 'crear el grafo arranca Floyd con su matriz');
      for (let i = 0; i < 3; i++) control('siguiente').click();
      for (const animacion of document.getAnimations()) animacion.finish();
      const celda = (fila, columna) => document.querySelectorAll('.matriz-grafo tr')[fila].querySelectorAll('td')[columna - 1];
      afirmar(
        celda(3, 2).classList.contains('matriz-grafo__celda--cambio') && celda(3, 2).textContent.endsWith('2'),
        `j = 1, i = 3: D32 cambia a 2, en verde y con el ∞ tachado encima (${celda(3, 2).className}: ${celda(3, 2).textContent})`
      );
      const activas = document.querySelectorAll('.calculo .calculo__linea--activa');
      afirmar(activas.length === 1 && activas[0].textContent.includes('sí → 2'),
        `el panel marca la comparación que se cumple, y solo esa (${activas.length})`);
      const vertice = (n) => document.querySelector(`.grafo__vertice[data-vertice="${n}"]`);
      afirmar(vertice(1).classList.contains('grafo__vertice--evaluacion') && vertice(3).classList.contains('grafo__vertice--rango'),
        'en el grafo, el intermedio j en naranja y la fila i en azul');
      afirmarGrafoCabe('paso de Floyd');

      agotarTraza(20);
      afirmar(!!aviso() && aviso().textContent.includes('∞'),
        `en la hoja desde 4 no se llega a nadie: no hay conceptos, y lo dice (${aviso() ? aviso().textContent.trim() : 'sin aviso'})`);
      afirmar(!document.querySelector('.matriz-grafo__concepto'), 'sin conceptos no hay columnas de conceptos');

      // La figura 12, no dirigida y con pesos: llega a los conceptos.
      control('editar-configuracion').click();
      escribir('no-dirigido', '4 2 2\n4 3 8\n4 5 1\n2 3 10\n3 5 2\n3 1 4\n2 1 5');
      formulario.querySelector('[name="tipo"]').dispatchEvent(new Event('change', { bubbles: true }));
      crear();
      agotarTraza(40);
      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      const rotulos = [...document.querySelectorAll('.metrica__etiqueta')].map((el) => el.textContent);
      afirmar(metricas.join(' ') === '5 7 {2, 3} {5}' && rotulos.join(' ') === 'Radio Diámetro Centro Mediana',
        `figura 12: radio 5, diámetro 7, centro {2, 3}, mediana {5} (${rotulos.join(' ')}: ${metricas.join(' ')})`);
      const distancias = [...document.querySelectorAll('.matriz-grafo tr')].slice(1)
        .map((tr) => tr.querySelectorAll('.matriz-grafo__concepto')[0].textContent);
      afirmar(distancias.join(' ') === '22 15 14 13 12', `la columna de distancias suma cada fila (${distancias.join(' ')})`);
      afirmarGrafoCabe('conceptos');
      document.querySelector('.pantalla-tema__volver').click();
    }

    // Representación matricial (CLAUDE.md 5.13): la matriz y su estructura
    // de adyacencia se llenan una fila por paso, con los valores de las
    // tablas del docente.
    function representacionMatricial() {
      registro.push('', '── Representación matricial ──');
      entrarATema('Representación matricial');
      const formulario = document.querySelector('form.panel');
      const crear = (valores) => {
        for (const [nombre, valor] of Object.entries(valores)) {
          const campo = formulario.querySelector(`[name="${nombre}"]`);
          campo.value = valor;
          campo.dispatchEvent(new Event('change', { bubbles: true }));
        }
        formulario.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      };
      const fila = (n) => [...document.querySelectorAll('.matriz-grafo tr')[n].querySelectorAll('td')].map((td) => td.textContent);

      crear({ tipo: 'no-dirigido', representacion: 'incidencia', caso: '1', aristas: '1 2\n1 3\n2 3\n3 4\n2 4\n2 5\n4 5\n1 4' });
      const cabeceras = [...document.querySelectorAll('.matriz-grafo tr')[0].querySelectorAll('th')].map((th) => th.textContent).join('');
      afirmar(cabeceras === 'abcdefgh', `las columnas son las aristas, nombradas en el orden escrito (${cabeceras})`);
      afirmar([...document.querySelectorAll('.grafo__nombre')].length === 8, 'el grafo lleva el nombre de cada arista');
      for (let i = 0; i < 2; i++) control('siguiente').click();
      afirmar(fila(2).join(' ') === '1 0 1 0 1 1 0 0' && fila(3).every((v) => v === ''),
        `fila del vértice 2 llena, las siguientes sin llenar (${fila(2).join(' ')})`);
      const enCurso = document.querySelectorAll('.adyacencia-grafo__fila--actual .adyacencia-grafo__caja');
      afirmar([...enCurso].map((el) => el.textContent).join(' ') === 'a c e f',
        `la estructura de adyacencia llena la misma fila (${[...enCurso].map((el) => el.textContent).join(' ')})`);
      afirmar(document.querySelector('.grafo__vertice[data-vertice="2"]').classList.contains('grafo__vertice--rango'),
        'en el grafo, el vértice de la fila en azul');
      afirmarGrafoCabe('representación, una fila');
      agotarTraza(10);
      afirmar(!!aviso() && aviso().textContent.includes('suma de los grados es 16'),
        `al terminar, la propiedad de la matriz (${aviso() ? aviso().textContent.trim() : 'sin aviso'})`);

      control('editar-configuracion').click();
      crear({ tipo: 'dirigido', representacion: 'adyacencia-aristas', caso: '2', aristas: 'a 1 2\nb 2 5\nc 5 4\nd 2 4\ne 3 4\nf 3 1' });
      agotarTraza(10);
      afirmar(fila(4).join(' ') === '1 −1 −1 0 −1 0',
        `adyacencia de aristas, caso 2: la fila de d como la tabla del docente (${fila(4).join(' ')})`);
      afirmarGrafoCabe('representación, completa');
      document.querySelector('.pantalla-tema__volver').click();
    }

    // Coloreado (CLAUDE.md 5.14): en orden, el primer color libre de R, N, A,
    // V, con el grafo de la hoja 1 de los apuntes; y el polinomio cromático.
    function coloreadoDeGrafos() {
      registro.push('', '── Coloreado ──');
      entrarATema('Coloreado y particionamiento');
      const formulario = document.querySelector('form.panel');
      afirmar(!formulario.querySelector('[name="tipo"]'), 'no pide si el grafo es dirigido: el coloreado no depende de la dirección');
      const crear = (modo) => {
        formulario.querySelector('[name="modo"]').value = modo;
        formulario.querySelector('[name="lambda"]').value = '3';
        formulario.querySelector('[name="aristas"]').value = 'a 1 3\nb 1 2\nc 2 3\nd 2 4\ne 3 4';
        formulario.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      };
      const colorDe = (v) => {
        const g = document.querySelector(`.grafo__vertice[data-vertice="${v}"]`);
        const clase = [...g.classList].find((c) => c.startsWith('grafo__color--'));
        return clase ? clase.slice(-1) : '';
      };

      crear('vertices');
      afirmar([...document.querySelectorAll('.grafo__arista')].every((arista) => !arista.getAttribute('marker-end')),
        'el grafo se dibuja sin flechas');
      for (let i = 0; i < 3; i++) control('siguiente').click();
      afirmar([1, 2, 3, 4].map(colorDe).join('') === 'RNA',
        `vértice 3: 1 R, 2 N, 3 A, y el 4 todavía sin color (${[1, 2, 3, 4].map(colorDe).join(' ')})`);
      afirmar(document.querySelector('.grafo__vertice[data-vertice="3"]').classList.contains('grafo__vertice--actual'),
        'el vértice del paso lleva su anillo');
      afirmarGrafoCabe('coloreado, un vértice');
      agotarTraza(10);
      afirmar([1, 2, 3, 4].map(colorDe).join('') === 'RNAR', `al terminar, R N A R como la hoja 1 (${[1, 2, 3, 4].map(colorDe).join(' ')})`);
      afirmar(!!aviso() && aviso().textContent.includes('χ(G) = 3'), `y dice χ(G) = 3 (${aviso() ? aviso().textContent.trim() : 'sin aviso'})`);

      control('editar-configuracion').click();
      crear('aristas');
      agotarTraza(10);
      afirmar(!!aviso() && aviso().textContent.includes('χ′(G) = 3'), `aristas: χ′(G) = 3 (${aviso() ? aviso().textContent.trim() : 'sin aviso'})`);
      afirmar(document.querySelectorAll('.grafo__arista--color').length === 5, 'las cinco aristas quedan pintadas');

      control('editar-configuracion').click();
      crear('polinomio');
      agotarTraza(10);
      const metricas = [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      afirmar(metricas.slice(2).join(' ') === '3 6', `polinomio: χ(G) = 3 y P(3) = 6 (${metricas.join(' ')})`);
      const formula = document.querySelector('.coloreo-formula');
      afirmar(!!formula && formula.textContent.includes('λ(λ−1)(λ−2)²'), `la fórmula factorizada (${formula ? formula.textContent : 'nada'})`);
      afirmarGrafoCabe('polinomio');
      document.querySelector('.pantalla-tema__volver').click();
    }

    // Operaciones entre grafos (CLAUDE.md 5.15): el camino 1–2–3 y la arista
    // a–b de las maquetas, y uno de 4 × 4 con letras en G₁ y números en G₂,
    // que es el resultado más grande que se puede pedir.
    function operacionesEntreGrafos() {
      registro.push('', '── Operaciones entre grafos ──');
      entrarATema('Operaciones entre grafos');
      const formulario = document.querySelector('form.panel');
      const escribir = (operacion, g1, g2) => {
        formulario.querySelector('[name="operacion"]').value = operacion;
        for (const [nombre, valor] of [['aristas1', g1], ['aristas2', g2]]) {
          const campo = formulario.querySelector(`[name="${nombre}"]`);
          campo.value = valor;
          campo.dispatchEvent(new Event('input', { bubbles: true }));
        }
      };
      const crear = (...datos) => {
        escribir(...datos);
        formulario.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      };
      const resaltados = () => [...document.querySelectorAll('.operacion-grafos__par--evaluacion')].map((g) => g.dataset.par);

      escribir('cartesiano', '1 2\n2 3', 'a b');
      afirmar(document.querySelectorAll('.grafo--operando').length === 2 && !document.querySelector('.grafo--resultado'),
        'mientras se escribe, se ven los dos operandos y todavía no el resultado');
      afirmar(document.querySelector('.operacion-grafos__simbolo').textContent === '⊕', 'el producto cartesiano lleva ⊕');

      crear('cartesiano', '1 2\n2 3', 'a b');
      afirmar(document.querySelectorAll('.operacion-grafos__par').length === 6, 'G₁ ⊕ G₂: seis pares, uno por (u, v)');
      for (let i = 0; i < 2; i++) control('siguiente').click();
      afirmar(resaltados().join(' ') === '(2, a) (2, b)', `vértice 2 de G₁: se resalta la fila 2 (${resaltados().join(' ')})`);
      afirmar(document.querySelectorAll('.grafo--resultado .grafo__arista--evaluacion').length === 1,
        'y su arista nueva va en naranja');
      afirmar(document.querySelectorAll('.grafo--resultado .grafo__arista--pendiente').length === 5,
        'las cinco que faltan, punteadas');
      afirmarGrafoCabe('producto cartesiano, una fila');
      agotarTraza(10);
      const cuenta = document.querySelector('.coloreo-formula');
      afirmar(!!cuenta && cuenta.textContent.includes('= 3 · 1 + 2 · 2 = 7'), `al terminar, |A| = 7 con su fórmula (${cuenta ? cuenta.textContent : 'nada'})`);
      afirmar(!document.querySelector('.grafo__arista--pendiente'), 'y no queda ninguna punteada');

      control('editar-configuracion').click();
      crear('tensorial', '1 2\n2 3', 'a b');
      agotarTraza(10);
      afirmar(!!aviso() && aviso().textContent.includes('4 aristas'), `G₁ ⊗ G₂: 4 aristas (${aviso() ? aviso().textContent.trim() : 'sin aviso'})`);

      control('editar-configuracion').click();
      crear('composicion', 'a b\nb c\nc d\nd a', '1 2\n2 3\n1 3\n4');
      agotarTraza(20);
      afirmar(document.querySelectorAll('.grafo--resultado .grafo__arista').length === 76,
        `G₁[G₂] de 4 × 4: 4 · 3 + 4² · 4 = 76 aristas (${document.querySelectorAll('.grafo--resultado .grafo__arista').length})`);
      afirmarGrafoCabe('composición de 4 × 4');

      // Se abre desde las recientes con el resultado dibujado.
      document.querySelector('.pantalla-tema__volver').click();
      const pastilla = [...document.querySelectorAll('.tira-recientes__item')].find((el) => el.textContent.includes('Operaciones'));
      afirmar(!!pastilla && pastilla.textContent.includes('G₁[G₂]'), `la reciente dice la operación (${pastilla ? pastilla.textContent : 'ninguna'})`);
      if (pastilla) {
        pastilla.click();
        afirmar(document.querySelectorAll('.operacion-grafos__par').length === 16, 'y al abrirla vuelve el resultado de 16 vértices');
        document.querySelector('.pantalla-tema__volver').click();
      }
    }

    // El grafo y su matriz caben en el lienzo, sin desplazarse y sin bajar
    // de la mitad, y no quedan debajo del panel del cálculo.
    function afirmarGrafoCabe(contexto) {
      for (const animacion of document.getAnimations()) animacion.finish();
      const caja = document.querySelector('.estructura-grafo');
      const encogida = parseFloat(caja.style.zoom) || 1;
      afirmar(caja.scrollWidth <= caja.clientWidth + 1 && caja.scrollHeight <= caja.clientHeight + 1,
        `${contexto}: el grafo y la matriz caben sin desplazarse (${caja.scrollWidth}×${caja.scrollHeight} en ${caja.clientWidth}×${caja.clientHeight}, ${encogida.toFixed(2)}×)`);
      afirmar(encogida >= 0.5, `${contexto}: no se encogen por debajo de 0,5× (${encogida.toFixed(2)}×)`);
      const calculo = document.querySelector('.lienzo__escenario .calculo');
      if (calculo && calculo.getClientRects().length && getComputedStyle(calculo).opacity !== '0') {
        const a = caja.getBoundingClientRect();
        const b = calculo.getBoundingClientRect();
        const encima = a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
        afirmar(!encima, `${contexto}: el panel del cálculo no tapa la matriz`);
      }
    }

    // Las recientes del menú se abren como las dejó el estudiante (pedido del
    // usuario, 2026-10-21; CLAUDE.md 10.4): se guardan tras cada operación,
    // ya consumada aunque se salga a la mitad, y abrir una no la duplica.
    function recientesQueSeAbren() {
      registro.push('', '── Recientes que se abren ──');
      try { window.localStorage.removeItem('cc2:recientes'); } catch (error) { /* sin almacenamiento */ }
      const guardadas = () => CC2.persistencia.recientes.obtener();
      const pastillas = () => [...document.querySelectorAll('.tira-recientes__item')];
      const volver = () => document.querySelector('.pantalla-tema__volver').click();
      const clavesEnPantalla = () => [...document.querySelectorAll('.estructura-horizontal .casilla')]
        .map((casilla) => casilla.dataset.clave).filter((clave) => !clave.startsWith('vacia-'));

      entrarATema('Búsqueda secuencial');
      let formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 12, l: 2 });
      for (const clave of [10, 20, 30]) operar(formularios, 'insertar', clave);
      // Se sale con la cuarta inserción recién empezada: la reciente la tiene.
      operar(formularios, 'insertar', 40);
      volver();

      afirmar(pastillas().length === 1, `al volver, el menú muestra una reciente (${pastillas().length})`);
      const pastilla = pastillas()[0];
      afirmar(
        pastilla && pastilla.textContent.includes('Búsqueda secuencial') && pastilla.textContent.includes('4 claves'),
        `la pastilla dice el tema y cuántas claves tiene (${pastilla ? pastilla.textContent : 'ninguna'})`
      );
      afirmar(
        pastilla && pastilla.tagName === 'BUTTON' && pastilla.title.includes('.cc2'),
        'la pastilla es un botón, y su título dice que la copia real es el archivo .cc2'
      );

      pastilla.click();
      const titulo = document.querySelector('.pantalla-tema h1');
      afirmar(titulo && titulo.textContent === 'Búsqueda secuencial', `abrirla entra a su tema (${titulo ? titulo.textContent : 'nada'})`);
      afirmar(
        clavesEnPantalla().join(',') === '10,20,30,40',
        `con las claves como quedaron, la inserción interrumpida incluida (${clavesEnPantalla().join(',')})`
      );
      afirmar(
        document.querySelector('.bitacora').textContent.includes('Estructura reciente abierta'),
        'la bitácora dice que se abrió una reciente, no un archivo'
      );

      formularios = [...document.querySelectorAll('form.panel')];
      operar(formularios, 'eliminar', 20);
      volver();
      const deSecuencial = guardadas().filter((item) => item.tema === 'secuencial');
      afirmar(
        deSecuencial.length === 1 && deSecuencial[0].datos.claves.join(',') === '10,30,40',
        `seguir trabajando actualiza la misma reciente, sin duplicarla (${deSecuencial.map((item) => item.datos.claves.join(',')).join(' | ')})`
      );

      // Un árbol se crea solo al entrar: abrirlo desde la reciente no tiene
      // que dejar otra reciente vacía en la lista.
      entrarATema('Árbol de búsqueda digital');
      formularios = [...document.querySelectorAll('form.panel')];
      for (const letra of ['c', 'a']) operar(formularios, 'insertar', letra);
      volver();
      pastillas().find((boton) => boton.textContent.includes('Árbol de búsqueda digital')).click();
      volver();
      const deArbol = guardadas().filter((item) => item.tema === 'arbol-digital');
      afirmar(
        deArbol.length === 1 && deArbol[0].datos.claves.length === 2,
        `el árbol abierto desde su reciente no deja otra vacía (${deArbol.map((item) => item.datos.claves.length).join(' | ')})`
      );
      afirmar(pastillas()[0].textContent.includes('Árbol de búsqueda digital'), 'la última tocada va primero');

      // Los temas que se abren distinto: cubetas expandida —su `n` cambió—,
      // Huffman —se guarda su palabra— e índices —sin claves, sus parámetros—.
      const abrirReciente = (tema) => pastillas().find((boton) => boton.textContent.includes(tema)).click();
      const metricas = () => [...document.querySelectorAll('.metrica__valor')].map((el) => el.textContent);
      const sinError = () => !document.querySelector('.pantalla-tema__alertas .alerta--error');

      entrarATema('Otras búsquedas dinámicas');
      formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 2, r: 3, modoExpansion: 'total', umbralExpandir: 82, umbralReducir: 125 });
      for (const clave of [15, 26, 48, 79, 35, 62]) operar(formularios, 'insertar', clave);
      volver();
      abrirReciente('Otras búsquedas dinámicas');
      afirmar(sinError() && metricas()[2] === '4', `cubetas expandida se abre con n = 4 (n = ${metricas()[2]})`);
      volver();

      entrarATema('Árbol de Huffman');
      const panelHuffman = document.querySelector('form.panel');
      panelHuffman.querySelector('[name="palabra"]').value = 'ciencias';
      panelHuffman.querySelector('[data-accion="insertar-palabra"]').click();
      volver();
      abrirReciente('Árbol de Huffman');
      afirmar(
        sinError() && document.querySelectorAll('.bosque__arbol').length === 1 && !!document.querySelector('.tabla-codigos'),
        'Huffman se abre con el árbol de su palabra ya construido'
      );
      volver();

      entrarATema('Índices primarios, secundarios y multinivel');
      formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { r: 500000, B: 4096, R: 120, Ri: 15, tipo: 'primario', niveles: 'un-nivel' });
      volver();
      abrirReciente('Índices');
      afirmar(
        sinError() && document.querySelector('.bitacora').textContent.includes('Estructura reciente abierta'),
        'índices se abre con sus parámetros'
      );
      volver();
      afirmar(
        guardadas().length === CC2.persistencia.recientes.MAXIMO,
        `la lista no pasa de ${CC2.persistencia.recientes.MAXIMO} (${guardadas().length})`
      );
    }

    // El deslizador crece hacia la derecha porque se llama «Velocidad»: a la
    // derecha va más rápido (pedido del usuario, 2026-08-30). Lo que el
    // reproductor consume es lo contrario —el tiempo entre pasos—, así que la
    // conversión se comprueba por los dos extremos: si alguien la olvidara, el
    // deslizador seguiría moviéndose y la traza iría al revés de lo que dice.
    function controlDeVelocidad() {
      registro.push('', '── Control de velocidad ──');

      entrarATema('Búsqueda secuencial');

      const formularios = [...document.querySelectorAll('form.panel')];
      enviar(formularios[0], { n: 16, l: 2 });
      for (const clave of [10, 20, 30]) operar(formularios, 'insertar', clave);
      operar(formularios, 'buscar', 30);

      const deslizador = document.querySelector('[data-control="velocidad"]');
      const lectura = document.querySelector('[data-salida="velocidad"]');
      afirmar(!!deslizador && !!lectura, 'el deslizador viene con su lectura en segundos al lado');

      const leerEn = (valor) => {
        deslizador.value = String(valor);
        deslizador.dispatchEvent(new Event('input', { bubbles: true }));
        return lectura.textContent.trim();
      };

      const izquierda = leerEn(deslizador.min);
      const derecha = leerEn(deslizador.max);
      registro.push(`  izquierda: ${izquierda} · derecha: ${derecha}`);
      afirmar(izquierda === '4,0 s', `el extremo izquierdo es el más lento (dice ${izquierda})`);
      afirmar(derecha === '0,2 s', `el extremo derecho es el más rápido (dice ${derecha})`);

      // El punto medio del recorrido tiene que caer en el medio del tiempo:
      // si la conversión dejara de ser un espejo, los extremos podrían seguir
      // bien y el centro no.
      const medio = leerEn((Number(deslizador.min) + Number(deslizador.max)) / 2);
      afirmar(medio === '2,1 s', `la mitad del recorrido es la mitad del tiempo (dice ${medio})`);

      document.querySelector('.pantalla-tema__volver').click();
    }
  </script>
